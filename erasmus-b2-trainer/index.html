ols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.card h3{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.big-number{font-size:34px;font-weight:900}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;color:#334155}.pill.good{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.pill.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}.pill.bad{border-color:#fecaca;background:#fef2f2;color:#991b1b}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:#fff;font-weight:800}.btn:hover{background:var(--brand2)}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.secondary:hover{background:#cbd5e1}.btn.ghost{background:transparent;color:#1d4ed8;border:1px solid #bfdbfe}.btn.good{background:var(--good)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);width:0}.progress.thin{height:6px}.module-card{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center}.module-index{width:42px;height:42px;border-radius:14px;background:#e0edff;display:grid;place-items:center;font-weight:900;color:#1d4ed8}.module-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#94a3b8}.status-dot.good{background:#22c55e}.status-dot.warn{background:#f59e0b}.status-dot.bad{background:#ef4444}.question-box{border:1px solid var(--line);background:#fff;border-radius:20px;padding:20px}.question-prompt{font-size:22px;font-weight:850;line-height:1.35 und:#fff;border-radius:22px;padding:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f5f9;border:1px solid #dbe3ef;padding:2px 6px;border-radius:7px}.textarea{width:100%;min-height:220px;border:1px solid #cbd5e1;border-radius:16px;padding:14px;line-height:1.5}.lock{opacity:.55}.source-note{font-size:12px;color:#64748b;line-height:1.45}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:#dbe3ef}.timeline .module-card{position:relative;background:#fff}.empty{border:2px dashed #cbd5e1;border-radius:18px;padding:24px;text-align:center;color:#64748b;background:#f8fafc}.mobile-only{display:none}

-card.recommended{outline:3px solid #bfdbfe}.sticky-mobile-cta{display:none}
@media (max-width: 960px){.stepper{grid-template-columns:1fr}.lesson-shell{grid-template-columns:1fr}.lesson-rail{position:static}.rubric{grid-template-columns:1fr 1fr}.focus-strip{top:56px}.sticky-mobile-cta{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:45;background:#0f172a;color:#fff;border-radius:16px;padding:10px;box-shadow:var(--shadow);gap:8px}.sticky-mobile-cta .btn{width:100%}}

<script>
const MODULES = [{"id": "exam_strategy", "title": "Estrategia de examen B2", "group": "Base", "priority": 10, "goal": "Entender qué te pueden pedir y cómo no perderte.", "theory": {"remember": "No estudias “inglés infinito”: estudias formatos de prueba. En B2 suelen mezclar gramática + vocabulario + lectura + writing.", "formula": "Leer consigna → detectar tipo de ejercicio → buscar pista del contexto → responder → revisar trampa típica.", "clues": ["Opciones A/B/C/D = suelen mirar collocations, phrasal verbs o matices.", "Hueco sin opciones = casi siempre palabra gramatical: preposición, auxiliar, pronombre, artículo, linker.", "Palabra base en mayúsculas = cambia familia de palabra: noun/adjective/adverb/negative.", "Reescritura = mismo significado, otra estructura. No inventes información."], "wrong_right": [["I answer fast because I know the topic.", "Primero identifico el formato: cloze, word formation, transformation, reading o writing."], ["I translate literally from Spanish.", "Busco la estructura inglesa que encaja."]], "exam_move": "Cuando te bloquees, no pienses “no sé inglés”. Pregunta: ¿qué tipo de hueco es? ¿verbo, preposición, conector, palabra derivada?", "common_trap": "Leer demasiado rápido y contestar por intuición española."}}, {"id": "present_simple_continuous", "title": "Present Simple vs Present Continuous", "group": "Tenses", "priority": 7, "goal": "Distinguir rutina/verdad general de acción temporal/ahora.", "theory": {"remember": "Present Simple = rutina o verdad general. Present Continuous = ahora o situación temporal.", "formula": "Simple: subject + verb / does. Continuous: am/is/are + verb-ing.", "clues": ["usually, always, often, every day → Present Simple", "now, at the moment, today, this week → Present Continuous", "stative verbs como know, like, believe normalmente NO van en continuous"], "wrong_right": [["I am knowing the answer.", "I know the answer."], ["She works today because her colleague is ill.", "She is working today because her colleague is ill."]], "exam_move": "Mira si habla de hábito o de algo temporal. Si aparece “this week”, sospecha continuous.", "common_trap": "Poner -ing a verbos de estado: know, believe, understand, like."}}, {"id": "past_simple_continuous", "title": "Past Simple vs Past Continuous", "group": "Tenses", "priority": 7, "goal": "Narrar pasado: acción puntual vs acción en progreso.", "theory": {"remember": "Past Continuous pinta el fondo; Past Simple cuenta el golpe/acción que interrumpe.", "formula": "Past Simple: verb-ed / irregular. Past Continuous: was/were + verb-ing.", "clues": ["when + acción corta → Past Simple", "while + acción larga → Past Continuous", "at 8 yesterday → often Past Continuous"], "wrong_right": [["While I walked home, it started to rain.", "While I was walking home, it started to rain."], ["I was seeing him yesterday.", "I saw him yesterday."]], "exam_move": "Busca dos acciones: la larga suele ir en continuous; la corta en simple.", "common_trap": "Usar continuous con verbos que no suelen llevarlo o con acciones cerradas."}}, {"id": "present_perfect_past_simple", "title": "Present Perfect vs Past Simple", "group": "Tenses", "priority": 10, "goal": "Tu bloque crítico: conectar pasado con presente o cerrar el pasado.", "theory": {"remember": "Present Perfect = pasado conectado con ahora. Past Simple = pasado terminado y localizado.", "formula": "Present Perfect: have/has + participle. Past Simple: verb-ed / irregular past.", "clues": ["since, for, already, yet, ever, never, just, recently → Present Perfect", "yesterday, last year, in 2020, ago, when I was… → Past Simple", "ever/never preguntan experiencia hasta ahora"], "wrong_right": [["I saw that film three times.", "I have seen that film three times."], ["I have seen him yesterday.", "I saw him yesterday."]], "exam_move": "Subraya la palabra de tiempo. Si es tiempo terminado, Past Simple. Si conecta con ahora, Present Perfect.", "common_trap": "Usar “spoke” como participio: debe ser “spoken”."}}, {"id": "present_perfect_simple_cont", "title": "Present Perfect Simple vs Continuous", "group": "Tenses", "priority": 8, "goal": "Diferenciar resultado de duración/proceso.", "theory": {"remember": "Simple mira el resultado; continuous mira la duración o actividad en progreso hasta ahora.", "formula": "Simple: have/has + participle. Continuous: have/has been + verb-ing.", "clues": ["how many / result / completed → simple", "how long / all day / recently + actividad → continuous", "state verbs suelen ir en simple: I have known"], "wrong_right": [["I have been knowing him for years.", "I have known him for years."], ["She has written three emails all morning.", "She has written three emails this morning / She has been writing emails all morning."]], "exam_move": "Pregunta mental: ¿importa cuánto ha conseguido o cuánto lleva haciéndolo?", "common_trap": "Usar continuous con know, own, believe."}}, {"id": "irregular_participles", "title": "Irregular verbs & participles", "group": "Tenses", "priority": 10, "goal": "No perder puntos por formas básicas: gone, eaten, seen, written, spoken, taken, broken.", "theory": {"remember": "Past Simple y participio NO siempre son iguales. Present Perfect y Past Perfect usan participio.", "formula": "Past Simple: I spoke. Present Perfect: I have spoken. Past Perfect: I had spoken.", "clues": ["have/has/had + ___ → participio", "did + infinitive → Did you go? no Did you went?", "by the time / already + had → participio"], "wrong_right": [["I have spoke.", "I have spoken."], ["Did you went?", "Did you go?"], ["She has wrote it.", "She has written it."]], "exam_move": "Si ves have/has/had delante, activa modo participio.", "common_trap": "Confundir “broke” pasado con “broken” participio."}}, {"id": "past_perfect", "title": "Past Perfect & Past Perfect Continuous", "group": "Tenses", "priority": 8, "goal": "Ordenar dos pasados: qué ocurrió antes.", "theory": {"remember": "Past Perfect marca la acción anterior a otra acción pasada.", "formula": "Past Perfect: had + participle. Past Perfect Continuous: had been + verb-ing.", "clues": ["by the time, before, after, already + pasado", "dos acciones pasadas: una va antes de la otra", "duration before a past moment → had been + ing"], "wrong_right": [["When I arrived, she left already.", "When I arrived, she had already left."], ["They had been waited for an hour.", "They had been waiting for an hour."]], "exam_move": "Dibuja una línea temporal: pasado anterior = had + participle.", "common_trap": "Usarlo en cualquier pasado aunque no haga falta."}}, {"id": "future_forms", "title": "Future forms", "group": "Tenses", "priority": 8, "goal": "Elegir will, going to, present continuous o present simple.", "theory": {"remember": "No todo futuro es “will”. Cada forma tiene una intención.", "formula": "will = decisión/predicción; going to = plan/evidencia; present continuous = arreglo concreto; present simple = horarios.", "clues": ["Look at those clouds → going to", "I think/probably → will", "meeting at 6 with person/place → present continuous", "train/class starts → present simple"], "wrong_right": [["Look at the sky. It will rain.", "Look at the sky. It is going to rain."], ["The train is going to leave at 8.", "The train leaves at 8."]], "exam_move": "Pregunta: ¿es decisión espontánea, plan, evidencia o horario?", "common_trap": "Usar will para todo."}}, {"id": "conditionals", "title": "Conditionals", "group": "Grammar B2", "priority": 9, "goal": "Dominar if/unless/provided + condicionales 0,1,2,3 y mixed.", "theory": {"remember": "Los condicionales mezclan tiempo verbal con probabilidad/realidad.", "formula": "0: if + present, present. 1: if + present, will. 2: if + past, would. 3: if + past perfect, would have + participle.", "clues": ["general truth → zero", "real future → first", "imaginary present → second", "imaginary past/regret → third", "unless = if not"], "wrong_right": [["If I will see him, I will tell him.", "If I see him, I will tell him."], ["If I knew, I would have helped.", "If I had known, I would have helped."]], "exam_move": "Mira si habla de futuro real, presente imaginario o pasado imposible.", "common_trap": "Poner will justo después de if en first conditional."}}, {"id": "passive_voice", "title": "Passive voice", "group": "Grammar B2", "priority": 8, "goal": "Cambiar foco: de quien hace la acción a la cosa/persona afectada.", "theory": {"remember": "Pasiva = be + participle. Se usa cuando importa más el objeto que quien hizo la acción.", "formula": "Object + be + participle (+ by agent).", "clues": ["by + persona puede aparecer, pero muchas veces se omite", "was/were + participle para pasado", "has/have been + participle para present perfect passive"], "wrong_right": [["The report wrote yesterday.", "The report was written yesterday."], ["The emails have sent.", "The emails have been sent."]], "exam_move": "Busca el objeto de la activa y ponlo como sujeto. Luego ajusta be al tiempo correcto.", "common_trap": "Olvidar el verbo “be”."}}, {"id": "reported_speech", "title": "Reported speech", "group": "Grammar B2", "priority": 8, "goal": "Contar lo que alguien dijo sin repetirlo literal.", "theory": {"remember": "Reported speech suele mover el tiempo un paso atrás si el reporting verb está en pasado.", "formula": "“I am tired” → She said she was tired. Questions: asked if / asked where + subject + verb.", "clues": ["said/told/asked", "comillas desaparecen", "pregunta indirecta NO usa orden de pregunta"], "wrong_right": [["She said me she was tired.", "She told me she was tired. / She said she was tired."], ["He asked where was I.", "He asked where I was."]], "exam_move": "Cambia pronombres, tiempo verbal y orden de pregunta.", "common_trap": "Usar “said me” o mantener orden de pregunta."}}, {"id": "modal_verbs", "title": "Modal verbs", "group": "Grammar B2", "priority": 8, "goal": "Obligación, consejo, posibilidad, deducción y crítica del pasado.", "theory": {"remember": "Los modales cambian el grado de seguridad u obligación.", "formula": "modal + infinitive. Modal perfect: modal + have + participle.", "clues": ["must = obligación/deducción fuerte", "might/may/could = posibilidad", "can’t = imposibilidad/deducción negativa", "should have + participle = crítica del pasado"], "wrong_right": [["You must to study.", "You must study."], ["He must be at home; I saw his car.", "He must be at home; I saw his car."], ["You should studied.", "You should have studied."]], "exam_move": "Pregunta: ¿habla de obligación, consejo o deducción?", "common_trap": "Poner “to” después de must/should/can."}}, {"id": "relative_clauses", "title": "Relative clauses", "group": "Grammar B2", "priority": 7, "goal": "Unir información con who, which, that, where, whose.", "theory": {"remember": "Relative clauses añaden información sobre una persona, cosa, lugar o posesión.", "formula": "Person → who/that. Thing → which/that. Place → where. Possession → whose.", "clues": ["coma = información extra; no uses that en non-defining", "whose + noun = posesión", "where = lugar"], "wrong_right": [["The man which called you is here.", "The man who called you is here."], ["Madrid, that is big, is expensive.", "Madrid, which is big, is expensive."]], "exam_move": "Identifica qué palabra estás describiendo: persona, cosa, lugar o posesión.", "common_trap": "Usar “which” para personas o “that” entre comas."}}, {"id": "articles_quantifiers", "title": "Articles & quantifiers", "group": "Grammar B2", "priority": 7, "goal": "A/the/zero y cantidad: much, many, few, little, each, every.", "theory": {"remember": "Articles dependen de si hablamos de algo general, nuevo o conocido.", "formula": "a/an = uno no específico; the = específico/conocido; zero = plural/uncountable general.", "clues": ["first mention → a/an", "second mention → the", "general plural → no article", "uncountable: much/little; countable: many/few"], "wrong_right": [["The people need the money.", "People need money."], ["I have many information.", "I have a lot of information."]], "exam_move": "Pregunta: ¿hablo en general o de algo concreto?", "common_trap": "Poner “the” porque en español usamos “la/el”."}}, {"id": "prepositions_collocations", "title": "Prepositions & collocations", "group": "Use of English", "priority": 9, "goal": "Aprender combinaciones fijas que caen mucho.", "theory": {"remember": "Muchas preposiciones no se razonan: se aprenden como pack.", "formula": "adjective/verb/noun + preposition: interested in, depend on, responsible for, good at.", "clues": ["interested in", "depend on", "responsible for", "afraid of", "arrive at/in", "on time vs in time"], "wrong_right": [["I am interested on Erasmus.", "I am interested in Erasmus."], ["It depends of the result.", "It depends on the result."]], "exam_move": "No traduzcas “en/de”. Aprende el bloque entero.", "common_trap": "Traducir desde español: depender de → depend of, pero en inglés es depend on."}}, {"id": "gerunds_infinitives", "title": "Verb patterns: -ing / to", "group": "Use of English", "priority": 8, "goal": "Saber qué verbos piden gerundio o infinitivo.", "theory": {"remember": "Algunos verbos piden -ing, otros to + infinitive. Es vocabulario gramatical.", "formula": "enjoy/avoid/mind + ing. decide/want/hope + to. let/make + infinitive without to.", "clues": ["enjoy doing", "avoid doing", "decide to do", "want to do", "stop doing vs stop to do"], "wrong_right": [["I enjoy to play football.", "I enjoy playing football."], ["She decided going abroad.", "She decided to go abroad."]], "exam_move": "Aprende el verbo junto con lo que exige: enjoy doing, decide to do.", "common_trap": "Elegir por traducción española."}}, {"id": "linkers_clauses", "title": "Linkers & clauses", "group": "Use of English", "priority": 9, "goal": "Conectar ideas en writing y resolver huecos B2.", "theory": {"remember": "Los conectores dan lógica: contraste, causa, resultado, propósito o condición.", "formula": "although + clause; despite + noun/-ing; because + clause; because of + noun; so that + clause.", "clues": ["although/even though = contraste + frase", "despite/in spite of = contraste + nombre o -ing", "however = conector entre frases", "therefore/as a result = consecuencia"], "wrong_right": [["Despite it was raining, we went out.", "Although it was raining, we went out. / Despite the rain, we went out."], ["Because the traffic, I was late.", "Because of the traffic, I was late."]], "exam_move": "Mira lo que viene después: frase completa o nombre/-ing.", "common_trap": "Confundir although con despite."}}, {"id": "open_cloze", "title": "Open cloze", "group": "Exam parts", "priority": 10, "goal": "Rellenar huecos sin opciones: auxiliares, preposiciones, artículos, linkers.", "theory": {"remember": "Open cloze no suele pedir palabras raras. Pide palabras pequeñas que sostienen la frase.", "formula": "Hueco → mira antes y después → decide función: auxiliary, preposition, article, pronoun, linker.", "clues": ["have/has + participle", "interested ___ = in", "a/the/zero", "although/however/because", "too/enough, so/such"], "wrong_right": [["I have lived here ___ 2020 → for", "I have lived here since 2020."], ["She is good ___ maths → in", "She is good at maths."]], "exam_move": "No busques vocabulario bonito. Busca la pieza gramatical que falta.", "common_trap": "Poner una palabra de significado cuando falta una palabra funcional."}}, {"id": "word_formation", "title": "Word formation", "group": "Exam parts", "priority": 10, "goal": "Cambiar familias de palabras: noun, adjective, adverb, negative.", "theory": {"remember": "No cambias el significado libremente: cambias la categoría para que encaje.", "formula": "success → successful → successfully. possible → impossible. inform → information.", "clues": ["before noun → adjective", "after verb / modifies adjective → adverb", "after article/preposition → noun", "negative context → prefix: un-, in-, im-, dis-"], "wrong_right": [["The exam was success.", "The exam was successful."], ["She answered careful.", "She answered carefully."]], "exam_move": "Mira el hueco como pieza de Lego: ¿necesito noun, adjective, adverb o verb?", "common_trap": "Poner la palabra base sin adaptarla."}}, {"id": "transformations", "title": "Key word transformations", "group": "Exam parts", "priority": 10, "goal": "Reescribir con mismo significado usando palabra obligatoria.", "theory": {"remember": "No traduzcas: conserva significado y usa la estructura que pide la keyword.", "formula": "Keyword no se cambia. Normalmente 2-5 palabras. Estructuras típicas: too/enough, wish, despite, unless, passive, reported, comparative.", "clues": ["although ↔ despite", "if not ↔ unless", "active ↔ passive", "I regret ↔ I wish", "same meaning exacto"], "wrong_right": [["Although it rained, we went out. DESPITE → Despite it rained...", "Despite the rain, we went out."], ["I regret not studying. WISH → I wish I study...", "I wish I had studied."]], "exam_move": "Identifica la transformación, no inventes una frase nueva.", "common_trap": "Cambiar la keyword o cambiar el significado."}}, {"id": "reading", "title": "Reading B2", "group": "Exam parts", "priority": 8, "goal": "Leer con objetivo: gist, detail, attitude, reference, matching.", "theory": {"remember": "En reading B2 no basta con entender palabras: hay que entender intención, contraste y evidencia.", "formula": "Pregunta → localizar zona → subrayar evidencia → descartar distractores.", "clues": ["opinion/attitude: look for adjectives and contrast", "detail: locate exact evidence", "reference: what does “this/it/they” refer to?", "matching: scan keywords and synonyms"], "wrong_right": [["Elijo una opción porque tiene palabras parecidas.", "Elijo la opción que coincide con la idea, aunque use sinónimos."]], "exam_move": "Primero lee pregunta, luego texto. Las opciones trampa suelen copiar palabras del texto pero cambiar la idea.", "common_trap": "Responder por “me suena” sin prueba en el texto."}}, {"id": "writing", "title": "Writing B2", "group": "Exam parts", "priority": 9, "goal": "Escribir textos claros de 140-190 palabras con estructura B2.", "theory": {"remember": "Writing B2 premia claridad, organización, rango y control. No necesitas sonar nativo; necesitas sonar ordenado.", "formula": "Essay: intro → idea 1 → idea 2 → own idea/opinion → conclusion. Email/report/review: formato + propósito claro.", "clues": ["140-190 words", "answer all bullet points", "use linkers", "avoid repetir always good/bad", "check verb tenses and articles"], "wrong_right": [["I think this because yes.", "One reason is that it gives students more independence."], ["No paragraphs.", "4 paragraphs clear."]], "exam_move": "Antes de escribir: tipo de texto, destinatario, 3 ideas, 6 conectores seguros.", "common_trap": "Escribir mucho sin estructura y con frases demasiado largas."}}, {"id": "listening", "title": "Listening tracker", "group": "Skills", "priority": 5, "goal": "Registrar práctica de listening aunque la prueba escrita sea prioridad.", "theory": {"remember": "Listening se mejora con repetición corta y activa, no con vídeos de fondo.", "formula": "Listen → answer/check → replay → note 3 words → shadow 2 sentences.", "clues": ["opinions often come after but/however", "listen for stress and synonyms", "names/numbers need precision"], "wrong_right": [["Pongo Netflix de fondo.", "Hago 10 minutos activos con preguntas y repetición."]], "exam_move": "Si hay listening, escucha la segunda vez para confirmar, no para entender todo desde cero.", "common_trap": "Querer entender el 100% y bloquearte."}}];

answer": ["boils"], "options": ["boils", "is boiling", "boiled", "has boiled"], "explanation": "Regla: rutina/verdad general = present simple; ahora/temporal = present continuous Pista: verdad general", "clue": "verdad general", "trap": "No uses continuous para todo lo que ocurre en presente.", "theory": "present_simple_continuous", "passage": null, "keyWord": null, "baseWord": null, "examPart": "Part 1/Grammar · Multiple choice", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0005", "module": "present_simple_continuous", "type": "mcq", "prompt": "I ___ what you mean.", "answer": ["understand"], "options": ["understand", "am understanding", "understood", "have understanding"], "explanation": "Regla: rutina/verdad general = present simple; ahora/temporal = present continuous Pista: understand = state verb", "clue": "understand = state verb", "trap": "No uses continuous para todo lo que ocurre en presente.", "theory": "present_simple_continuous", "passage": null, "keyWord": null, "baseWord": null, "examPart": "Part 1/Grammar · Multiple choice", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0006", "module": "present_simple_continuous", "type": "mcq", "prompt": "My brother ___ football every Sunday.", "answer": ["plays"], "options": ["plays", "is playing", "play", "has played"], "explanation": "Regla: rutina/verdad general = present simple; ahora/temporal = present continuous Pista: every Sunday = hábito", "clue": "every Sunday = hábito", "trap": "No uses continuous para todo lo que ocurre en presente.", "theory": "present_simple_continuous", "passage": null, "keyWord": null, "baseWord": null, "examPart": "Part 1/Grammar · Multiple choice", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0007", "module": "present_simple_continuous", "type": "mcq", "prompt": "Look! The children ___ in the garden.", "answer": ["are playing"], "options": ["play", "are playing", "played", "have played"], "explanation": "Regla: rutina/verdad general = p rnt hundreds of new words, but because she stopped repeating the same errors.", "keyWord": null, "baseWord": null, "examPart": "Reading", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0220", "module": "reading", "type": "mcq", "prompt": "What does the text say about long sentences?", "answer": ["they are not always better"], "options": ["they always improve your mark", "they are not always better", "they are required in B2", "they should be avoided completely"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: prefer clear organisation", "clue": "prefer clear organisation", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Many students believe that writing in English means using long and complicated sentences. In fact, examiners usually prefer clear organisation. A simple essay with four well-connected paragraphs can be more effective than a text full of impressive words used incorrectly. The best candidates answer the question directly, support their ideas with examples and leave enough time to check grammar and spelling.", "keyWord": null, "baseWord": null, "examPart": "Reading", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0221", "module": "reading", "type": "mcq", "prompt": "What do best candidates do?", "answer": ["answer directly and support ideas"], "options": ["write as much as possible", "avoid examples", "answer directly and support ideas", "use only simple vocabulary"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: answer directly", "clue": "answer directly", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Many students believe that writing in English means using long and complicated sentences. In fact, examiners usually prefer clear organisation. A simple essay with four well-connected paragraphs can be more effective than a text full of impressive words used incorrectly. The best candidates answer the question directly, support their ideas with examples and leave enough time to check grammar and spelling.", "keyWord": null, "baseWord": null, "examPart": "Reading", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0222", "module": "reading", "type": "mcq", "prompt": "What should students leave time for?", "answer": ["checking grammar and spelling"], "options": ["learning new topics", "checking grammar and spelling", "speaking practice", "copying the question"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: leave enough time", "clue": "leave enough time", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Many students believe that writing in English means using long and complicated sentences. In fact, examiners usually prefer clear organisation. A simple essay with four well-connected paragraphs can be more effective than a text full of impressive words used incorrectly. The best candidates answer the question directly, support their ideas with examples and leave enough time to check grammar and spelling.", "keyWord": null, "baseWord": null, "examPart": "Reading", "difficulty": "B2", "answerFormat": "CHOOSE_ONE"}, {"id": "q0223", "module": "reading", "type": "mcq", "prompt": "What is the main warning in the text?", "answer": ["gamification can distract from learning"], "options": ["points are always bad", "badges should be removed", "gamification can distract from learning", "progress bars never help"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: can become a distraction", "clue": "can become a distraction", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Online learning platforms often use points, badges and progress bars to motivate users. These tools can be helpful when they show real progress, but they can also become a distraction. If a learner focuses only on earning po function normalize(s){return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]$/,'').replace(/\s+/g,' ')}
function looseNormalize(s){return normalize(expandContractions(s)).replace(/[-–—]/g,' ').replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
function expandContractions(s){return String(s||'').toLowerCase()
  .replace(/can't/g,'cannot').replace(/won't/g,'will not').replace(/n't/g,' not')
  .replace(/i'm/g,'i am').replace(/he's/g,'he is').replace(/she's/g,'she is').replace(/it's/g,'it is')
  .replace(/we're/g,'we are').replace(/they're/g,'they are').replace(/you're/g,'you are')
  .replace(/i've/g,'i have').replace(/we've/g,'we have').replace(/they've/g,'they have').replace(/you've/g,'you have')
  .replace(/i'd/g,'i would').replace(/he'd/g,'he would').replace(/she'd/g,'she would').replace(/we'd/g,'we would').replace(/they'd/g,'they would')
  .replace(/i'll/g,'i will').replace(/he'll/g,'he will').replace(/she'll/g,'she will').replace(/we'll/g,'we will').replace(/they'll/g,'they will')}
function levenshtein(a,b){a=looseNormalize(a);b=looseNormalize(b); const m=a.length,n=b.length; if(!m)return n;if(!n)return m; const dp=Array.from({length:m+1},()=>Array(n+1).fill(0)); for(let i=0;i<=m;i++)dp[i][0]=i; for(let j=0;j<=n;j++)dp[0][j]=j; for(let i=1;i<=m;i++){for(let j=1;j<=n;j++){const cost=a[i-1]===b[j-1]?0:1; dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+cost)}} return dp[m][n]}
function tokenOverlap(a,b){ const A=looseNormalize(a).split(' ').filter(Boolean), B=looseNormalize(b).split(' ').filter(Boolean); if(!B.length)return 0; const setA=new Set(A); return B.filter(x=>setA.has(x)).length/B.length; }

  };
  if(kind==='mcq') return {

    rule:'Elige una opción. Aquí no hay respuesta dudosa: si eliges otra opción, cambia el significado o la estructura.',
    expect:['elige 1 opción','lee todas','descarta trampas','no traduzcas literal'],

  };

}

function formatDiagnosis(q,val,best){
  const kind=questionKind(q); const user=looseNormalize(val); const model=looseNormalize(best?.a||''); const userWords=user.split(' ').filter(Boolean); const modelWords=model.split(' ').filter(Boolean);
  if(kind==='transformation'){
    const kw=looseNormalize(q.keyWord||'');
    if(kw && !userWords.includes(kw)) return 'Has podido ver parte de la idea, pero falta la keyword obligatoria. En este formato hay que escribir toda la frase del hueco, no solo la pieza que cambia.';
    if(userWords.length<2) return 'La respuesta es demasiado corta para una transformation: normalmente necesita 2-5 palabras.';
    if(user && model.endsWith(user)) return 'Has escrito el final correcto, pero el hueco pedía más palabras antes. Esto es intención correcta, formato incompleto.';
  }
  if(kind==='open_cloze' && userWords.length>1) return 'En open cloze solo puedes escribir UNA palabra. Si incluyes más, aunque una sea correcta, no es formato de examen.';
  if(kind==='word_formation' && userWords.length>1) return 'En word formation se escribe una sola palabra derivada, sin artículos ni frases.';
  return null;
}
function validateFormatBeforeSubmit(q,val){
  const kind=questionKind(q); const words=looseNormalize(val).split(' ').filter(Boolean);
  if(kind==='open_cloze' && words.length>1){ toast('<b>Ojo:</b> open cloze pide UNA palabra. Si envías varias, puede contar como ❔ o ❌.'); }
  if(kind==='word_formation' && words.length>1){ toast('<b>Ojo:</b> word formation pide UNA palabra derivada, no una frase.'); }
  if(kind==='transformation'){
    const kw=looseNormalize(q.keyWord||'');
    if(words.length<2) toast('<b>Ojo:</b> transformation suele pedir 2-5 palabras. No escribas solo el verbo.');
    else if(kw && !words.includes(kw)) toast('<b>Ojo:</b> la keyword es obligatoria. Si no aparece, en examen pierdes puntos.');
  }
  return true;
}

function evaluateAnswer(q,val){
  if(q.type==='writing') return {status:'correct',score:1,reason:'Writing guardado para revisión con checklist.'};
  const answers=q.answer||[]; const n=normalize(val); const ln=looseNormalize(val); const kind=questionKind(q);
  if(answers.some(a=>normalize(a)===n || looseNormalize(a)===ln)) return {status:'correct',score:1,reason:'Coincide con una respuesta aceptada.'};
  if(q.type==='mcq') return {status:'incorrect',score:0,reason:'En test de opción múltiple no hay punto dudoso: una opción cambia la respuesta.'};
  const checks=answers.map(a=>({a, d:levenshtein(val,a), ov:tokenOverlap(val,a), alen:looseNormalize(a).length, words:looseNormalize(a).split(' ').filter(Boolean).length}));
  const best=checks.sort((x,y)=> (x.d-y.d) || (y.ov-x.ov))[0];
  if(!best) return {status:'incorrect',score:0,reason:'No hay respuesta modelo registrada.'};
  const userWords=looseNormalize(val).split(' ').filter(Boolean);
  const modelWords=looseNormalize(best.a).split(' ').filter(Boolean);
  const diag=formatDiagnosis(q,val,best);

  if(kind==='transformation'){
    const kw=looseNormalize(q.keyWord||'');
    const includesKeyword=!kw || userWords.includes(kw);
    const endsWithCore=userWords.length && looseNormalize(best.a).endsWith(looseNormalize(val));
    if(includesKeyword && best.ov>=0.60) return {status:'partial',score:.5,reason:diag || 'Has usado parte importante de la transformación, pero falta una pieza o el orden no queda totalmente correcto.'};
    if(endsWithCore || best.ov>=0.34) return {status:'partial',score:.5,reason:diag || 'La intención gramatical se entiende, pero el formato de transformation exige la frase completa con la keyword.'};
    return {status:'incorrect',score:0,reason:diag || 'No conserva la estructura/significado que pedía la transformación.'};
  }

  if(kind==='open_cloze'){
    if(userWords.length>1 && userWords.includes(looseNormalize(best.a))) return {status:'partial',score:.5,reason:diag || 'La palabra clave está, pero open cloze pide una sola palabra.'};
    const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
    if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))) return {status:'partial',score:.5,reason:'Parece la palabra correcta con spelling leve. En examen puede costar el punto, pero sirve para detectar intención.'};
    return {status:'incorrect',score:0,reason:diag || 'No es la palabra gramatical que encaja en el hueco.'};
  }

  if(kind==='word_formation'){
    if(userWords.length>1 && userWords.includes(looseNormalize(best.a))) return {status:'partial',score:.5,reason:diag || 'La palabra derivada aparece, pero este formato pide una sola palabra.'};
    const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
    if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))) return {status:'partial',score:.5,reason:'La familia de palabra parece correcta, pero hay spelling o forma incompleta.'};
    return {status:'incorrect',score:0,reason:diag || 'No has formado la palabra que encaja gramaticalmente en la frase.'};
  }

  const userCount=userWords.length; const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
  if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))){
    return {status:'partial',score:.5,reason:'Parece la palabra correcta con un fallo leve de spelling. En examen puede costar el punto, pero la intención gramatical va bien.'};
  }
  if(best.words>1 && best.ov>=0.75 && Math.abs(userCount-best.words)<=2){
    return {status:'partial',score:.5,reason:'La estructura principal está, pero falta o sobra una pieza gramatical. Merece revisión, no fallo total.'};
  }
  if(best.d<=2 && best.alen>=8){
    return {status:'partial',score:.5,reason:'Muy cerca de la respuesta modelo, probablemente error pequeño de forma.'};
  }
  return {status:'incorrect',score:0,reason:'No coincide con la estructura o palabra que pedía el hueco.'};
}

    <div class="card"><h3>Zona roja</h3><p class="muted">Tus huecos más rentables ahora mismo.</p>${weak.map(m=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${m.title}</b><span>${mastery(m.id)}%</span></div>${pctBar(mastery(m.id))}<div class="small muted">${examPartForModule(m.id)}</div></div>`).join('')}<button class="btn secondary" onclick="startSmartSession()">Entrenar zona roja</button></div>
    <div class="card"><h3>Modo examen fiel</h3><p class="muted">Simulador con proporción tipo B2: cloze, open cloze, word formation, transformations, reading y writing.</p><table class="exam-table"><tr><th>Parte</th><th>Objetivo</th></tr><tr><td>Use of English</td><td>gramática y vocabulario controlado</td></tr><tr><td>Reading</td><td>evidencia, detalle y opinión</td></tr><tr><td>Writing</td><td>estructura 140-190 palabras</td></tr></table><button class="btn" style="margin-top:12px" onclick="showView('examMap')">Ver mapa de examen</button></div>
  </div>
  <div class="sticky-mobile-cta"><button class="btn" onclick="${rec.action}">${rec.btn}</button></div>
  <div class="card source-note" style="margin-top:16px">v10 optimizada con estructura de curso, revisión espaciada, simuladores por partes y navegación anti-pérdida. El contenido sigue siendo entrenador, no examen oficial.</div>`; }

function roadmapHTML(){ const phases=['Base gramatical','Gramática B2','Use of English','Skills de examen']; return `<div class="card"><h3>Hoja de ruta académica</h3><p class="muted">Estructura tipo curso: cada módulo se hace en este orden: 1) teoría corta, 2) práctica guiada, 3) repaso de fallos, 4) simulacro. Empieza por los módulos marcados como prioridad.</p><div class="btn-row"><button class="btn" onclick="startDailyMission()">Misión de hoy</button><button class="btn secondary" onclick="startReviewSession()">Repasar errores</button><button class="btn ghost" onclick="showView('examMap')">Ver mapa examen</button></div></div>`+phases.map(ph=>`<div class="card" style="margin-top:16px"><h2>${ph}</h2><p class="muted">${ph==='Base gramatical'?'Primero deja de regalar fallos de tiempo verbal.':ph==='Gramática B2'?'Aquí subes de B1 alto a B2 real.':ph==='Use of English'?'La parte más entrenable y más rentable.':'Aplicación final: leer, escribir y simular.'}</p>${MODULES.filter(m=>modulePhase(m)===ph).map((m,i)=>{const ms=mastery(m.id); const cls=ms>=75?'good':ms>=45?'warn':'bad'; const rec=weakModules(3).some(w=>w.id===m.id); return `<div class="card module-card ${rec?'recommended':''}" style="margin-bottom:12px"><div class="module-index">${i+1}</div><div><h3>${m.title} <span class="status-dot ${cls}"></span> ${rec?'<span class="pill warn">recomendado</span>':''}</h3><p class="muted">${m.goal}</p>${pctBar(ms)}<div class="small muted">Dominio: ${ms}% · ${getModuleStats(m.id).done}/${getModuleStats(m.id).total} ejercicios · ${examPartForModule(m.id)}</div></div><div class="module-actions"><button class="btn ghost" onclick="showView('theory',{id:'${m.id}'})">Teoría</button><button class="btn" onclick="startModuleSession('${m.id}',12)">Practicar</button></div></div>`}).join('')}</div>`).join(''); }


function todayHTML(){ const plan=planProgressToday(); const due=reviewDueItems(); const nm=nextModule(); return `<div class="hero"><h2>Plan de hoy: 45-60 minutos</h2><p>No entres a mirar menús. Sigue estos bloques. Si tienes menos tiempo, haz solo los dos primeros.</p></div><div class="grid cols-4" style="margin-top:16px"><div class="card"><div class="muted small">Hecho hoy</div><div class="big-number">${plan.done}/${plan.goal}</div>${pctBar(plan.pct)}</div><div class="card"><div class="muted small">Repasos vencidos</div><div class="big-number">${due.filter(x=>x.due).length}</div><p class="muted">errores/dudas listas</p></div><div class="card"><div class="muted small">Siguiente módulo</div><h3>${nm?.title||'Simulacro'}</h3><p class="small muted">${nm?.goal||'Medir rendimiento real'}</p></div><div class="card"><div class="muted small">Coach</div><p>${coachText()}</p></div></div><div class="lesson-shell" style="margin-top:16px"><div class="lesson-rail"><div class="rail-item active"><b>Orden recomendado</b><p class="small muted">Calienta → repasa → módulo → mini examen.</p></div><div class="rail-item"><b>Regla anti-saturación</b><p class="small muted">Teoría solo cuando toca o cuando fallas.</p></div></div><div><div class="card"><h3>Bloque 1 · Calentamiento zona roja</h3><p class="muted">10 preguntas cortas de tus peores módulos. Sirve para activar el cerebro.</p><button class="btn" onclick="startDailyWarmup()">Empezar calentamiento</button></div><div class="card" style="margin-top:12px"><h3>Bloque 2 · Repaso espaciado</h3><p class="muted">Repite fallos/dudas cuando toca. Esto evita olvidar lo que ya corregiste.</p><button class="btn" onclick="startReviewSession()">Repasar ${due.filter(x=>x.due).length || ''}</button></div><div class="card" style="margin-top:12px"><h3>Bloque 3 · Lección del día</h3><p class="muted">Tema recomendado: <b>${nm?.title}</b>. Primero lee teoría corta si vas perdido; si no, entra a práctica.</p><div class="btn-row"><button class="btn ghost" onclick="showView('theory',{id:'${nm?.id}'})">Teoría</button><button class="btn" onclick="startModuleSession('${nm?.id}',12)">Practicar</button></div></div><div class="card" style="margin-top:12px"><h3>Bloque 4 · Mini examen</h3><p class="muted">15-20 preguntas sin mirar teoría para comprobar si se queda.</p><button class="btn secondary" onclick="startDailyMission()">Misión mixta</button></div></div></div>`; }
function reviewHTML(){ const items=reviewDueItems(); const due=items.filter(x=>x.due || answerStatus(x.a)!=='correct'); return `<div class="hero"><h2>Repaso SRS: errores y dudas</h2><p>Inspirado en repaso espaciado: no repites todo, repites lo que tu memoria está a punto de olvidar. Las ❔ son importantes: no son fracaso, son material de conversión a ✅.</p></div><div class="grid cols-3" style="margin-top:16px"><div class="card"><div class="muted small">Pendientes</div><div class="big-number">${due.length}</div><p class="muted">fallos/dudas para reentrenar.</p></div><div class="card"><div class="muted small">Dudas ❔</div><div class="big-number">${items.filter(x=>answerStatus(x.a)==='partial').length}</div><p class="muted">intención correcta, forma mejorable.</p></div><div class="card"><div class="muted small">Acción</div><button class="btn" onclick="startReviewSession()">Empezar repaso</button></div></div><div class="card" style="margin-top:16px"><h3>Cola de repaso</h3>${items.length?items.slice(0,30).map(x=>`<div class="card ${x.due?'review-due':'review-fresh'}" style="box-shadow:none;margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>${moduleById(x.q.module)?.title}</b><span class="pill ${answerStatus(x.a)==='partial'?'partial':'bad'}">${answerStatus(x.a)==='partial'?'❔ duda':'❌ fallo'}</span></div><p>${x.q.prompt}</p><p class="small muted">Tu respuesta: ${x.a.given||'—'} · Modelo: ${x.q.answer?.[0]||'—'} · hace ${x.age} días</p><div class="btn-row"><button class="btn ghost" onclick="showView('theory',{id:'${x.q.module}'})">Teoría</button><button class="btn secondary" onclick="startCustomSession(['${x.id}'],'Revisión de una pregunta')">Reintentar</button></div></div>`).join(''):'<div class="empty">Aún no hay fallos ni dudas. Haz diagnóstico primero.</div>'}</div>`; }
function examMapHTML(){ return `<div class="hero"><h2>Mapa de examen: formato profesional</h2><p>La mejora clave de v10 es que cada pregunta te dice exactamente qué tienes que escribir: una palabra, una palabra derivada, una opción o 2-5 palabras con keyword. Así evitamos fallos injustos como saber “was” pero no saber que el hueco pedía “said she was”.</p></div><div class="qa-banner"><b>Regla de oro:</b> primero identifica el formato. Después respondes. En B2, muchas respuestas se fallan no por gramática, sino por no respetar la consigna.</div><div class="grid cols-2" style="margin-top:16px"><div class="card exam-part"><h3>Reading & Use of English</h3><table class="exam-table exam-format-table"><tr><th>Parte</th><th>Qué escribes</th><th>La web ahora hace</th></tr><tr><td>Part 1 · Multiple-choice cloze</td><td>1 opción A/B/C/D</td><td>No permite ❔: es correcto/incorrecto</td></tr><tr><td>Part 2 · Open cloze</td><td>1 palabra</td><td>Avisa si escribes varias palabras</td></tr><tr><td>Part 3 · Word formation</td><td>1 palabra derivada</td><td>Comprueba familia de palabra y spelling leve</td></tr><tr><td>Part 4 · Transformations</td><td>2-5 palabras + keyword</td><td>Da ❔ si acertaste la intención pero faltó formato</td></tr><tr><td>Parts 5-7 · Reading</td><td>opción/evidencia</td><td>Entrena detalle, opinión y paraphrase</td></tr></table><button class="btn" style="margin-top:12px" onclick="startBlueprintExam()">Iniciar blueprint B2</button></div><div class="card exam-part"><h3>Criterio de corrección v10</h3><div class="rubric"><div><b>✅ Correcto</b><br><span class="small muted">respuesta aceptada</span></div><div><b>❔ Duda</b><br><span class="small muted">intención correcta, formato incompleto</span></div><div><b>❌ Fallo</b><br><span class="small muted">no encaja</span></div><div><b>Modo examen</b><br><span class="small muted">sin pistas</span></div></div><p class="muted">En Key Word Transformations puede haber puntuación parcial; en open cloze/word formation el formato es mucho más estricto. La web separa entrenamiento de realidad de examen.</p><button class="btn secondary" style="margin-top:12px" onclick="showView('settings')">Ver criterio</button></div></div><div class="card" style="margin-top:16px"><h3>Ejemplos corregidos</h3><table class="exam-table"><tr><th>Pregunta</th><th>Respuesta incompleta</th><th>Cómo la trata v10</th></tr><tr><td>SAID → She ___ tired.</td><td>was</td><td>❔ porque viste el cambio, pero faltó “said she”.</td></tr><tr><td>It was ___ an interesting lesson...</td><td>such an</td><td>❔ porque la palabra clave está, pero open cloze pide una sola palabra.</td></tr><tr><td>FORGET → an ___ experience</td><td>unforgetable</td><td>❔ spelling leve; estudiar spelling.</td></tr></table></div>`; }

function diagnosticHTML(){ return `<div class="hero"><h2>Diagnóstico B2</h2><p>Primero medimos. Luego estudiamos. Este test mezcla gramática, Use of English y reading para detectar tus módulos débiles.</p></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Diagnóstico completo</h3><p class="muted">40 preguntas · 35 min · informe por módulos.</p><button class="btn" onclick="startExam('diagnostic')">Empezar</button></div><div class="card"><h3>Regla</h3><p class="muted">No mires teoría durante el diagnóstico. Si fallas, luego la web te manda a lo que toca.</p><button class="btn secondary" onclick="showView('progress')">Ver historial</button></div></div>`; }
function practiceHTML(){ const groups=[...new Set(MODULES.map(m=>m.group))]; return `<div class="card"><h3>Practicar por módulos</h3><p class="muted">Ideal después del diagnóstico. Elige un tema o deja que la web elija tus fallos.</p><div class="btn-row"><button class="btn" onclick="startSmartSession()">Sesión inteligente</button><button class="btn secondary" onclick="startMistakeSession()">Practicar fallos</button></div></div>${groups.map(g=>`<h3 style="margin-top:22px">${g}</h3><div class="grid cols-3">${MODULES.filter(m=>m.group===g).map(m=>`<div class="card"><h3>${m.title}</h3><p class="muted small">${m.goal}</p>${pctBar(mastery(m.id))}<p class="small muted">${mastery(m.id)}% dominio · ${moduleExercises(m.id).length} ejercicios</p><div class="btn-row"><button class="btn" onclick="startModuleSession('${m.id}',10)">Practicar</button><button class="btn ghost" onclick="showView('theory',{id:'${m.id}'})">Teoría</button></div></div>`).join('')}</div>`).join('')}`; }
function examHTML(){ return `<div class="hero"><h2>Simulador de exámenes</h2><p>Modo examen: temporizador, sin pistas por defecto, corrección final e informe de fallos. La v10 añade contratos de respuesta, pistas no reveladoras y corrección parcial más académica por partes para que se parezca más a una prueba B2 escrita.</p></div><div class="grid cols-2" style="margin-top:16px"><div class="card" style="border-color:#2563eb"><h3>Blueprint B2 escrito recomendado</h3><p class="muted">52 preguntas · 75 min · proporción tipo Reading & Use of English: cloze, open cloze, word formation, transformations y reading.</p><button class="btn" onclick="startBlueprintExam()">Iniciar blueprint</button> <button class="btn ghost" onclick="showView('examMap')">Ver mapa</button></div>${EXAM_PROFILES.map(p=>`<div class="card"><h3>${p.title}</h3><p class="muted">${p.description}</p><p><span class="pill">${p.minutes} min</span> <span class="pill">${p.count} preguntas</span></p><button class="btn" onclick="startExam('${p.id}')">Iniciar simulacro</button></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Formato que imitamos</h3><table class="exam-table"><tr><th>Parte</th><th>Qué entrena</th><th>En la web</th></tr><tr><td>Multiple-choice cloze</td><td>vocabulario, collocations, linkers</td><td>MCQ contextual</td></tr><tr><td>Open cloze</td><td>gramática funcional</td><td>huecos sin opciones</td></tr><tr><td>Word formation</td><td>familias de palabras</td><td>base word → respuesta</td></tr><tr><td>Transformations</td><td>reescritura B2</td><td>keyword obligatoria</td></tr><tr><td>Reading</td><td>detalle, actitud, paraphrase</td><td>textos cortos + evidencias</td></tr><tr><td>Writing</td><td>organización y rango</td><td>plantillas + checklist</td></tr></table></div>`; }
function theoryHTML(id){ const list=MODULES; const m=id?moduleById(id):list[0]; const ret=state.session && !state.session.completed ? `<div class="sticky-return"><div><b>Estás consultando teoría durante un test.</b><div class="small muted">No te pierdes: puedes volver exactamente a la pregunta ${state.session.index+1}.</div></div><button class="btn warn" onclick="state.achievements.comeback=true; save(); showView('session')">Volver al test activo</button></div>`:''; return `${ret}<div class="grid cols-4"><div class="card" style="grid-column:span 1"><h3>Teoría</h3>${list.map(x=>`<button class="nav-btn ${x.id===m.id?'active':''}" style="color:#0f172a;background:${x.id===m.id?'#dbeafe':'transparent'}" onclick="showView('theory',{id:'${x.id}'})">${x.title}</button>`).join('')}</div><div style="grid-column:span 3">${theoryBlock(m)}</div></div>`; }
function theoryBlock(m){ const t=m.theory; return `<div class="card theory-card"><p><span class="pill warn">${m.group}</span> <span class="pill">Prioridad ${m.priority}/10</span></p><h3>${m.title}</h3><p class="muted">${m.goal}</p><div class="feedback info"><b>Qué tienes que recordar:</b><br>${t.remember}</div><div class="theory-grid" style="margin-top:14px"><div class="card flat"><h3>Fórmula limpia</h3><p>${t.formula}</p></div><div class="card flat"><h3>Movimiento de examen</h3><p>${t.exam_move}</p></div></div><div class="card flat" style="margin-top:14px"><h3>Pistas del contexto</h3><ul class="theory-list">${(t.clues||[]).map(c=>`<li>${c}</li>`).join('')}</ul></div><div class="card flat" style="margin-top:14px"><h3>Mal vs bien</h3><table class="example-table">${(t.wrong_right||[]).map(pair=>`<tr><td class="bad-text">✗ ${pair[0]}</td><td class="good-text">✓ ${pair[1]}</td></tr>`).join('')}</table></div><div class="feedback bad"><b>Trampa típica:</b> ${t.common_trap}</div><div class="btn-row" style="margin-top:14px"><button class="btn" onclick="startModuleSession('${m.id}',12)">Practicar ${m.title}</button><button class="btn secondary" onclick="showView('roadmap')">Volver a ruta</button></div></div>`; }
function mistakesHTML(){ const wrong=Object.entries(state.answers).filter(([id,a])=>answerStatus(a)!=='correct').map(([id,a])=>({...exerciseById(id), ans:a})).filter(q=>q.id).reverse(); if(!wrong.length) return `<div class="empty"><h3>Aún no hay fallos ni dudas registradas</h3><p>Haz un diagnóstico o una sesión inteligente. Aquí aparecerán errores y respuestas ❔ para convertirlas en puntos seguros.</p><button class="btn" onclick="startSmartSession()">Empezar sesión inteligente</button></div>`; const mods={}; wrong.forEach(q=>{mods[q.module]=(mods[q.module]||0)+1}); const sorted=Object.entries(mods).sort((a,b)=>b[1]-a[1]); return `<div class="card"><h3>Fallos y dudas = plan de estudio</h3><p class="muted">Una ❔ no es aprobado seguro: significa “tu intención va bien, pero hay que pulir forma”. En examen queremos convertirlas en ✅.</p><div class="btn-row"><button class="btn" onclick="startMistakeSession()">Practicar fallos y dudas</button>${sorted.slice(0,3).map(([id,n])=>`<button class="btn ghost" onclick="showView('theory',{id:'${id}'})">Teoría: ${moduleById(id)?.title} (${n})</button>`).join('')}</div></div><div class="grid cols-2" style="margin-top:16px">${wrong.slice(0,40).map(q=>{const st=answerStatus(q.ans); return `<div class="card"><span class="pill ${st==='partial'?'partial':'bad'}">${st==='partial'?'❔ Duda':'❌ Fallo'} · ${moduleById(q.module)?.title}</span><h3 style="font-size:18px">${q.prompt}</h3><p class="${st==='partial'?'doubt-text':'bad-text'}">Tu respuesta: ${q.ans.given||'—'}</p><p class="good-text">Modelo: ${q.answer[0]}</p>${q.ans.reason?`<p class="small"><b>Criterio:</b> ${q.ans.reason}</p>`:''}<p class="muted small">${q.explanation}</p><div class="btn-row"><button class="btn ghost" onclick="showView('theory',{id:'${q.module}'})">Ir a teoría</button><button class="btn" onclick="startCustomSession(['${q.id}'],'Reintentar fallo/duda')">Reintentar</button></div></div>`}).join('')}</div>`; }
function writingHTML(){ const prompts=EXERCISES.filter(q=>q.type==='writing'); return `<div class="hero"><h2>Writing B2</h2><p>Objetivo: 140-190 palabras, párrafos claros, responder a todos los puntos y usar conectores sin liarla.</p></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Plantilla essay segura</h3><pre style="white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:12px">Nowadays, many people believe that...
Firstly, ...
Moreover, ...
However, ...
In my opinion, ...
To sum up, I strongly believe that...</pre></div><div class="card"><h3>Checklist antes de entregar</h3><ul><li>¿He respondido todos los puntos?</li><li>¿Tengo 4 párrafos?</li><li>¿140-190 palabras?</li><li>¿Conectores: however, although, moreover, therefore?</li><li>¿Revisé tiempos, artículos y preposiciones?</li></ul></div></div><div class="grid cols-2" style="margin-top:16px">${prompts.map(q=>`<div class="card"><span class="pill">${q.clue}</span><h3>${q.prompt}</h3><button class="btn" onclick="openWriting('${q.id}')">Practicar este writing</button></div>`).join('')}</div>`; }
function listeningHTML(){ return `<div class="card"><h3>Listening activo</h3><p class="muted">Aunque prioricemos prueba escrita, registra listening para no abandonarlo.</p><div class="grid cols-3"><div><label>Minutos</label><input class="answer-input" id="listenMin" type="number" value="10"></div><div><label>Dificultad</label><select class="answer-input" id="listenDiff"><option>Fácil</option><option>Media</option><option>Difícil</option></select></div><div><label>Actividad</label><input class="answer-input" id="listenTask" value="listening activo + preguntas"></div></div><p><textarea class="textarea" id="listenNotes" placeholder="Palabras nuevas / qué no entendí"></textarea></p><button class="btn" onclick="saveListening()">Guardar listening</button></div><div class="grid cols-2" style="margin-top:16px">${(state.listening||[]).slice().reverse().map(l=>`<div class="card"><b>${l.min} min · ${l.diff}</b><p>${l.task}</p><p class="muted small">${l.notes||''}</p></div>`).join('') || '<div class="empty">Sin registros aún.</div>'}</div>`; }
function progressHTML(){ const hist=(state.examHistory||[]).slice().reverse(); return `<div class="grid cols-3"><div class="card"><div class="muted small">B2 readiness ponderado</div><div class="big-number">${readiness()}%</div>${pctBar(readiness())}<p class="small muted">Las respuestas dudosas valen 0,5 para medir progreso real.</p></div><div class="card"><div class="muted small">Ejercicios</div><div class="big-number">${completedCount()}</div><p class="muted">✅ ${correctCount()} correctos · ❔ ${partialCount()} dudosos</p></div><div class="card"><div class="muted small">Logros</div><div class="big-number">${Object.keys(state.achievements||{}).filter(k=>state.achievements[k]).length}/${ACHIEVEMENTS.length}</div><p class="muted">XP: ${state.xp||0}</p></div></div><div class="card" style="margin-top:16px"><h3>Dominio por módulo</h3>${MODULES.map(m=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${m.title}</b><span>${mastery(m.id)}%</span></div>${pctBar(mastery(m.id))}</div>`).join('')}</div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Historial de simulacros</h3>${hist.length?hist.map(h=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><b>${h.title}</b><br><span class="pill ${h.score>=75?'good':h.score>=60?'warn':'bad'}">${h.score}%</span> ${h.partial?`<span class="pill partial">❔ ${h.partial} dudosas</span>`:''} <span class="small muted">${h.date}</span></div>`).join(''):'<p class="muted">Aún no hay simulacros.</p>'}</div><div class="card"><h3>Logros</h3>${ACHIEVEMENTS.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${state.achievements[a.id]?'✅':'⬜'} ${a.title}</b><br><span class="small muted">${a.condition}</span></div>`).join('')}</div></div>`; }
function settingsHTML(){ return `<div class="card"><h3>Ajustes y datos</h3><label><input type="checkbox" ${state.settings.autoTheory?'checked':''} onchange="state.settings.autoTheory=this.checked;save()"> Autoabrir teoría al fallar en práctica</label><br><br><label><input type="checkbox" ${state.settings.coachMode?'checked':''} onchange="state.settings.coachMode=this.checked;save();render()"> Mostrar coach y recomendaciones</label><br><br><label>Objetivo diario de ejercicios <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.dailyGoal}" onchange="state.settings.dailyGoal=Number(this.value)||30;save()"></label><br><br><label>Tamaño sesión recomendada <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.preferredSession||20}" onchange="state.settings.preferredSession=Number(this.value)||20;save()"></label><hr><h3>Criterio de corrección v10</h3><div class="grid cols-3"><div class="card flat"><span class="score-chip ok">✅ Bien = 1</span><p class="small muted">Coincide con una respuesta aceptada. Mayúsculas y puntuación final no te castigan.</p></div><div class="card flat"><span class="score-chip partial">❔ Dudosa = 0,5</span><p class="small muted">Intención correcta con fallo pequeño: spelling leve, keyword incompleta, demasiadas palabras en open cloze o transformation parcialmente construida.</p></div><div class="card flat"><span class="score-chip no">❌ Mal = 0</span><p class="small muted">No encaja con la estructura que pedía el ejercicio.</p></div></div><div class="qa-banner"><b>Importante:</b> v10 no usa ❔ para regalarte puntos. Lo usa para separar “no tenía ni idea” de “lo entendí, pero no respeté formato”. En simulacro, las ❔ cuentan 0,5 para entrenar; en una prueba real pueden depender del tipo de ejercicio y del corrector.</div><h3>Contratos de respuesta</h3><table class="exam-table"><tr><th>Tipo</th><th>Qué debes escribir</th><th>Error típico</th></tr><tr><td>Open cloze</td><td>UNA palabra</td><td>meter una frase</td></tr><tr><td>Word formation</td><td>UNA palabra derivada</td><td>dejar la base sin cambiar</td></tr><tr><td>Transformation</td><td>2-5 palabras con keyword</td><td>escribir solo el verbo que cambia</td></tr><tr><td>Multiple choice</td><td>una opción</td><td>elegir por traducción literal</td></tr></table><hr><div class="btn-row"><button class="btn secondary" onclick="exportProgress()">Exportar progreso</button><button class="btn secondary" onclick="importProgress()">Importar progreso</button><button class="btn bad" onclick="resetProgress()">Reiniciar</button></div><p class="source-note">El progreso se guarda en este navegador con localStorage. Si cambias de dispositivo, exporta/importa.</p></div>`; }

function sessionHTML(){ const s=state.session; if(!s || s.completed) return `<div class="empty"><h3>No hay sesión activa</h3><button class="btn" onclick="startSmartSession()">Empezar sesión inteligente</button></div>`; const q=exerciseById(s.ids[s.index]); if(!q) return `<div class="empty">Pregunta no encontrada.</div>`; const answered=s.responses[q.id]; const exam=s.mode==='exam'; const part=examPartForQuestion(q); return `<div class="focus-strip"><div><b>${exam?'Modo examen':'Modo práctica'}</b> · ${s.title} · ${s.index+1}/${s.ids.length}<br><span class="small muted">${part}</span></div><div class="btn-row"><button class="btn secondary" onclick="pauseSession()">Salir sin perder</button>${exam?'<span class="pill warn">sin pistas</span>':''}</div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><span class="pill ${exam?'warn':''}">${exam?'Modo examen':'Modo práctica'}</span> <span class="pill">${moduleById(q.module)?.title}</span></div><div class="small muted">${s.minutes?`${s.minutes} min · `:''}${s.index+1}/${s.ids.length}</div></div>${pctBar(Math.round((s.index)/s.ids.length*100))}</div><div class="question-box" style="margin-top:16px">${q.passage?`<div class="passage">${q.passage}</div>`:''}${typeGuideHTML(q, exam)}<div class="prompt-block"><div class="small muted">${q.difficulty} · ${questionKind(q).replace('_',' ')}</div><div class="question-prompt">${q.prompt}</div></div>${questionInputHTML(q, answered)}<div id="formatWarning" class="input-warning"></div><div id="feedbackArea">${answered && !exam?feedbackHTML(q,answered):''}</div><div class="btn-row" style="margin-top:16px">${!answered?`<button class="btn" onclick="submitAnswer('${q.id}')">${exam?'Guardar respuesta':'Comprobar / Guardar'}</button>`:`<button class="btn" onclick="nextQuestion()">${s.index===s.ids.length-1?'Finalizar':'Siguiente'}</button>`}${!exam?`<button class="btn ghost" onclick="showHint('${q.id}')">Pista sin spoiler</button><button class="btn secondary" onclick="showView('theory',{id:'${q.module}'})">Ver teoría</button>`:''}<button class="btn secondary" onclick="pauseSession()">Salir sin perder sesión</button></div>${exam?`<div class="feedback info"><b>Modo examen:</b> instrucciones visibles, pero sin pista ni teoría hasta finalizar. Responde y sigue. Al final recibirás informe por módulos.</div>`:''}</div>`; }

function questionInputHTML(q, answered){ const c=answerContract(q); if(q.type==='mcq'){ return `<div class="options">${q.options.map(opt=>{const selected=answered&&normalize(answered.given)===normalize(opt); const st=answerStatus(answered); return `<button class="option ${selected?(st==='correct'?'correct':st==='partial'?'partial':'wrong'):''} ${answered&&isCorrect(q,opt)?'correct':''}" onclick="selectOption(this,'${escapeAttr(opt)}')" ${answered?'disabled':''}>${opt}</button>`}).join('')}</div><input type="hidden" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}">`; } if(q.type==='writing'){ return `<textarea class="textarea" id="currentAnswer" placeholder="Escribe aquí 140-190 palabras..."></textarea><div class="small muted" id="wordCount">0 palabras</div>`; } return `<input class="answer-input" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}" placeholder="${escapeAttr(c.placeholder||'Escribe tu respuesta')}" ${answered?'disabled':''} oninput="liveFormatWarning('${q.id}')"><div class="answer-help">${c.title}. ${c.rule.replace(/<[^>]+>/g,'')}</div>`; }

function liveFormatWarning(id){ const q=exerciseById(id); const el=$('currentAnswer'); const box=$('formatWarning'); if(!q||!el||!box)return; const val=el.value||''; const kind=questionKind(q); const words=looseNormalize(val).split(' ').filter(Boolean); let msg=''; if(kind==='open_cloze' && words.length>1) msg='Open cloze pide UNA palabra. Borra artículos/frases extra.'; if(kind==='word_formation' && words.length>1) msg='Word formation pide UNA palabra derivada, no una frase.'; if(kind==='transformation'){ const kw=looseNormalize(q.keyWord||''); if(words.length && words.length<2) msg='Transformation: probablemente falta la keyword o más parte del hueco.'; else if(kw && words.length && !words.includes(kw)) msg='Falta la keyword obligatoria: '+q.keyWord+'.'; else if(words.length>5) msg='Transformation B2 suele pedir 2-5 palabras.'; } box.style.display=msg?'block':'none'; box.textContent=msg; }

function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function selectOption(btn,opt){ document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); $('currentAnswer').value=opt; }
function feedbackHTML(q,a){ const st=answerStatus(a); const good=st==='correct', partial=st==='partial'; const c=answerContract(q); return `<div class="feedback ${good?'good':partial?'partial':'bad'}"><h3>${good?'✅ Bien':partial?'❔ Casi / respuesta dudosa':'❌ Fallo útil'}</h3><p><b>Tu respuesta:</b> ${a.given||'—'} ${partial?'<span class="pill partial">0,5 puntos</span>':''}</p><p><b>Respuesta modelo:</b> ${q.answer[0]}</p>${a.reason?`<p><b>Criterio:</b> ${a.reason}</p>`:''}<div class="format-note"><b>Formato que se pedía:</b> ${c.rule}<br><b>Clave después de corregir:</b> ${q.clue||'Mira la estructura alrededor del hueco.'}</div><p><b>Explicación:</b> ${q.explanation}</p><p><b>Trampa típica:</b> ${q.trap||'Responder por traducción literal.'}</p>${!good?`<div class="manual-actions"><button class="btn warn" onclick="showView('theory',{id:'${q.module}'})">Ir a la teoría de este fallo</button> <button class="btn ghost" onclick="markAnswerAsPartial('${q.id}')">Marcar como ❔ duda personal</button><p class="small muted">Úsalo solo si de verdad entendiste la idea pero el formato te pilló. En examen queremos convertirlo en ✅.</p></div>`:''}</div>`; }
function showHint(id){ const q=exerciseById(id); toast(`<b>Pista sin spoiler:</b> ${safeHint(q)}`); }

function markAnswerAsPartial(id){ const q=exerciseById(id); if(!q)return; const s=state.session; const target=(s&&s.responses&&s.responses[id])?s.responses[id]:state.answers[id]; if(!target)return; target.status='partial'; target.correct=false; target.score=.5; target.reason='Marcado como ❔ duda personal: intención parcialmente correcta, pero requiere revisar formato exacto de examen.'; target.manualPartial=true; state.answers[id]=target; if(s&&s.responses)s.responses[id]=target; save(); render(); toast('Marcado como ❔ duda personal. Ahora toca reentrenarlo para convertirlo en ✅.'); }

function submitAnswer(id){ const s=state.session; const q=exerciseById(id); let val=$('currentAnswer')?.value||''; if(q.type==='mcq' && !val){toast('Elige una opción.');return} if(q.type==='input' && !val.trim()){toast('Escribe una respuesta.');return} validateFormatBeforeSubmit(q,val); const ev=evaluateAnswer(q,val); const record={given:val, correct:ev.status==='correct', status:ev.status, score:ev.score, reason:ev.reason, date:new Date().toISOString(), module:q.module, kind:questionKind(q)}; s.responses[q.id]=record; state.answers[q.id]=record; state.events.push({type:'answer',status:ev.status,module:q.module,kind:questionKind(q),date:new Date().toISOString()}); markStudy(); addXP(ev.status==='correct'?10:ev.status==='partial'?7:4); if(ev.status==='incorrect' && state.settings.autoTheory && s.mode!=='exam'){ save(); showView('theory',{id:q.module}); return; } save(); render(); }
function nextQuestion(){ const s=state.session; if(s.index < s.ids.length-1){ s.index++; save(); render(); } else completeSession(); }
function pauseSession(){ save(); showView('dashboard'); toast('Sesión guardada. Puedes volver cuando quieras.'); }
function completeSession(){ const s=state.session; const total=s.ids.length; const corr=s.ids.filter(id=>answerStatus(s.responses[id])==='correct').length; const part=s.ids.filter(id=>answerStatus(s.responses[id])==='partial').length; const weighted=s.ids.reduce((sum,id)=>sum+answerScore(s.responses[id]),0); const score=Math.round(weighted/total*100); const by={}; s.ids.forEach(id=>{const q=exerciseById(id); if(!q)return; const a=s.responses[id]; by[q.module]=by[q.module]||{t:0,c:0,p:0,w:0}; by[q.module].t++; if(answerStatus(a)==='correct') by[q.module].c++; if(answerStatus(a)==='partial') by[q.module].p++; by[q.module].w+=answerScore(a);}); s.completed=true; const hist={title:s.title, profile:s.profile||s.mode, score, correct:corr, partial:part, weighted,total,date:new Date().toLocaleString(), by}; state.examHistory=state.examHistory||[]; if(s.mode==='exam') state.examHistory.push(hist); addXP(score>=75?40:score>=60?25:12); save(); showReport(hist, s.mode!=='exam'); state.session=null; save(); }
function showReport(hist, practice=false){ const weak=Object.entries(hist.by).map(([id,v])=>({id,score:Math.round((v.w ?? v.c)/v.t*100),...v})).sort((a,b)=>a.score-b.score).slice(0,5); const html=`<h2>Informe: ${hist.title}</h2><div class="grid cols-3"><div class="card"><div class="muted small">Resultado ponderado</div><div class="big-number">${hist.score}%</div>${pctBar(hist.score)}<p class="small muted">✅ 1 punto · ❔ 0,5 · ❌ 0</p></div><div class="card"><div class="muted small">Detalle</div><div class="big-number">${hist.correct}/${hist.total}</div><p>✅ correctas · ❔ ${hist.partial||0} dudosas · ❌ ${hist.total-hist.correct-(hist.partial||0)} fallos</p></div><div class="card"><div class="muted small">Lectura real</div><p>${hist.score>=75?'Vas en zona de candidato serio. Mantén simulacros y writing.':hist.score>=60?'B1 alto/B2 raspado. Hay que convertir las ❔ en ✅ y machacar fallos concretos.':'Aún no es zona B2. No estudies más temas: trabaja tus rojos y dudas.'}</p></div></div><h3>Módulos débiles</h3>${weak.map(w=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${moduleById(w.id)?.title}</b><span>${w.score}% ${w.p?`· ❔ ${w.p}`:''}</span></div>${pctBar(w.score)}<button class="btn ghost" style="margin-top:8px" onclick="closeModal();showView('theory',{id:'${w.id}'})">Ver teoría</button> <button class="btn" style="margin-top:8px" onclick="closeModal();startModuleSession('${w.id}',12)">Practicar</button></div>`).join('')}<div class="btn-row"><button class="btn" onclick="closeModal();startSmartSession()">Siguiente sesión inteligente</button><button class="btn secondary" onclick="closeModal();showView('progress')">Ver progreso</button></div>`; openModal(html); }
function openModal(html){$('modal').innerHTML=html;$('modalBack').style.display='flex'} function closeModal(){$('modalBack').style.display='none'}
$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function pickQuestions(mods,count,preferWeak=false){ let pool=EXERCISES.filter(q=>mods.includes(q.module)&&!['writing','tracker'].includes(q.type)); if(!pool.length) pool=EXERCISES.filter(q=>!['writing','tracker'].includes(q.type)); const scored=pool.map(q=>{const a=state.answers[q.id]; const m=moduleById(q.module); let score=Math.random(); if(!a) score+=5; if(a && answerStatus(a)==='incorrect') score+=8; if(a && answerStatus(a)==='partial') score+=5; if(preferWeak) score+=(100-mastery(q.module))/12; score+=(m?.priority||5)/10; return {q,score};}).sort((a,b)=>b.score-a.score); return scored.slice(0,Math.min(count,scored.length)).map(x=>x.q.id); }
function startSession(title, ids, mode='practice', profile='custom'){ state.session={title,ids,index:0,responses:{},mode,profile,startedAt:new Date().toISOString(),completed:false}; save(); showView('session'); }
function startCustomSession(ids,title='Sesión personalizada'){ startSession(title,ids,'practice','custom'); }
function startModuleSession(id,count=10){ const m=moduleById(id); const ids=pickQuestions([id],count,true); startSession(m.title, ids, 'practice', id); }
function startSmartSession(){ const mods=weakModules(6).map(m=>m.id); const ids=pickQuestions(mods,20,true); startSession('Sesión inteligente: zona roja', ids, 'practice','smart'); }
function startMistakeSession(){ const ids=Object.entries(state.answers).filter(([id,a])=>answerStatus(a)!=='correct').map(([id])=>id); if(!ids.length){toast('Aún no tienes fallos ni dudas. Haz diagnóstico primero.'); return;} startSession('Reentreno de fallos y dudas', ids.slice(-30).reverse(), 'practice','mistakes'); }
function startExam(id){ const p=EXAM_PROFILES.find(x=>x.id===id); if(!p)return; const ids=pickQuestions(p.modules,p.count,true); startSession(p.title, ids, 'exam', p.id); state.session.minutes=p.minutes; save(); }
function quickContinue(){ if(state.session && !state.session.completed) showView('session'); else startSmartSession(); }
function openWriting(id){ const q=exerciseById(id); const html=`<h2>${q.clue}: Writing practice</h2><p>${q.prompt}</p><textarea class="textarea" id="writingBox" oninput="updateWritingCount()"></textarea><p id="writingCount" class="muted">0 palabras</p><div class="feedback info"><b>Checklist B2:</b><ul><li>140-190 palabras</li><li>4 párrafos claros</li><li>2-4 conectores</li><li>Responde todos los puntos</li><li>Revisa present perfect, articles y prepositions</li></ul></div><button class="btn" onclick="saveWriting('${id}')">Guardar writing</button>`; openModal(html); }
function updateWritingCount(){ const words=($('writingBox').value.trim().match(/\b\S+\b/g)||[]).length; $('writingCount').textContent=words+' palabras'; }
function saveWriting(id){ const text=$('writingBox').value; const words=(text.trim().match(/\b\S+\b/g)||[]).length; state.writing.push({id,text,words,date:new Date().toISOString()}); markStudy(); addXP(words>=140&&words<=190?30:12); save(); closeModal(); toast('Writing guardado. Palabras: '+words); render(); }
function saveListening(){ state.listening.push({min:$('listenMin').value,diff:$('listenDiff').value,task:$('listenTask').value,notes:$('listenNotes').value,date:new Date().toISOString()}); addXP(8); markStudy(); save(); render(); toast('Listening guardado.'); }
function exportProgress(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='erasmus-b2-progress.json'; a.click(); URL.revokeObjectURL(url); }
function importProgress(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=()=>{const f=inp.files[0]; const r=new FileReader(); r.onload=()=>{try{state={...state,...JSON.parse(r.result)}; save(); render(); toast('Progreso importado');}catch(e){toast('Archivo inválido')}}; r.readAsText(f)}; inp.click(); }
function resetProgress(){ if(confirm('¿Seguro? Esto borra progreso local de este navegador.')){localStorage.removeItem(STORAGE_KEY); state=loadState(); showView('dashboard');}}
window.addEventListener('keydown',e=>{ if(currentView==='session' && e.key==='Enter' && !e.shiftKey){ const s=state.session; if(!s)return; const q=exerciseById(s.ids[s.index]); if(q && q.type==='input' && !s.responses[q.id]) submitAnswer(q.id); }});
showView('dashboard');
</script>
</body>
</html>
