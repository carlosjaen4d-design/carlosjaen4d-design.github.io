 "title": "Reading comprehension", "meta": {"text": "Carlos wants to do his work placement abroad. At first, he believed that a B2 written test would be impossible because he kept confusing past simple forms with past participles. However, after doing short daily exercises, he noticed a pattern: finished times usually needed the past simple, while experiences or results connected to the present often needed the present perfect. This did not solve everything, but it gave him a reliable starting point. He also realised that memorising random lists was less effective than practising verbs inside sentences."}, "exam": "B2 First style · Reading comprehension", "clue": "Busca la zona exacta del texto y elige la paráfrasis, no la frase que solo copia palabras.", "strategy": "Justifica la respuesta señalando una frase del texto; si no puedes justificarla, no la marques.", "trap": "Trampa: elegir la opción que copia palabras exactas pero cambia el sentido.", "theoryId": "reading-b2"}, {"id": "q147", "topic": "Reading comprehension", "kind": "mcq", "prompt": "What helped him start improving?", "answer": ["Doing short daily exercises."], "options": ["Reading only theory.", "Avoiding grammar.", "Watching films without subtitles.", "Doing short daily exercises."], "explanation": "Short daily exercises helped him notice patterns.", "title": "Reading comprehension", "meta": {"text": "Carlos wants to do his work placement abroad. At first, he believed that a B2 written test would be impossible because he kept confusing past simple forms with past participles. However, after doing short daily exercises, he noticed a pattern: finished times usually needed the past simple, while experiences or results connected to the present often needed the present perfect. This did not solve everything, but it gave him a reliable starting point. He also realised that memorising random lists was less effective than practising verbs inside sentences."}, "exam": "B2 First style · Reading comprehension o; wish mira hacia atrás.", "strategy": "Wish I had + participle = ojalá hubiera...", "trap": "No uses would para arrepentimientos propios del pasado.", "theoryId": "open-cloze"}, {"id": "q196", "topic": "Open cloze", "kind": "input", "prompt": "I am used ___ reading long texts now.", "answer": ["to"], "options": [], "explanation": "Be used to + -ing.", "title": "Open cloze", "meta": {}, "exam": "B2 First style · Part 2 open cloze", "clue": "Aquí “used to” significa estar acostumbrado a.", "strategy": "No confundas be used to + ing con used to + base verb.", "trap": "I am used to read es incorrecto.", "theoryId": "open-cloze"}, {"id": "q197", "topic": "Open cloze", "kind": "input", "prompt": "I used ___ be afraid of writing in English.", "answer": ["to"], "options": [], "explanation": "Used to + base verb = antes solía.", "title": "Open cloze", "meta": {}, "exam": "B2 First style · Part 2 open cloze", "clue": "Aquí habla de un hábito pasado.", "strategy": "Used to do = antes hacía; be used to doing = estar acostumbrado.", "trap": "No uses -ing después de used to en este significado.", "theoryId": "open-cloze"}, {"id": "q198", "topic": "Open cloze", "kind": "input", "prompt": "The exam will be easier if you focus ___ context clues.", "answer": ["on"], "options": [], "explanation": "Focus on.", "title": "Open cloze", "meta": {}, "exam": "B2 First style · Part 2 open cloze", "clue": "La preposición fija de focus es on.", "strategy": "Verbo/adjetivo + preposición: estudia chunks.", "trap": "Focus in casi nunca es correcto en este sentido.", "theoryId": "open-cloze"}, {"id": "q199", "topic": "Word formation", "kind": "input", "prompt": "His ___ improved after two weeks of practice. (CONFIDENT)", "answer": ["confidence"], "options": [], "explanation": "Necesitas un sustantivo después de “his”.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "“His ___ improved” = algo suyo mejoró; confidence es sustantivo.", "strategy": "Mira la palabra antes/después para decidir noun/adjective/adverb.", "trap": "Confident es adjetivo: a confident candidate.", "theoryId": "word-formation"}, {"id": "q200", "topic": "Word formation", "kind": "input", "prompt": "The selection process is very ___. (COMPETE)", "answer": ["competitive"], "options": [], "explanation": "Necesitas un adjetivo después de “is very”.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Very + adjective.", "strategy": "Very normalmente te pide adjetivo/adverbio, no sustantivo.", "trap": "Competition es sustantivo.", "theoryId": "word-formation"}, {"id": "q201", "topic": "Word formation", "kind": "input", "prompt": "Good ___ is important in a formal email. (ORGANISE)", "answer": ["organisation"], "options": [], "explanation": "Good + noun.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "La frase habla de “la organización” como cualidad.", "strategy": "Después de adjective como good, normalmente va un noun.", "trap": "Organised sería adjetivo: a well-organised email.", "theoryId": "word-formation"}, {"id": "q202", "topic": "Word formation", "kind": "input", "prompt": "You should read the instructions ___. (CAREFUL)", "answer": ["carefully"], "options": [], "explanation": "Necesitas adverbio para modificar read.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "La palabra explica cómo leer.", "strategy": "Verbo + adverbio: read carefully, answer clearly.", "trap": "Careful es adjetivo.", "theoryId": "word-formation"}, {"id": "q203", "topic": "Word formation", "kind": "input", "prompt": "The Erasmus programme can improve your ___. (EMPLOY)", "answer": ["employability"], "options": [], "explanation": "Employability = capacidad de conseguir empleo.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Después de your necesitas un sustantivo.", "strategy": "En contexto de carrera, employability es palabra B2 útil.", "trap": "Employment también existe, pero aquí encaja peor: “your employment” sería tu empleo actual.", "theoryId": "word-formation"}, {"id": "q204", "topic": "Word formation", "kind": "input", "prompt": "The written test was ___ challenging. (SURPRISE)", "answer": ["surprisingly"], "options": [], "explanation": "Necesitas un adverbio antes de adjective “challenging”.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Adverbio + adjetivo: surprisingly challenging.", "strategy": "Si modifica un adjetivo, usa -ly normalmente.", "trap": "Surprised describe persona; surprising describe cosa.", "theoryId": "word-formation"}, {"id": "q205", "topic": "Word formation", "kind": "input", "prompt": "It is ___ to improve without regular practice. (POSSIBLE)", "answer": ["impossible"], "options": [], "explanation": "El sentido pide negativo.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "“Without regular practice” indica que no se puede mejorar.", "strategy": "Comprueba si la frase necesita prefijo negativo: un-, in-, im-, dis-.", "trap": "Possible gramaticalmente cabe, pero el sentido queda mal.", "theoryId": "word-formation"}, {"id": "q206", "topic": "Word formation", "kind": "input", "prompt": "The coordinator gave us useful ___. (INFORM)", "answer": ["information"], "options": [], "explanation": "Information es sustantivo incontable.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Useful + noun; además information no lleva plural normal.", "strategy": "Aprende palabras incontables frecuentes: information, advice, homework.", "trap": "Informations es incorrecto.", "theoryId": "word-formation"}, {"id": "q207", "topic": "Word formation", "kind": "input", "prompt": "A strong letter of ___ can help your application. (MOTIVATE)", "answer": ["motivation"], "options": [], "explanation": "Letter of motivation = carta de motivación.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Es una expresión fija del proceso Erasmus.", "strategy": "Busca collocations del propio examen.", "trap": "Motivating sería adjetivo.", "theoryId": "word-formation"}, {"id": "q208", "topic": "Word formation", "kind": "input", "prompt": "The candidate answered the questions ___. (CLEAR)", "answer": ["clearly"], "options": [], "explanation": "Necesitas adverbio: answered clearly.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "La palabra modifica al verbo answered.", "strategy": "Verbo + -ly si explica cómo se hace.", "trap": "Clear answer sí; answered clear no.", "theoryId": "word-formation"}, {"id": "q209", "topic": "Word formation", "kind": "input", "prompt": "It was a very ___ explanation. (HELP)", "answer": ["helpful"], "options": [], "explanation": "Necesitas adjetivo antes de explanation.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "A very ___ explanation = adjetivo.", "strategy": "Sufijo -ful crea adjetivos: useful, helpful, careful.", "trap": "Helpfully sería adverbio.", "theoryId": "word-formation"}, {"id": "q210", "topic": "Word formation", "kind": "input", "prompt": "I made several ___ in the mock test. (IMPROVE)", "answer": ["improvements"], "options": [], "explanation": "Several + plural noun.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Several te obliga a plural.", "strategy": "Mira cuantificadores: several/many → plural countable.", "trap": "Improvement sin s sería singular.", "theoryId": "word-formation"}, {"id": "q211", "topic": "Word formation", "kind": "input", "prompt": "The most ___ thing is to practise mistakes, not only new topics. (EFFECT)", "answer": ["effective"], "options": [], "explanation": "Necesitas adjetivo: the most effective thing.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "Most + adjective.", "strategy": "Effect = noun; effective = adjective.", "trap": "Efficient no viene de EFFECT y cambia el matiz.", "theoryId": "word-formation"}, {"id": "q212", "topic": "Word formation", "kind": "input", "prompt": "There was a lot of ___ about the exact format. (CONFUSE)", "answer": ["confusion"], "options": [], "explanation": "A lot of + noun.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "La frase habla de “confusión”.", "strategy": "Después de a lot of puede ir sustantivo incontable.", "trap": "Confusing es adjetivo.", "theoryId": "word-formation"}, {"id": "q213", "topic": "Word formation", "kind": "input", "prompt": "He completed the task ___. (SUCCESS)", "answer": ["successfully"], "options": [], "explanation": "Necesitas adverbio para modificar completed.", "title": "Word formation", "meta": {}, "exam": "B2 First style · Part 3 word formation", "clue": "La palabra explica cómo completó la tarea.", "strategy": "Success noun; successful adjective; successfully adverb.", "trap": "Successful no modifica directamente a completed.", "theoryId": "word-formation"}, {"id": "q214", "topic": "Key word transformations", "kind": "input", "prompt": "I started studying English seriously in May.\nSINCE\nI ___ May.", "answer": ["have studied English seriously since", "have been studying English seriously since"], "options": [], "explanation": "Since conecta inicio pasado con presente.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "La frase original empieza en May y sigue ahora.", "strategy": "Con since/for casi siempre piensa en Present Perfect.", "trap": "No uses Past Simple con since si sigue vigente.", "theoryId": "key-word-transformations"}, {"id": "q215", "topic": "Key word transformations", "kind": "input", "prompt": "This is my first Erasmus written test.\nNEVER\nI ___ an Erasmus written test before.", "answer": ["have never taken", "have never done"], "options": [], "explanation": "This is my first time = I have never + participle before.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "“Before” y “first” hablan de experiencia vital hasta ahora.", "strategy": "Transforma first time ↔ have never ... before.", "trap": "No pongas “never took” si va conectado al presente.", "theoryId": "key-word-transformations"}, {"id": "q216", "topic": "Key word transformations", "kind": "input", "prompt": "The grammar was too difficult for me to understand.\nENOUGH\nThe grammar was ___ me to understand.", "answer": ["not easy enough for"], "options": [], "explanation": "Too difficult = not easy enough.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "Hay que mantener el significado negativo.", "strategy": "En transformations busca equivalencias: too + adj ↔ not adj opposite + enough.", "trap": "No cambies la keyword ENOUGH.", "theoryId": "key-word-transformations"}, {"id": "q217", "topic": "Key word transformations", "kind": "input", "prompt": "I prefer practising examples to memorising rules.\nRATHER\nI ___ memorise rules.", "answer": ["would rather practise examples than"], "options": [], "explanation": "Prefer X to Y = would rather X than Y.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "Compara dos acciones: practicar vs memorizar.", "strategy": "Would rather + base verb + than + base verb.", "trap": "No uses “to practise” después de rather.", "theoryId": "key-word-transformations"}, {"id": "q218", "topic": "Key word transformations", "kind": "input", "prompt": "Although I was tired, I finished the mock test.\nDESPITE\nI finished the mock test ___ tired.", "answer": ["despite being", "despite feeling"], "options": [], "explanation": "Although + clause = despite + noun/-ing.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "Tienes que convertir “I was tired” en “being tired”.", "strategy": "Después de despite no va sujeto + verbo completo.", "trap": "Despite I was tired es incorrecto.", "theoryId": "key-word-transformations"}, {"id": "q219", "topic": "Key word transformations", "kind": "input", "prompt": "I did not read the instructions carefully, so I failed.\nBECAUSE\nI failed ___ the instructions carefully.", "answer": ["because i did not read", "because i had not read"], "options": [], "explanation": "Because introduce la causa.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "La causa de fallar fue no leer bien.", "strategy": "En transformations conserva la relación lógica.", "trap": "No uses because of + sujeto/verbo.", "theoryId": "key-word-transformations"}, {"id": "q220", "topic": "Key word transformations", "kind": "input", "prompt": "The last time I wrote an essay was two years ago.\nFOR\nI ___ two years.", "answer": ["have not written an essay for", "haven’t written an essay for"], "options": [], "explanation": "The last time...was = have not ... for.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "La acción no ocurre desde hace dos años.", "strategy": "Plantilla: The last time I did X was... ↔ I haven’t done X for...", "trap": "No uses since con “two years”.", "theoryId": "key-word-transformations"}, {"id": "q221", "topic": "Key word transformations", "kind": "input", "prompt": "It is not necessary to answer every question perfectly.\nHAVE\nYou ___ every question perfectly.", "answer": ["do not have to answer", "don’t have to answer"], "options": [], "explanation": "Not necessary = do not have to.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "No habla de prohibición; habla de falta de obligación.", "strategy": "Mustn’t = prohibido; don’t have to = no hace falta.", "trap": "No pongas must not.", "theoryId": "key-word-transformations"}, {"id": "q222", "topic": "Key word transformations", "kind": "input", "prompt": "The coordinator gave me permission to use a dictionary.\nALLOWED\nI ___ a dictionary.", "answer": ["was allowed to use"], "options": [], "explanation": "Be allowed to = tener permiso.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "La primera frase habla de permiso recibido.", "strategy": "Permission ↔ be allowed to.", "trap": "No uses “let to”.", "theoryId": "key-word-transformations"}, {"id": "q223", "topic": "Key word transformations", "kind": "input", "prompt": "I regret not practising listening earlier.\nWISH\nI ___ listening earlier.", "answer": ["wish i had practised", "wish i had practiced"], "options": [], "explanation": "Regret about past = wish + had + participle.", "title": "Key word transformations", "meta": {"words": "2-5 words usually; keep the keyword unchanged"}, "exam": "B2 First style · Part 4 key word transformations", "clue": "Te arrepientes de algo que no hiciste antes.", "strategy": "Wish I had + participle = ojalá hubiera...", "trap": "No uses wish I would para acciones propias pasadas.", "theoryI const STORE_KEY = 'erasmusB2Progress_v3';
const OLD_STORE_KEY = 'erasmusB2Progress_v2';
let currentView = 'home';
let session = null;
let mockTimer = null;
let mockEnd = null;
let theoryFocus = null;
let progress = loadProgress();

function defaultProgress() { return {answers:[], writing:[], listening:[], daily:{}, theoryRead:{}, settings:{autoTheory:false}}; }
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
    const p = raw ? JSON.parse(raw) : defaultProgress();
    p.answers ||= []; p.writing ||= []; p.listening ||= []; p.daily ||= {}; p.theoryRead ||= {}; p.settings ||= {autoTheory:false};
    return p;
  } catch(e) { return defaultProgress(); }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function norm(s) { return String(s||'').trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' '); }
function shuffle(a) { return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]); }
function sample(a,n) { return shuffle(a.slice()).slice(0, Math.min(n,a.length)); }
function todayKey() { return new Date().toISOString().slice(0,10); }
function topics() { return [...new Set(APP_DATA.items.map(i=>i.topic))].sort(); }
function examParts() { return [...new Set(APP_DATA.items.map(i=>i.exam||'B2 written practice'))].sort(); }
function theoryById(id) { return APP_DATA.theory.find(t=>t.id===id) || APP_DATA.theory.find(t=>t.id==='exam-strategy'); }

function allStats() { const a=progress.answers; const correct=a.filter(x=>x.correct).length; return {attempted:a.length, correct, pct:a.length?Math.round(correct*100/a.length):0}; }
function topicStats(topic) { const a=progress.answers.filter(x=>x.topic===topic); const correct=a.filter(x=>x.correct).length; return {attempted:a.length, correct, pct:a.length?Math.round(correct*100/a.length):0}; }
function itemStats(id) { const a=progress.answers.filter(x=>x.id===id); const correct=a.filter(x=>x.correct).length; return {attempted:a.length, correct, pct:a.length?Math.round(correct*100/a.length):0}; }
function weakestTopics() { return topics().map(t=>({topic:t,...topicStats(t)})).sort((a,b)=> (a.pct||0)-(b.pct||0) || b.attempted-a.attempted); }
function dueItems(pool) { return pool.slice().sort((a,b)=>{
  const sa=itemStats(a.id), sb=itemStats(b.id);
  const scoreA = (sa.attempted?sa.pct:0) + sa.attempted*3;
  const scoreB = (sb.attempted?sb.pct:0) + sb.attempted*3;
  return scoreA-scoreB;
}); }

function setView(v) { currentView=v; session=null; clearInterval(mockTimer); render(); }
function openTheory(id) { theoryFocus=id || 'exam-strategy'; currentView='theory'; session=null; render(); setTimeout(()=>{ const el=document.getElementById('theory-'+theoryFocus); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },60); }
function markTheoryRead(id) { progress.theoryRead[id]=new Date().toISOString(); save(); render(); }

function renderNav() {
  const tabs=[['home','Panel'],['theory','Teoría'],['practice','Práctica'],['mock','Simulacro'],['writing','Writing'],['listening','Listening'],['review','Fallos'],['data','Datos']];
  document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${currentView===id?'active':''}" onclick="setView('${id}')">${label}</button>`).join('');
}
function render() {

function renderData() {
  const all=allStats();
  return `<div class="grid"><div class="card span6"><h2>Exportar / importar progreso</h2><p>Úsalo para pasar progreso del PC al móvil. Al alojarla, seguirá guardando en el navegador salvo que añadamos backend.</p><button class="primary" onclick="exportProgress()">Exportar JSON</button><br><br><textarea id="importBox" placeholder="Pega aquí el JSON exportado"></textarea><button onclick="importProgress()">Importar</button></div><div class="card span6"><h2>Reset y alojamiento</h2><p>Total: <b>${all.attempted}</b> intentos, <b>${all.correct}</b> correctas.</p><button class="danger" onclick="resetProgress()">Borrar progreso</button><hr><div class="hosting"><b>Lista para alojar:</b> sube este <code>index.html</code> a GitHub Pages, Netlify o Vercel. No usa backend ni librerías externas.</div><h3>Fuentes usadas como orientación</h3>${APP_DATA.sources.map(s=>`<p class="source"><b>${escapeHtml(s.name)}:</b> ${escapeHtml(s.note)}</p>`).join('')}</div></div>`;
}
function exportProgress() { const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='progreso_erasmus_b2.json'; a.click(); URL.revokeObjectURL(a.href); }
function importProgress() { try { const txt=document.getElementById('importBox').value; progress=JSON.parse(txt); progress.settings ||= {autoTheory:false}; save(); alert('Progreso importado.'); render(); } catch(e) { alert('JSON no válido.'); } }
function resetProgress() { if(confirm('¿Seguro? Esto borra el progreso de esta versión en este navegador.')) { localStorage.removeItem(STORE_KEY); progress=loadProgress(); render(); } }

render();
</script>
</body>
</html>
