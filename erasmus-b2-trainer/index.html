<script>
const MODULES = [{"id": "exam_strategy", "title": "Estrategia de examen B2", "group": "Base", "priority": 10, "goal": "Entender qué te pueden pedir y cómo no perderte.", "theory": {"remember": "No estudias “inglés infinito”: estudias formatos de prueba. En B2 suelen mezclar gramática + vocabulario + lectura + writing.", "formula": "Leer consigna → detectar tipo de ejercicio → buscar pista del contexto → responder → revisar trampa típica.", "clues": ["Opciones A/B/C/D = suelen mirar collocations, phrasal verbs o matices.", "Hueco sin opciones = casi siempre palabra gramatical: preposición, auxiliar, pronombre, artículo, linker.", "Palabra base en mayúsculas = cambia familia de palabra: noun/adjective/adverb/negative.", "Reescritura = mismo significado, otra estructura. No inventes información."], "wrong_right": [["I answer fast because I know the topic.", "Primero identifico el formato: cloze, word formation, transformation, reading o writing."], ["I translate literally from Spanish.", "Busco la estructura inglesa que encaja."]], "exam_move": "Cuando te bloquees, no pienses “no sé inglés”. Pregunta: ¿qué tipo de hueco es? ¿verbo, preposición, conector, palabra derivada?", "common_trap": "Leer demasiado rápido y contestar por intuición española.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "present_simple_continuous", "title": "Present Simple vs Present Continuous", "group": "Tenses", "priority": 7, "goal": "Distinguir rutina/verdad general de acción temporal/ahora.", "theory": {"remember": "Present Simple = rutina o verdad general. Present Continuous = ahora o situación temporal.", "formula": "Simple: subject + verb / does. Continuous: am/is/are + verb-ing.", "clues": ["usually, always, often, every day → Present Simple", "now, at the moment, today, this week → Present Continuous", "stative verbs como know, like, believe normalmente NO van en continuous"], "wrong_right": [["I am knowing the answer.", "I know the answer."], ["She works today because her colleague is ill.", "She is working today because her colleague is ill."]], "exam_move": "Mira si habla de hábito o de algo temporal. Si aparece “this week”, sospecha continuous.", "common_trap": "Poner -ing a verbos de estado: know, believe, understand, like.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "past_simple_continuous", "title": "Past Simple vs Past Continuous", "group": "Tenses", "priority": 7, "goal": "Narrar pasado: acción puntual vs acción en progreso.", "theory": {"remember": "Past Continuous pinta el fondo; Past Simple cuenta el golpe/acción que interrumpe.", "formula": "Past Simple: verb-ed / irregular. Past Continuous: was/were + verb-ing.", "clues": ["when + acción corta → Past Simple", "while + acción larga → Past Continuous", "at 8 yesterday → often Past Continuous"], "wrong_right": [["While I walked home, it started to rain.", "While I was walking home, it started to rain."], ["I was seeing him yesterday.", "I saw him yesterday."]], "exam_move": "Busca dos acciones: la larga suele ir en continuous; la corta en simple.", "common_trap": "Usar continuous con verbos que no suelen llevarlo o con acciones cerradas.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "present_perfect_past_simple", "title": "Present Perfect vs Past Simple", "group": "Tenses", "priority": 10, "goal": "Tu bloque crítico: conectar pasado con presente o cerrar el pasado.", "theory": {"remember": "Present Perfect = pasado conectado con ahora. Past Simple = pasado terminado y localizado.", "formula": "Present Perfect: have/has + participle. Past Simple: verb-ed / irregular past.", "clues": ["since, for, already, yet, ever, never, just, recently → Present Perfect", "yesterday, last year, in 2020, ago, when I was… → Past Simple", "ever/never preguntan experiencia hasta ahora"], "wrong_right": [["I saw that film three times.", "I have seen that film three times."], ["I have seen him yesterday.", "I saw him yesterday."]], "exam_move": "Subraya la palabra de tiempo. Si es tiempo terminado, Past Simple. Si conecta con ahora, Present Perfect.", "common_trap": "Usar “spoke” como participio: debe ser “spoken”.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "present_perfect_simple_cont", "title": "Present Perfect Simple vs Continuous", "group": "Tenses", "priority": 8, "goal": "Diferenciar resultado de duración/proceso.", "theory": {"remember": "Simple mira el resultado; continuous mira la duración o actividad en progreso hasta ahora.", "formula": "Simple: have/has + participle. Continuous: have/has been + verb-ing.", "clues": ["how many / result / completed → simple", "how long / all day / recently + actividad → continuous", "state verbs suelen ir en simple: I have known"], "wrong_right": [["I have been knowing him for years.", "I have known him for years."], ["She has written three emails all morning.", "She has written three emails this morning / She has been writing emails all morning."]], "exam_move": "Pregunta mental: ¿importa cuánto ha conseguido o cuánto lleva haciéndolo?", "common_trap": "Usar continuous con know, own, believe.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "irregular_participles", "title": "Irregular verbs & participles", "group": "Tenses", "priority": 10, "goal": "No perder puntos por formas básicas: gone, eaten, seen, written, spoken, taken, broken.", "theory": {"remember": "Los irregulares no se aprenden por intuición española: se aprenden como tabla base → past simple → past participle. Para B2, lo urgente no es memorizar 200, sino dominar los 50 más frecuentes y no confundir past simple con participio.", "formula": "Infinitive: go. Past simple: went. Past participle: gone. Present Perfect: have/has + gone. Past Perfect: had + gone. Passive: be + gone/written/done según verbo.", "clues": ["have/has/had + hueco → participio: have written, has gone, had eaten", "yesterday/last week/in 2020 + hueco → past simple: wrote, went, ate", "did + sujeto + infinitive → Did you go? no Did you went?", "be + participio → passive: was written, has been sent"], "wrong_right": [["I have began it.", "I have begun it."], ["She has wrote the email.", "She has written the email."], ["Did you went?", "Did you go?"], ["The report was wrote.", "The report was written."]], "exam_move": "Antes de escribir, mira la palabra anterior: si ves have/has/had/be, casi siempre necesitas participio. Si ves did, necesitas infinitivo. Si ves una fecha cerrada, suele ser past simple.", "common_trap": "Pensar que began/broke/spoke/wrote valen después de have. No: esas son formas de pasado simple; después de have necesitas begun/broken/spoken/written.", "wiki": [{"title": "Cómo memorizar sin morir", "body": "Agrupa verbos por patrones: i-a-u (begin-began-begun), o-en (speak-spoke-spoken), iguales (put-put-put), y past=participle (buy-bought-bought)."}, {"title": "Regla anti-error", "body": "No preguntes '¿cómo se dice en pasado?'. Pregunta '¿qué estructura tengo delante?': have/has/had pide participio; yesterday pide past simple; did pide infinitivo."}, {"title": "Prioridad Erasmus", "body": "Primero domina go, eat, see, write, speak, take, give, do, begin, break, choose, know, forget, send, make y get. Salen muchísimo en huecos y transformations."}]}}, {"id": "past_perfect", "title": "Past Perfect & Past Perfect Continuous", "group": "Tenses", "priority": 8, "goal": "Ordenar dos pasados: qué ocurrió antes.", "theory": {"remember": "Past Perfect marca la acción anterior a otra acción pasada.", "formula": "Past Perfect: had + participle. Past Perfect Continuous: had been + verb-ing.", "clues": ["by the time, before, after, already + pasado", "dos acciones pasadas: una va antes de la otra", "duration before a past moment → had been + ing"], "wrong_right": [["When I arrived, she left already.", "When I arrived, she had already left."], ["They had been waited for an hour.", "They had been waiting for an hour."]], "exam_move": "Dibuja una línea temporal: pasado anterior = had + participle.", "common_trap": "Usarlo en cualquier pasado aunque no haga falta.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "future_forms", "title": "Future forms", "group": "Tenses", "priority": 8, "goal": "Elegir will, going to, present continuous o present simple.", "theory": {"remember": "No todo futuro es “will”. Cada forma tiene una intención.", "formula": "will = decisión/predicción; going to = plan/evidencia; present continuous = arreglo concreto; present simple = horarios.", "clues": ["Look at those clouds → going to", "I think/probably → will", "meeting at 6 with person/place → present continuous", "train/class starts → present simple"], "wrong_right": [["Look at the sky. It will rain.", "Look at the sky. It is going to rain."], ["The train is going to leave at 8.", "The train leaves at 8."]], "exam_move": "Pregunta: ¿es decisión espontánea, plan, evidencia o horario?", "common_trap": "Usar will para todo.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "conditionals", "title": "Conditionals", "group": "Grammar B2", "priority": 9, "goal": "Dominar if/unless/provided + condicionales 0,1,2,3 y mixed.", "theory": {"remember": "Los condicionales mezclan tiempo verbal con probabilidad/realidad.", "formula": "0: if + present, present. 1: if + present, will. 2: if + past, would. 3: if + past perfect, would have + participle.", "clues": ["general truth → zero", "real future → first", "imaginary present → second", "imaginary past/regret → third", "unless = if not"], "wrong_right": [["If I will see him, I will tell him.", "If I see him, I will tell him."], ["If I knew, I would have helped.", "If I had known, I would have helped."]], "exam_move": "Mira si habla de futuro real, presente imaginario o pasado imposible.", "common_trap": "Poner will justo después de if en first conditional.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Tabla mental", "body": "Real future: If I study, I will pass. Imaginary present: If I studied, I would pass. Regret past: If I had studied, I would have passed."}, {"title": "Regla de oro", "body": "Después de if en first conditional normalmente no pongas will."}]}}, {"id": "passive_voice", "title": "Passive voice", "group": "Grammar B2", "priority": 8, "goal": "Cambiar foco: de quien hace la acción a la cosa/persona afectada.", "theory": {"remember": "Pasiva = be + participle. Se usa cuando importa más el objeto que quien hizo la acción.", "formula": "Object + be + participle (+ by agent).", "clues": ["by + persona puede aparecer, pero muchas veces se omite", "was/were + participle para pasado", "has/have been + participle para present perfect passive"], "wrong_right": [["The report wrote yesterday.", "The report was written yesterday."], ["The emails have sent.", "The emails have been sent."]], "exam_move": "Busca el objeto de la activa y ponlo como sujeto. Luego ajusta be al tiempo correcto.", "common_trap": "Olvidar el verbo “be”.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Plantilla universal", "body": "Objeto + be en el tiempo correcto + participio. They sent the email → The email was sent."}, {"title": "Tiempos comunes", "body": "is sent, was sent, has been sent, will be sent, is being sent."}]}}, {"id": "reported_speech", "title": "Reported speech", "group": "Grammar B2", "priority": 8, "goal": "Contar lo que alguien dijo sin repetirlo literal.", "theory": {"remember": "Reported speech suele mover el tiempo un paso atrás si el reporting verb está en pasado.", "formula": "“I am tired” → She said she was tired. Questions: asked if / asked where + subject + verb.", "clues": ["said/told/asked", "comillas desaparecen", "pregunta indirecta NO usa orden de pregunta"], "wrong_right": [["She said me she was tired.", "She told me she was tired. / She said she was tired."], ["He asked where was I.", "He asked where I was."]], "exam_move": "Cambia pronombres, tiempo verbal y orden de pregunta.", "common_trap": "Usar “said me” o mantener orden de pregunta.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Cambios básicos", "body": "am/is → was; are → were; do/does → did; did → had done; can → could; will → would; my → his/her según sujeto."}, {"title": "Pregunta indirecta", "body": "He asked where I was. No: He asked where was I."}]}}, {"id": "modal_verbs", "title": "Modal verbs", "group": "Grammar B2", "priority": 8, "goal": "Obligación, consejo, posibilidad, deducción y crítica del pasado.", "theory": {"remember": "Los modales cambian el grado de seguridad u obligación.", "formula": "modal + infinitive. Modal perfect: modal + have + participle.", "clues": ["must = obligación/deducción fuerte", "might/may/could = posibilidad", "can’t = imposibilidad/deducción negativa", "should have + participle = crítica del pasado"], "wrong_right": [["You must to study.", "You must study."], ["He must be at home; I saw his car.", "He must be at home; I saw his car."], ["You should studied.", "You should have studied."]], "exam_move": "Pregunta: ¿habla de obligación, consejo o deducción?", "common_trap": "Poner “to” después de must/should/can.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "relative_clauses", "title": "Relative clauses", "group": "Grammar B2", "priority": 7, "goal": "Unir información con who, which, that, where, whose.", "theory": {"remember": "Relative clauses añaden información sobre una persona, cosa, lugar o posesión.", "formula": "Person → who/that. Thing → which/that. Place → where. Possession → whose.", "clues": ["coma = información extra; no uses that en non-defining", "whose + noun = posesión", "where = lugar"], "wrong_right": [["The man which called you is here.", "The man who called you is here."], ["Madrid, that is big, is expensive.", "Madrid, which is big, is expensive."]], "exam_move": "Identifica qué palabra estás describiendo: persona, cosa, lugar o posesión.", "common_trap": "Usar “which” para personas o “that” entre comas.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "articles_quantifiers", "title": "Articles & quantifiers", "group": "Grammar B2", "priority": 7, "goal": "A/the/zero y cantidad: much, many, few, little, each, every.", "theory": {"remember": "Articles dependen de si hablamos de algo general, nuevo o conocido.", "formula": "a/an = uno no específico; the = específico/conocido; zero = plural/uncountable general.", "clues": ["first mention → a/an", "second mention → the", "general plural → no article", "uncountable: much/little; countable: many/few"], "wrong_right": [["The people need the money.", "People need money."], ["I have many information.", "I have a lot of information."]], "exam_move": "Pregunta: ¿hablo en general o de algo concreto?", "common_trap": "Poner “the” porque en español usamos “la/el”.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "prepositions_collocations", "title": "Prepositions & collocations", "group": "Use of English", "priority": 9, "goal": "Aprender combinaciones fijas que caen mucho.", "theory": {"remember": "Muchas preposiciones no se razonan: se aprenden como pack.", "formula": "adjective/verb/noun + preposition: interested in, depend on, responsible for, good at.", "clues": ["interested in", "depend on", "responsible for", "afraid of", "arrive at/in", "on time vs in time"], "wrong_right": [["I am interested on Erasmus.", "I am interested in Erasmus."], ["It depends of the result.", "It depends on the result."]], "exam_move": "No traduzcas “en/de”. Aprende el bloque entero.", "common_trap": "Traducir desde español: depender de → depend of, pero en inglés es depend on.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Collocations que conviene memorizar", "body": "interested in, good at, responsible for, depend on, afraid of, similar to, different from, proud of, famous for, married to, worried about."}, {"title": "Regla práctica", "body": "Las preposiciones no se traducen literalmente. Se aprenden como pareja fija: adjective/verb + preposition."}]}}, {"id": "gerunds_infinitives", "title": "Verb patterns: -ing / to", "group": "Use of English", "priority": 8, "goal": "Saber qué verbos piden gerundio o infinitivo.", "theory": {"remember": "Algunos verbos piden -ing, otros to + infinitive. Es vocabulario gramatical.", "formula": "enjoy/avoid/mind + ing. decide/want/hope + to. let/make + infinitive without to.", "clues": ["enjoy doing", "avoid doing", "decide to do", "want to do", "stop doing vs stop to do"], "wrong_right": [["I enjoy to play football.", "I enjoy playing football."], ["She decided going abroad.", "She decided to go abroad."]], "exam_move": "Aprende el verbo junto con lo que exige: enjoy doing, decide to do.", "common_trap": "Elegir por traducción española.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "linkers_clauses", "title": "Linkers & clauses", "group": "Use of English", "priority": 9, "goal": "Conectar ideas en writing y resolver huecos B2.", "theory": {"remember": "Los conectores dan lógica: contraste, causa, resultado, propósito o condición.", "formula": "although + clause; despite + noun/-ing; because + clause; because of + noun; so that + clause.", "clues": ["although/even though = contraste + frase", "despite/in spite of = contraste + nombre o -ing", "however = conector entre frases", "therefore/as a result = consecuencia"], "wrong_right": [["Despite it was raining, we went out.", "Although it was raining, we went out. / Despite the rain, we went out."], ["Because the traffic, I was late.", "Because of the traffic, I was late."]], "exam_move": "Mira lo que viene después: frase completa o nombre/-ing.", "common_trap": "Confundir although con despite.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Conectores B2 útiles", "body": "although + clause; despite/in spite of + noun/-ing; however al inicio con coma; because + clause; because of + noun/-ing; so that + subject + can/could."}, {"title": "Trampa frecuente", "body": "No mezcles although con but en la misma frase: Although it was hard, I passed. No: Although it was hard, but I passed."}]}}, {"id": "open_cloze", "title": "Open cloze", "group": "Exam parts", "priority": 10, "goal": "Rellenar huecos sin opciones: auxiliares, preposiciones, artículos, linkers.", "theory": {"remember": "Open cloze no suele pedir palabras raras. Pide palabras pequeñas que sostienen la frase.", "formula": "Hueco → mira antes y después → decide función: auxiliary, preposition, article, pronoun, linker.", "clues": ["have/has + participle", "interested ___ = in", "a/the/zero", "although/however/because", "too/enough, so/such"], "wrong_right": [["I have lived here ___ 2020 → for", "I have lived here since 2020."], ["She is good ___ maths → in", "She is good at maths."]], "exam_move": "No busques vocabulario bonito. Busca la pieza gramatical que falta.", "common_trap": "Poner una palabra de significado cuando falta una palabra funcional.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Lo que suele pedir", "body": "auxiliares, artículos, preposiciones, pronombres, relative words, linkers e intensifiers como so/such."}, {"title": "No es adivinar", "body": "Mira la estructura alrededor del hueco: palabra antes, palabra después y tipo de frase."}]}}, {"id": "word_formation", "title": "Word formation", "group": "Exam parts", "priority": 10, "goal": "Cambiar familias de palabras: noun, adjective, adverb, negative.", "theory": {"remember": "No cambias el significado libremente: cambias la categoría para que encaje.", "formula": "success → successful → successfully. possible → impossible. inform → information.", "clues": ["before noun → adjective", "after verb / modifies adjective → adverb", "after article/preposition → noun", "negative context → prefix: un-, in-, im-, dis-"], "wrong_right": [["The exam was success.", "The exam was successful."], ["She answered careful.", "She answered carefully."]], "exam_move": "Mira el hueco como pieza de Lego: ¿necesito noun, adjective, adverb o verb?", "common_trap": "Poner la palabra base sin adaptarla.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}, {"title": "Familias típicas", "body": "success → successful → successfully; decide → decision; possible → impossible; care → careful/careless; employ → employer/employee/employment."}, {"title": "Movimiento", "body": "Mira lo que falta: noun después de artículo/adjetivo, adjective antes de noun, adverb antes de adjective/verb, negative si el sentido lo pide."}]}}, {"id": "transformations", "title": "Key word transformations", "group": "Exam parts", "priority": 10, "goal": "Reescribir con mismo significado usando palabra obligatoria.", "theory": {"remember": "No traduzcas: conserva significado y usa la estructura que pide la keyword.", "formula": "Keyword no se cambia. Normalmente 2-5 palabras. Estructuras típicas: too/enough, wish, despite, unless, passive, reported, comparative.", "clues": ["although ↔ despite", "if not ↔ unless", "active ↔ passive", "I regret ↔ I wish", "same meaning exacto"], "wrong_right": [["Although it rained, we went out. DESPITE → Despite it rained...", "Despite the rain, we went out."], ["I regret not studying. WISH → I wish I study...", "I wish I had studied."]], "exam_move": "Identifica la transformación, no inventes una frase nueva.", "common_trap": "Cambiar la keyword o cambiar el significado.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "reading", "title": "Reading B2", "group": "Exam parts", "priority": 8, "goal": "Leer con objetivo: gist, detail, attitude, reference, matching.", "theory": {"remember": "En reading B2 no basta con entender palabras: hay que entender intención, contraste y evidencia.", "formula": "Pregunta → localizar zona → subrayar evidencia → descartar distractores.", "clues": ["opinion/attitude: look for adjectives and contrast", "detail: locate exact evidence", "reference: what does “this/it/they” refer to?", "matching: scan keywords and synonyms"], "wrong_right": [["Elijo una opción porque tiene palabras parecidas.", "Elijo la opción que coincide con la idea, aunque use sinónimos."]], "exam_move": "Primero lee pregunta, luego texto. Las opciones trampa suelen copiar palabras del texto pero cambiar la idea.", "common_trap": "Responder por “me suena” sin prueba en el texto.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "writing", "title": "Writing B2", "group": "Exam parts", "priority": 9, "goal": "Escribir textos claros de 140-190 palabras con estructura B2.", "theory": {"remember": "Writing B2 premia claridad, organización, rango y control. No necesitas sonar nativo; necesitas sonar ordenado.", "formula": "Essay: intro → idea 1 → idea 2 → own idea/opinion → conclusion. Email/report/review: formato + propósito claro.", "clues": ["140-190 words", "answer all bullet points", "use linkers", "avoid repetir always good/bad", "check verb tenses and articles"], "wrong_right": [["I think this because yes.", "One reason is that it gives students more independence."], ["No paragraphs.", "4 paragraphs clear."]], "exam_move": "Antes de escribir: tipo de texto, destinatario, 3 ideas, 6 conectores seguros.", "common_trap": "Escribir mucho sin estructura y con frases demasiado largas.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}, {"id": "listening", "title": "Listening tracker", "group": "Skills", "priority": 5, "goal": "Registrar práctica de listening aunque la prueba escrita sea prioridad.", "theory": {"remember": "Listening se mejora con repetición corta y activa, no con vídeos de fondo.", "formula": "Listen → answer/check → replay → note 3 words → shadow 2 sentences.", "clues": ["opinions often come after but/however", "listen for stress and synonyms", "names/numbers need precision"], "wrong_right": [["Pongo Netflix de fondo.", "Hago 10 minutos activos con preguntas y repetición."]], "exam_move": "Si hay listening, escucha la segunda vez para confirmar, no para entender todo desde cero.", "common_trap": "Querer entender el 100% y bloquearte.", "wiki": [{"title": "Qué mira el examen", "body": "Este módulo no va de teoría bonita: en prueba escrita suele aparecer escondido en huecos, opción múltiple, transformations o writing. Busca la pista del contexto antes de responder."}, {"title": "Cómo responder", "body": "Identifica la estructura, decide la forma gramatical y comprueba si el hueco pide una palabra, varias palabras o una frase completa."}]}}];

HOOSE_ONE."}, {"id": "q0223", "module": "reading", "type": "mcq", "prompt": "What is the main warning in the text?", "answer": ["gamification can distract from learning"], "options": ["points are always bad", "badges should be removed", "gamification can distract from learning", "progress bars never help"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: can become a distraction", "clue": "can become a distraction", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Online learning platforms often use points, badges and progress bars to motivate users. These tools can be helpful when they show real progress, but they can also become a distraction. If a learner focuses only on earning points, they may choose easy exercises instead of working on weak areas. For exam preparation, the most useful progress system is one that identifies mistakes and recommends targeted practice.", "keyWord": null, "baseWord": null, "examPart": "Reading", "difficulty": "B2", "answerFormat": "CHOOSE_ONE", "microExplanation": "En este ejercicio de Reading B2, la respuesta 'gamification can distract from learning' se justifica por la pista del contexto: can become a distraction. Formato esperado: CHOOSE_ONE."}, {"id": "q0224", "module": "reading", "type": "mcq", "prompt": "What may learners do if they focus only on points?", "answer": ["choose easy exercises"], "options": ["study weak areas", "choose easy exercises", "write more essays", "stop practising"], "explanation": "Regla: Reading B2: busca evidencia, sinónimos y actitud Pista: choose easy exercises", "clue": "choose easy exercises", "trap": "No elijas solo porque repite palabras del texto.", "theory": "reading", "passage": "Online learning platforms often use points, badges and progress bars to motivate users. These tools can be helpful when they show real progress, but they can also become a distraction. If a learner focuses only on earning points, they may choo   if(q.type==='mcq') return {status:'incorrect',score:0,reason:'En test de opción múltiple no hay punto dudoso: una opción cambia la respuesta.'};
  const formConfusion=verbFormConfusion(q,val);
  if(formConfusion) return {status:'incorrect',score:0,reason:formConfusion};
  const checks=answers.map(a=>({a, d:levenshtein(val,a), ov:tokenOverlap(val,a), alen:looseNormalize(a).length, words:looseNormalize(a).split(' ').filter(Boolean).length}));
  const best=checks.sort((x,y)=> (x.d-y.d) || (y.ov-x.ov))[0];
  if(!best) return {status:'incorrect',score:0,reason:'No hay respuesta modelo registrada.'};
  const userWords=looseNormalize(val).split(' ').filter(Boolean);
  const modelWords=looseNormalize(best.a).split(' ').filter(Boolean);
  const diag=formatDiagnosis(q,val,best);

  if(kind==='transformation'){
    const kw=looseNormalize(q.keyWord||'');
    const includesKeyword=!kw || userWords.includes(kw);
    const endsWithCore=userWords.length && looseNormalize(best.a).endsWith(looseNormalize(val));
    if(includesKeyword && best.ov>=0.60) return {status:'partial',score:.5,reason:diag || 'Has usado parte importante de la transformación, pero falta una pieza o el orden no queda totalmente correcto.'};
    if(endsWithCore || best.ov>=0.34) return {status:'partial',score:.5,reason:diag || 'La intención gramatical se entiende, pero el formato de transformation exige la frase completa con la keyword.'};
    return {status:'incorrect',score:0,reason:diag || 'No conserva la estructura/significado que pedía la transformación.'};
  }

  if(kind==='open_cloze'){
    if(userWords.length>1 && userWords.includes(looseNormalize(best.a))) return {status:'partial',score:.5,reason:diag || 'La palabra clave está, pero open cloze pide una sola palabra.'};
    const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
    if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))) return {status:'partial',score:.5,reason:'Parece la palabra correcta con spelling leve. En examen puede costar el punto, pero sirve para detectar intención.'};
    return {status:'incorrect',score:0,reason:diag || 'No es la palabra gramatical que encaja en el hueco.'};
  }

  if(kind==='word_formation'){
    if(userWords.length>1 && userWords.includes(looseNormalize(best.a))) return {status:'partial',score:.5,reason:diag || 'La palabra derivada aparece, pero este formato pide una sola palabra.'};
    const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
    if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))) return {status:'partial',score:.5,reason:'La familia de palabra parece correcta, pero hay spelling o forma incompleta.'};
    return {status:'incorrect',score:0,reason:diag || 'No has formado la palabra que encaja gramaticalmente en la frase.'};
  }

  const userCount=userWords.length; const sameStart=looseNormalize(val)[0] && looseNormalize(val)[0]===looseNormalize(best.a)[0];
  if(best.words===1 && sameStart && ((best.alen<=7 && best.d===1) || (best.alen>7 && best.d<=2))){
    return {status:'partial',score:.5,reason:'Parece la palabra correcta con un fallo leve de spelling. En examen puede costar el punto, pero la intención gramatical va bien.'};
  }
  if(best.words>1 && best.ov>=0.75 && Math.abs(userCount-best.words)<=2){
    return {status:'partial',score:.5,reason:'La estructura principal está, pero falta o sobra una pieza gramatical. Merece revisión, no fallo total.'};
  }
  if(best.d<=2 && best.alen>=8){
    return {status:'partial',score:.5,reason:'Muy cerca de la respuesta modelo, probablemente error pequeño de forma.'};
  }
  return {status:'incorrect',score:0,reason:'No coincide con la estructura o palabra que pedía el hueco.'};
}
function answerStatus(a){ if(!a)return null; if(a.status)return a.status; return a.correct?'correct':'incorrect'; }
function answerScore(a){ if(!a)return 0; if(typeof a.score==='number')return a.score; return answerStatus(a)==='correct'?1:answerStatus(a)==='partial'?.5:0; }
function isCorrect(q, val){ return evaluateAnswer(q,val).status==='correct'; }
function moduleById(id){return MODULES.find(m=>m.id===id)}
function exerciseById(id){return EXERCISES.find(q=>q.id===id)}
function moduleExercises(id){return EXERCISES.filter(q=>q.module===id && !['writing','tracker'].includes(q.type))}
function completedCount(){return Object.keys(state.answers).length}
function correctCount(){return Object.values(state.answers).filter(a=>answerStatus(a)==='correct').length}
function partialCount(){return Object.values(state.answers).filter(a=>answerStatus(a)==='partial').length}
function weightedScoreCount(){return Object.values(state.answers).reduce((sum,a)=>sum+answerScore(a),0)}
function accuracy(){const c=completedCount(); return c?Math.round(weightedScoreCount()/c*100):0}
function todayISO(){return new Date().toISOString().slice(0,10)}
function markStudy(){ const today=todayISO(); if(state.lastStudyDate!==today){ const y=new Date(); y.setDate(y.getDate()-1); const yesterday=y.toISOString().slice(0,10); state.streak = state.lastStudyDate===yesterday ? (state.streak||0)+1 : 1; state.lastStudyDate=today; } }
function addXP(n){state.xp=(state.xp||0)+n; checkAchievements();}
function level(){return Math.floor((state.xp||0)/120)+1}
function levelProgress(){return (state.xp||0)%120}
function getModuleStats(id){ const qs=EXERCISES.filter(q=>q.module===id && !['writing','tracker'].includes(q.type)); const answered=qs.filter(q=>state.answers[q.id]); const corr=answered.filter(q=>answerStatus(state.answers[q.id])==='correct'); const partial=answered.filter(q=>answerStatus(state.answers[q.id])==='partial'); const weighted=answered.reduce((sum,q)=>sum+answerScore(state.answers[q.id]),0); return {total:qs.length, done:answered.length, correct:corr.length, partial:partial.length, weighted, acc:answered.length?Math.round(weighted/answered.length*100):0}; }
function mastery(id){ const s=getModuleStats(id); if(!s.done) return 0; const coverage=Math.min(1,s.done/Math.max(8,Math.min(s.total,14))); return Math.round(s.acc*coverage); }
function readiness(){ const ids=MODULES.filter(m=>m.priority>=8 && !['writing','listening','exam_strategy'].includes(m.id)).map(m=>m.id); const vals=ids.map(mastery); return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0; }
function nextModule(){ const candidates=MODULES.filter(m=>m.priority>=7 && !['listening','writing'].includes(m.id)); return candidates.sort((a,b)=> mastery(a.id)-mastery(b.id) || b.priority-a.priority)[0]; }
function weakModules(n=4){ return MODULES.filter(m=>m.priority>=7 && !['listening','writing'].includes(m.id)).sort((a,b)=> mastery(a.id)-mastery(b.id) || b.priority-a.priority).slice(0,n); }
function checkAchievements(){ const total=completedCount(); if(total>=10) state.achievements.first_steps=true; if(total>=100) state.achievements.hundred=true; if((state.examHistory||[]).some(e=>e.profile==='diagnostic')) state.achievements.diagnostic_done=true; if((state.examHistory||[]).some(e=>e.score>=75)) state.achievements.b2_ready=true; if((state.examHistory||[]).some(e=>e.profile==='use_of_english' && e.score>=70)) state.achievements.use_master=true; if((state.writing||[]).some(w=>w.words>=140 && w.words<=190)) state.achievements.writing_plan=true; }

function modulePhase(m){

  return 'Skills de examen';
}

function reviewInterval(a){ const st=answerStatus(a); if(st==='incorrect') return 1; if(st==='partial') return 2; return 5; }
function daysSince(date){ if(!date) return 999; const d=new Date(date); const now=new Date(); return Math.floor((now-d)/(1000*60*60*24)); }

function todayHTML(){ const plan=planProgressToday(); const due=reviewDueItems(); const nm=nextModule(); return `<div class="hero"><h2>Plan de hoy: 45-60 minutos</h2><p>No entres a mirar menús. Sigue estos bloques. Si tienes menos tiempo, haz solo los dos primeros.</p></div><div class="grid cols-4" style="margin-top:16px"><div class="card"><div class="muted small">Hecho hoy</div><div class="big-number">${plan.done}/${plan.goal}</div>${pctBar(plan.pct)}</div><div class="card"><div class="muted small">Repasos vencidos</div><div class="big-number">${due.filter(x=>x.due).length}</div><p class="muted">errores/dudas listas</p></div><div class="card"><div class="muted small">Siguiente módulo</div><h3>${nm?.title||'Simulacro'}</h3><p class="small muted">${nm?.goal||'Medir rendimiento real'}</p></div><div class="card"><div class="muted small">Coach</div><p>${coachText()}</p></div></div><div class="lesson-shell" style="margin-top:16px"><div class="lesson-rail"><div class="rail-item active"><b>Orden recomendado</b><p class="small muted">Calienta → repasa → módulo → mini examen.</p></div><div class="rail-item"><b>Regla anti-saturación</b><p class="small muted">Teoría solo cuando toca o cuando fallas.</p></div></div><div><div class="card"><h3>Bloque 1 · Calentamiento zona roja</h3><p class="muted">10 preguntas cortas de tus peores módulos. Sirve para activar el cerebro.</p><button class="btn" onclick="startDailyWarmup()">Empezar calentamiento</button></div><div class="card" style="margin-top:12px"><h3>Bloque 2 · Repaso espaciado</h3><p class="muted">Repite fallos/dudas cuando toca. Esto evita olvidar lo que ya corregiste.</p><button class="btn" onclick="startReviewSession()">Repasar ${due.filter(x=>x.due).length || ''}</button></div><div class="card" style="margin-top:12px"><h3>Bloque 3 · Lección del día</h3><p class="muted">Tema recomendado: <b>${nm?.title}</b>. Primero lee teoría corta si vas perdido; si no, entra a práctica.</p><div class="btn-row"><button class="btn ghost" onclick="showView('theory',{id:'${nm?.id}'})">Teoría</button><button class="btn" onclick="startModuleSession('${nm?.id}',12)">Practicar</button></div></div><div class="card" style="margin-top:12px"><h3>Bloque 4 · Mini examen</h3><p class="muted">15-20 preguntas sin mirar teoría para comprobar si se queda.</p><button class="btn secondary" onclick="startDailyMission()">Misión mixta</button></div></div></div>`; }
function reviewHTML(){ const items=reviewDueItems(); const due=items.filter(x=>x.due || answerStatus(x.a)!=='correct'); return `<div class="hero"><h2>Repaso SRS: errores y dudas</h2><p>Inspirado en repaso espaciado: no repites todo, repites lo que tu memoria está a punto de olvidar. Las ❔ son importantes: no son fracaso, son material de conversión a ✅.</p></div><div class="grid cols-3" style="margin-top:16px"><div class="card"><div class="muted small">Pendientes</div><div class="big-number">${due.length}</div><p class="muted">fallos/dudas para reentrenar.</p></div><div class="card"><div class="muted small">Dudas ❔</div><div class="big-number">${items.filter(x=>answerStatus(x.a)==='partial').length}</div><p class="muted">intención correcta, forma mejorable.</p></div><div class="card"><div class="muted small">Acción</div><button class="btn" onclick="startReviewSession()">Empezar repaso</button></div></div><div class="card" style="margin-top:16px"><h3>Cola de repaso</h3>${items.length?items.slice(0,30).map(x=>`<div class="card ${x.due?'review-due':'review-fresh'}" style="box-shadow:none;margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>${moduleById(x.q.module)?.title}</b><span class="pill ${answerStatus(x.a)==='partial'?'partial':'bad'}">${answerStatus(x.a)==='partial'?'❔ duda':'❌ fallo'}</span></div><p>${x.q.prompt}</p><p class="small muted">Tu respuesta: ${x.a.given||'—'} · Modelo: ${x.q.answer?.[0]||'—'} · hace ${x.age} días</p><div class="btn-row"><button class="btn ghost" onclick="showView('theory',{id:'${x.q.module}'})">Teoría</button><button class="btn secondary" onclick="startCustomSession(['${x.id}'],'Revisión de una pregunta')">Reintentar</button></div></div>`).join(''):'<div class="empty">Aún no hay fallos ni dudas. Haz diagnóstico primero.</div>'}</div>`; }
function examMapHTML(){ return `<div class="hero"><h2>Mapa de examen: formato profesional</h2><p>La mejora clave de v10 es que cada pregunta te dice exactamente qué tienes que escribir: una palabra, una palabra derivada, una opción o 2-5 palabras con keyword. Así evitamos fallos injustos como saber “was” pero no saber que el hueco pedía “said she was”.</p></div><div class="qa-banner"><b>Regla de oro:</b> primero identifica el formato. Después respondes. En B2, muchas respuestas se fallan no por gramática, sino por no respetar la consigna.</div><div class="grid cols-2" style="margin-top:16px"><div class="card exam-part"><h3>Reading & Use of English</h3><table class="exam-table exam-format-table"><tr><th>Parte</th><th>Qué escribes</th><th>La web ahora hace</th></tr><tr><td>Part 1 · Multiple-choice cloze</td><td>1 opción A/B/C/D</td><td>No permite ❔: es correcto/incorrecto</td></tr><tr><td>Part 2 · Open cloze</td><td>1 palabra</td><td>Avisa si escribes varias palabras</td></tr><tr><td>Part 3 · Word formation</td><td>1 palabra derivada</td><td>Comprueba familia de palabra y spelling leve</td></tr><tr><td>Part 4 · Transformations</td><td>2-5 palabras + keyword</td><td>Da ❔ si acertaste la intención pero faltó formato</td></tr><tr><td>Parts 5-7 · Reading</td><td>opción/evidencia</td><td>Entrena detalle, opinión y paraphrase</td></tr></table><button class="btn" style="margin-top:12px" onclick="startBlueprintExam()">Iniciar blueprint B2</button></div><div class="card exam-part"><h3>Criterio de corrección v10</h3><div class="rubric"><div><b>✅ Correcto</b><br><span class="small muted">respuesta aceptada</span></div><div><b>❔ Duda</b><br><span class="small muted">intención correcta, formato incompleto</span></div><div><b>❌ Fallo</b><br><span class="small muted">no encaja</span></div><div><b>Modo examen</b><br><span class="small muted">sin pistas</span></div></div><p class="muted">En Key Word Transformations puede haber puntuación parcial; en open cloze/word formation el formato es mucho más estricto. La web separa entrenamiento de realidad de examen.</p><button class="btn secondary" style="margin-top:12px" onclick="showView('settings')">Ver criterio</button></div></div><div class="card" style="margin-top:16px"><h3>Ejemplos corregidos</h3><table class="exam-table"><tr><th>Pregunta</th><th>Respuesta incompleta</th><th>Cómo la trata v10</th></tr><tr><td>SAID → She ___ tired.</td><td>was</td><td>❔ porque viste el cambio, pero faltó “said she”.</td></tr><tr><td>It was ___ an interesting lesson...</td><td>such an</td><td>❔ porque la palabra clave está, pero open cloze pide una sola palabra.</td></tr><tr><td>FORGET → an ___ experience</td><td>unforgetable</td><td>❔ spelling leve; estudiar spelling.</td></tr></table></div>`; }

function diagnosticHTML(){ return `<div class="hero"><h2>Diagnóstico B2</h2><p>Primero medimos. Luego estudiamos. Este test mezcla gramática, Use of English y reading para detectar tus módulos débiles.</p></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Diagnóstico completo</h3><p class="muted">40 preguntas · 35 min · informe por módulos.</p><button class="btn" onclick="startExam('diagnostic')">Empezar</button></div><div class="card"><h3>Regla</h3><p class="muted">No mires teoría durante el diagnóstico. Si fallas, luego la web te manda a lo que toca.</p><button class="btn secondary" onclick="showView('progress')">Ver historial</button></div></div>`; }
function practiceHTML(){ const groups=[...new Set(MODULES.map(m=>m.group))]; return `<div class="card"><h3>Practicar por módulos</h3><p class="muted">Ideal después del diagnóstico. Elige un tema o deja que la web elija tus fallos.</p><div class="btn-row"><button class="btn" onclick="startSmartSession()">Sesión inteligente</button><button class="btn secondary" onclick="startMistakeSession()">Practicar fallos</button></div></div>${groups.map(g=>`<h3 style="margin-top:22px">${g}</h3><div class="grid cols-3">${MODULES.filter(m=>m.group===g).map(m=>`<div class="card"><h3>${m.title}</h3><p class="muted small">${m.goal}</p>${pctBar(mastery(m.id))}<p class="small muted">${mastery(m.id)}% dominio · ${moduleExercises(m.id).length} ejercicios</p><div class="btn-row"><button class="btn" onclick="startModuleSession('${m.id}',10)">Practicar</button><button class="btn ghost" onclick="showView('theory',{id:'${m.id}'})">Teoría</button></div></div>`).join('')}</div>`).join('')}`; }
function examHTML(){ return `<div class="hero"><h2>Simulador de exámenes</h2><p>Modo examen: temporizador, sin pistas por defecto, corrección final e informe de fallos. La v10 añade contratos de respuesta, pistas no reveladoras y corrección parcial más académica por partes para que se parezca más a una prueba B2 escrita.</p></div><div class="grid cols-2" style="margin-top:16px"><div class="card" style="border-color:#2563eb"><h3>Blueprint B2 escrito recomendado</h3><p class="muted">52 preguntas · 75 min · proporción tipo Reading & Use of English: cloze, open cloze, word formation, transformations y reading.</p><button class="btn" onclick="startBlueprintExam()">Iniciar blueprint</button> <button class="btn ghost" onclick="showView('examMap')">Ver mapa</button></div>${EXAM_PROFILES.map(p=>`<div class="card"><h3>${p.title}</h3><p class="muted">${p.description}</p><p><span class="pill">${p.minutes} min</span> <span class="pill">${p.count} preguntas</span></p><button class="btn" onclick="startExam('${p.id}')">Iniciar simulacro</button></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Formato que imitamos</h3><table class="exam-table"><tr><th>Parte</th><th>Qué entrena</th><th>En la web</th></tr><tr><td>Multiple-choice cloze</td><td>vocabulario, collocations, linkers</td><td>MCQ contextual</td></tr><tr><td>Open cloze</td><td>gramática funcional</td><td>huecos sin opciones</td></tr><tr><td>Word formation</td><td>familias de palabras</td><td>base word → respuesta</td></tr><tr><td>Transformations</td><td>reescritura B2</td><td>keyword obligatoria</td></tr><tr><td>Reading</td><td>detalle, actitud, paraphrase</td><td>textos cortos + evidencias</td></tr><tr><td>Writing</td><td>organización y rango</td><td>plantillas + checklist</td></tr></table></div>`; }
function theoryHTML(id){ const list=MODULES; const m=id?moduleById(id):list[0]; const ret=state.session && !state.session.completed ? `<div class="sticky-return"><div><b>Estás consultando teoría durante un test.</b><div class="small muted">No te pierdes: puedes volver exactamente a la pregunta ${state.session.index+1}.</div></div><button class="btn warn" onclick="state.achievements.comeback=true; save(); showView('session')">Volver al test activo</button></div>`:''; return `${ret}<div class="grid cols-4"><div class="card" style="grid-column:span 1"><h3>Teoría</h3>${list.map(x=>`<button class="nav-btn ${x.id===m.id?'active':''}" style="color:#0f172a;background:${x.id===m.id?'#dbeafe':'transparent'}" onclick="showView('theory',{id:'${x.id}'})">${x.title}</button>`).join('')}</div><div style="grid-column:span 3">${theoryBlock(m)}</div></div>`; }

function safeText(s){return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function splitForms(s){return String(s||'').split('/').map(x=>looseNormalize(x.trim())).filter(Boolean)}

/* v12: contained interactive wiki. Hover on highlighted terms in exercises; tap on mobile. */
const WIKI_BASE_TERMS = {
  'present simple':{cat:'Tense',explain:'Tiempo para rutinas, hábitos y verdades generales. No significa “ahora mismo”.',example:'I usually study at night.',trap:'No uses -ing si hablas de rutina.'},
  'present continuous':{cat:'Tense',explain:'am/is/are + -ing. Sirve para acciones de ahora o situaciones temporales.',example:'I am studying this week.',trap:'No lo uses con know, believe, like en uso normal.'},
  'past simple':{cat:'Tense',explain:'Pasado terminado y localizado. Suele ir con yesterday, last year, ago, in 2020.',example:'I saw him yesterday.',trap:'Después de did va infinitivo: Did you see?, no Did you saw?'},
  'past continuous':{cat:'Tense',explain:'was/were + -ing. Acción en progreso en el pasado; suele pintar el fondo.',example:'I was walking when it started to rain.',trap:'No lo uses para acciones puntuales cerradas.'},
  'present perfect':{cat:'Tense',explain:'have/has + participio. Pasado conectado con el presente.',example:'I have seen that film.',trap:'No lo juntes con yesterday/last year si el tiempo está cerrado.'},
  'present perfect continuous':{cat:'Tense',explain:'have/has been + -ing. Importa la duración o actividad hasta ahora.',example:'I have been studying all morning.',trap:'No suele usarse con know/own/believe.'},
  'past perfect':{cat:'Tense',explain:'had + participio. Marca lo que ocurrió antes de otro momento pasado.',example:'When I arrived, she had left.',trap:'No lo uses si solo hay una acción pasada normal.'},
  'past participle':{cat:'Verb form',explain:'Tercera columna del verbo irregular. Va después de have/has/had y en pasiva.',example:'write → wrote → written; I have written it.',trap:'No confundas spoke/wrote/began con spoken/written/begun.'},
  'participle':{cat:'Verb form',explain:'Forma usada con perfect y passive. En irregulares suele ser la tercera columna.',example:'taken, written, spoken, begun.',trap:'No siempre coincide con el past simple.'},
  'infinitive':{cat:'Verb form',explain:'Forma base del verbo: go, see, write. Aparece después de did y después de to.',example:'Did you go? / I want to go.',trap:'No pongas went después de did.'},
  'gerund':{cat:'Verb pattern',explain:'Verbo en -ing usado como nombre o después de ciertos verbos/preposiciones.',example:'I enjoy studying. / I am interested in learning.',trap:'Después de preposición suele ir -ing.'},
  'since':{cat:'Time marker',explain:'Desde un momento concreto. Suele pedir present perfect si conecta con ahora.',example:'I have lived here since 2020.',trap:'No digas I live here since 2020 en B2 escrito.'},
  'for':{cat:'Time marker',explain:'Durante una cantidad de tiempo. Con perfect indica duración hasta ahora.',example:'I have known him for years.',trap:'for + periodo; since + punto de inicio.'},
  'already':{cat:'Adverb',explain:'Ya. Suele aparecer con perfect y acciones completadas antes de lo esperado.',example:'She has already left.',trap:'Ojo con la posición: has already left.'},
  'yet':{cat:'Adverb',explain:'Todavía/ya en negativas y preguntas. Muy típico con present perfect.',example:'I haven’t finished yet. / Have you finished yet?',trap:'No suele ir en afirmativa normal.'},
  'ever':{cat:'Adverb',explain:'Alguna vez. Pregunta experiencia hasta ahora.',example:'Have you ever been to Ireland?',trap:'No lo traduzcas literalmente palabra por palabra.'},
  'never':{cat:'Adverb',explain:'Nunca. Con present perfect habla de experiencia hasta ahora.',example:'I have never flown before.',trap:'No uses doble negación: I haven’t never.'},
  'just':{cat:'Adverb',explain:'Acabar de. Muy frecuente con present perfect para acciones recientes.',example:'I have just arrived.',trap:'No confundir con only.'},
  'recently':{cat:'Adverb',explain:'Recientemente. Suele conectar pasado con presente.',example:'I have recently started a course.',trap:'No siempre exige perfect, pero es una pista fuerte.'},
  'yesterday':{cat:'Time marker',explain:'Ayer: tiempo terminado. Normalmente Past Simple.',example:'I saw him yesterday.',trap:'No digas I have seen him yesterday.'},
  'ago':{cat:'Time marker',explain:'Hace X tiempo. Cierra el pasado: usa Past Simple.',example:'I met her two years ago.',trap:'No va con present perfect.'},
  'last year':{cat:'Time marker',explain:'Año pasado: periodo cerrado. Normalmente Past Simple.',example:'I travelled last year.',trap:'No lo mezcles con have/has.'},
  'when':{cat:'Connector',explain:'Puede introducir momento pasado concreto o acción que interrumpe.',example:'I was studying when he called.',trap:'Si preguntas “when?”, muchas veces pide Past Simple.'},
  'while':{cat:'Connector',explain:'Mientras. Suele acompañar una acción larga en Past Continuous.',example:'While I was walking, it started to rain.',trap:'No uses while para el golpe corto.'},
  'by the time':{cat:'Time linker',explain:'Para cuando. Suele activar Past Perfect para lo que ya había ocurrido.',example:'By the time I arrived, she had left.',trap:'La acción anterior va con had + participle.'},
  'before':{cat:'Time linker',explain:'Antes de. Puede indicar qué acción ocurrió primero.',example:'She had left before I arrived.',trap:'No siempre exige past perfect, pero en B2 suele ser pista.'},
  'after':{cat:'Time linker',explain:'Después de. Ayuda a ordenar dos acciones pasadas.',example:'After I had finished, I went home.',trap:'No pierdas la línea temporal.'},
  'will':{cat:'Future',explain:'Futuro para decisiones espontáneas, predicciones u ofrecimientos.',example:'I’ll help you.',trap:'No uses will para planes ya cerrados si encaja going to/present continuous.'},
  'going to':{cat:'Future',explain:'Plan/intención o predicción con evidencia.',example:'I’m going to study tonight.',trap:'No lo confundas con present continuous para cita cerrada.'},
  'conditionals':{cat:'Grammar',explain:'Frases con if. Tipo 1 real futuro; tipo 2 hipotético; tipo 3 pasado imposible.',example:'If I had studied, I would have passed.',trap:'No pongas would en la parte de if en los condicionales básicos.'},
  'passive':{cat:'Grammar',explain:'be + participio. Importa la acción, no quién la hace.',example:'The report was written yesterday.',trap:'No uses past simple en vez de participio: was wrote ✗.'},
  'reported speech':{cat:'Grammar',explain:'Contar lo que alguien dijo. Suele cambiar el tiempo verbal hacia atrás.',example:'“I am tired” → She said she was tired.',trap:'No cambies el sujeto sin sentido; conserva el significado.'},
  'modal':{cat:'Grammar',explain:'Verbos como must, should, might, can. Van con infinitivo sin to.',example:'You should study. / He might be right.',trap:'No pongas to después de should/must/can.'},
  'must':{cat:'Modal',explain:'Obligación fuerte o deducción muy segura.',example:'You must wear a seatbelt. / He must be tired.',trap:'mustn’t = prohibición, no “no tener que”.'},
  'should':{cat:'Modal',explain:'Consejo o recomendación.',example:'You should revise irregular verbs.',trap:'No digas should to revise.'},
  'might':{cat:'Modal',explain:'Posibilidad no segura.',example:'It might rain later.',trap:'No lo uses si estás 100% seguro.'},
  'although':{cat:'Linker',explain:'Aunque. Une contraste y lleva sujeto + verbo.',example:'Although it was raining, we went out.',trap:'Although + clause; despite + noun/-ing.'},
  'despite':{cat:'Linker',explain:'A pesar de. Va con noun, pronoun o -ing.',example:'Despite being tired, I studied.',trap:'No digas despite it was raining.'},
  'however':{cat:'Linker',explain:'Sin embargo. Conecta ideas/frases, suele ir con coma.',example:'I was tired. However, I kept studying.',trap:'No lo uses como although dentro de la misma estructura.'},
  'because of':{cat:'Linker',explain:'Debido a. Va con noun/-ing, no con frase completa sujeto+verbo.',example:'Because of the rain, we stayed home.',trap:'because + clause; because of + noun.'},
  'so':{cat:'Quantifier / linker',explain:'Puede intensificar adjetivo/adverbio: so tired, so quickly.',example:'It was so difficult that I needed help.',trap:'so + adjective; such + noun phrase.'},
  'such':{cat:'Quantifier',explain:'Intensifica un grupo nominal: such a good idea, such an interesting lesson.',example:'It was such an interesting lesson.',trap:'such + noun phrase; so + adjective/adverb.'},
  'article':{cat:'Grammar',explain:'a/an/the o artículo cero. En B2 sale mucho en open cloze.',example:'I went to the cinema. / I am a student.',trap:'No traduzcas siempre “el/la” como the.'},
  'quantifier':{cat:'Grammar',explain:'much, many, few, little, a lot of. Depende de contable/incontable.',example:'many people / much time / few mistakes.',trap:'People es plural contable: many people.'},
  'collocation':{cat:'Vocabulary',explain:'Combinación fija de palabras. No siempre se traduce literal.',example:'make a mistake, take notes, depend on.',trap:'No digas do a mistake.'},
  'preposition':{cat:'Grammar',explain:'Palabra pequeña fija: in, on, at, for, to, about. Muchas se aprenden por bloque.',example:'interested in, depend on, responsible for.',trap:'En inglés no siempre coincide con el español.'},
  'interested in':{cat:'Collocation',explain:'Se dice interested in + noun/-ing.',example:'I am interested in learning English.',trap:'No interested on.'},
  'depend on':{cat:'Collocation',explain:'Depender de = depend on.',example:'It depends on the weather.',trap:'No depend of.'},
  'responsible for':{cat:'Collocation',explain:'Responsable de = responsible for.',example:'She is responsible for the project.',trap:'No responsible of.'},
  'make':{cat:'Collocation',explain:'make se usa con mistake, decision, progress, effort.',example:'make a mistake / make progress.',trap:'No todo “hacer” es do.'},
  'take notes':{cat:'Collocation',explain:'Tomar apuntes = take notes.',example:'I took notes during the lesson.',trap:'No write notes si quieres decir tomar apuntes en clase.'},
  'word formation':{cat:'Exam part',explain:'Cambiar la familia de una palabra: noun, adjective, adverb, negative.',example:'success → successful → successfully.',trap:'Mira si el hueco pide adjetivo, nombre o adverbio.'},
  'open cloze':{cat:'Exam part',explain:'Hueco sin opciones. Suele pedir palabras pequeñas: preposición, auxiliar, artículo, pronombre, linker.',example:'I am interested ___ learning → in.',trap:'No inventes palabras largas.'},
  'transformation':{cat:'Exam part',explain:'Reescribir manteniendo significado y usando una keyword obligatoria.',example:'I last saw him in 2020 → I haven’t seen him since 2020.',trap:'No cambies la keyword.'},
  'reading':{cat:'Exam part',explain:'Comprensión: localiza evidencia en el texto y evita responder por impresión general.',example:'Busca sinónimos, no solo palabras idénticas.',trap:'Cuidado con opciones medio verdaderas pero no exactas.'},
  'writing':{cat:'Exam part',explain:'Texto organizado: responde todo, usa párrafos y conectores, revisa errores básicos.',example:'Essay: introducción, idea 1, idea 2/contraste, conclusión.',trap:'No escribas frases sueltas sin estructura.'}
};

function buildWikiTerms(){
  const terms={...WIKI_BASE_TERMS};
  IRREGULAR_BANK.forEach(v=>{
    const forms=[v.base,...splitForms(v.past),...splitForms(v.participle)].filter(Boolean);
    forms.forEach(f=>{
      if(!f || f.length<2) return;
      const role = looseNormalize(f)===looseNormalize(v.base)?'base form':(splitForms(v.past).includes(looseNormalize(f))?'past simple':'past participle');
      terms[looseNormalize(f)]={cat:'Irregular verb',explain:`${v.base} significa “${v.meaning}”. Tabla: ${v.base} → ${v.past} → ${v.participle}. Esta forma es ${role}.`,example:`Past: ${v.examplePast} / Perfect: ${v.examplePerfect}`,trap:v.note,verb:v.base};
    });
  });
  return terms;
}
const WIKI_TERMS = buildWikiTerms();
const WIKI_KEYS = Object.keys(WIKI_TERMS).filter(k=>k && k.length>=2).sort((a,b)=>b.length-a.length);
let wikiHideTimer=null;
function isWikiBoundary(text,start,len){
  const before=text[start-1]||''; const after=text[start+len]||'';
  return !/[A-Za-z0-9']/u.test(before) && !/[A-Za-z0-9']/u.test(after);
}
function wikiText(text, opts={}){
  const raw=String(text ?? '');
  if(!raw) return '';
  const max=opts.max ?? 10;
  const lower=raw.toLowerCase();
  let out='', i=0, hits=0;
  while(i<raw.length){
    let match=null;
    if(hits<max){
      for(const key of WIKI_KEYS){
        if(key.length<2) continue;
        if(lower.slice(i,i+key.length)===key && isWikiBoundary(raw,i,key.length)) { match=key; break; }
      }
    }
    if(match){
      const shown=raw.slice(i,i+match.length);
      out += `<span class="wiki-term" tabindex="0" data-term="${escapeAttr(match)}" onmouseenter="showWikiTerm(event,'${escapeAttr(match)}')" onmouseleave="scheduleWikiHide()" onfocus="showWikiTerm(event,'${escapeAttr(match)}')" onclick="showWikiTerm(event,'${escapeAttr(match)}'); event.stopPropagation();">${safeText(shown)}</span>`;
      i += match.length; hits++;
    }else{
      out += safeText(raw[i]); i++;
    }
  }
  return out;
}
function wikiInfoHTML(term){
  const t=WIKI_TERMS[looseNormalize(term)];
  if(!t) return `<p>No tengo ficha para este término todavía.</p>`;
  const theoryBtn = t.verb ? `<button class="btn ghost" onclick="openIrregularVerb('${escapeAttr(t.verb)}')">Ficha del verbo</button>` : `<button class="btn ghost" onclick="closeWikiPopover();showView('theory',{id:'${suggestTheoryForWiki(term)}'})">Ver teoría relacionada</button>`;
  return `<button class="close-x" onclick="closeWikiPopover()">×</button><span class="wiki-label">${safeText(t.cat||'Wiki')}</span><h4>${safeText(term)}</h4><p>${safeText(t.explain||'Concepto de examen.')}</p>${t.example?`<div class="wiki-example"><b>Ejemplo:</b><br>${safeText(t.example)}</div>`:''}${t.trap?`<p class="small"><b>Trampa:</b> ${safeText(t.trap)}</p>`:''}<div class="wiki-actions">${theoryBtn}<button class="btn secondary" onclick="closeWikiPopover()">Seguir ejercicio</button></div>`;
}
function suggestTheoryForWiki(term){
  const k=looseNormalize(term);
  if(k.includes('perfect')||k.includes('participle')||['since','for','already','yet','ever','never','just','recently'].includes(k)) return 'present_perfect_past_simple';
  if(k.includes('past simple')||['yesterday','ago','last year','when','while'].includes(k)) return 'past_simple_continuous';
  if(k.includes('past perfect')||['by the time','before','after'].includes(k)) return 'past_perfect';
  if(k.includes('reported')) return 'reported_speech';
  if(k.includes('passive')) return 'passive_voice';
  if(k.includes('conditional')) return 'conditionals';
  if(['although','despite','however','because of','so','such'].includes(k)) return 'linkers';
  if(k.includes('preposition')||['interested in','depend on','responsible for'].includes(k)) return 'prepositions_collocations';
  if(k.includes('word formation')) return 'word_formation';
  if(k.includes('open cloze')) return 'open_cloze';
  if(k.includes('transformation')) return 'key_word_transformations';
  if(k.includes('writing')) return 'writing_b2';
  if(k.includes('reading')) return 'reading_b2';
  return 'exam_strategy';
}
function ensureWikiPopover(){
  let el=document.getElementById('wikiPopover');

function irregularVerbBankHTML(){ return `<div class="card flat" style="margin-top:14px"><h3>Banco de verbos irregulares frecuentes B2</h3><p class="muted">No tienes que aprenderlos todos hoy. Prioridad: saber distinguir <b>past simple</b> de <b>past participle</b>. Usa el filtro y abre fichas.</p><div class="verb-bank-toolbar"><input id="verbFilter" class="verb-bank-input" placeholder="Filtra: begin, written, go, participio..." oninput="filterIrregularBank()"><span class="pill">${IRREGULAR_BANK.length} verbos</span><button class="btn ghost" onclick="startModuleSession('irregular_participles',20)">Practicar irregulares</button></div><div style="overflow:auto"><table class="verb-bank"><thead><tr><th>Verb</th><th>Past simple</th><th>Past participle</th><th>Ejemplo perfect</th><th>Nota</th><th></th></tr></thead><tbody id="verbBankRows">${irregularRows(IRREGULAR_BANK)}</tbody></table></div></div>`; }

function filterIrregularBank(){ const q=looseNormalize($('verbFilter')?.value||''); const rows=[...document.querySelectorAll('#verbBankRows tr')]; rows.forEach(r=>{r.style.display=!q || looseNormalize(r.dataset.search||'').includes(q)?'':'none'}); }

function verbFormConfusion(q,val){ if(q.module!=='irregular_participles' || !q.targetVerb) return null; const v=irregularEntry(q.targetVerb); if(!v) return null; const n=looseNormalize(val); const pasts=splitForms(v.past); const parts=splitForms(v.participle); if(q.targetForm==='past_participle' && pasts.includes(n) && !parts.includes(n)){ return `Has escrito past simple (${v.past}), pero la estructura pide past participle (${v.participle}). Mira: ${v.base} → ${v.past} → ${v.participle}.`; } if(q.targetForm==='past_simple' && parts.includes(n) && !pasts.includes(n)){ return `Has escrito past participle (${v.participle}), pero el contexto pide past simple (${v.past}). Mira: ${v.base} → ${v.past} → ${v.participle}.`; } return null; }
