<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erasmus B2 Trainer · Ruta guiada v5</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--ink:#111827;--muted:#667085;--soft:#98a2b3;--line:#d8e1ef;
  --brand:#1d4ed8;--brandDark:#143a9d;--brand2:#eaf1ff;--ok:#087443;--okbg:#e7f8ef;--bad:#b42318;--badbg:#fff0ef;
  --warn:#a15c00;--warnbg:#fff6df;--violet:#6941c6;--violetbg:#f4f0ff;--shadow:0 12px 34px rgba(16,24,40,.08);
  --side:300px;--top:64px;--radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;transition:.12s ease}
button:hover{transform:translateY(-1px);border-color:#9ca3af}
button.primary{background:var(--brand);border-color:var(--brand);color:white}
button.primary:hover{background:var(--brandDark)}
button.good{background:var(--ok);border-color:var(--ok);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:170px;line-height:1.55}
a{color:var(--brand);text-decoration:none}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#0f172a;color:#dbeafe;padding:18px 14px;overflow:auto}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding:10px}
.logoMark{width:44px;height:44px;border-radius:14px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 24px rgba(37,99,235,.35)}
.logo b{display:block;color:white;font-size:16px}.logo span{font-size:12px;color:#b6c7e6}
.navGroup{margin:16px 0 8px;color:#7dd3fc;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:0 10px}
.navBtn{width:100%;display:flex;align-items:center;gap:10px;margin:5px 0;padding:10px 11px;border-radius:12px;background:transparent;border:0;color:#dbeafe;text-align:left}
.navBtn:hover,.navBtn.active{background:rgba(255,255,255,.09);transform:none}
.navBtn .navIcon{width:22px;text-align:center}.navBtn small{margin-left:auto;color:#9db3d8}
.sideCard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:12px;margin-top:16px}
.sideCard .mini{color:#b6c7e6;font-size:12px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb b{color:var(--ink)}
.topStats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:#bdebd2}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:#ffe1a3}.pill.violet{background:var(--violetbg);color:var(--violet);border-color:#ddceff}
.content{padding:22px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card.flat{box-shadow:none}.card.soft{background:var(--panel2)}
.hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;border:0;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:0 0 8px;font-size:32px;line-height:1.1}.hero p{color:#dbeafe;max-width:760px}
.hRow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1,h2,h3{margin-top:0} h2{font-size:24px} h3{font-size:18px} p{line-height:1.55}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.progress{height:10px;background:#e7edf7;border-radius:999px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:999px;width:0%}
.bar.ok{background:linear-gradient(90deg,#087443,#12b76a)}.bar.warn{background:linear-gradient(90deg,#f59e0b,#f97316)}.bar.bad{background:linear-gradient(90deg,#ef4444,#b42318)}
.statBig{font-size:32px;font-weight:900;letter-spacing:-.04em}
.roadmap{position:relative;padding-left:18px}
.roadmap:before{content:"";position:absolute;left:22px;top:12px;bottom:12px;width:4px;background:#dbeafe;border-radius:999px}
.module{position:relative;margin:0 0 14px 20px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;box-shadow:var(--shadow)}
.module:before{content:"";position:absolute;left:-32px;top:22px;width:18px;height:18px;border-radius:50%;background:#93c5fd;border:4px solid #eff6ff}
.module.done:before{background:#12b76a}.module.current:before{background:#1d4ed8}
.lessonList{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.lesson{border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:12px;cursor:pointer}
.lesson:hover{border-color:#93c5fd;background:#eff6ff}.lesson.done{background:var(--okbg);border-color:#bdebd2}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.topicChip{display:inline-flex;gap:6px;align-items:center;background:#f8fafc;border:1px solid var(--line);padding:7px 10px;border-radius:999px;margin:4px;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.active{background:var(--brand);color:white;border-color:var(--brand)}
.sessionBar{position:sticky;top:var(--top);z-index:10;margin:-22px -22px 18px;background:#fff7ed;border-bottom:1px solid #fed7aa;padding:11px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 18px rgba(16,24,40,.06)}
.questionBox{border:1px solid var(--line);border-radius:20px;background:#fff;padding:20px;box-shadow:var(--shadow)}
.questionMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.option{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.option:hover{background:#eff6ff;border-color:#93c5fd}
.option.selected{border-color:#1d4ed8;background:#eaf1ff}
.option.correct{background:var(--okbg);border-color:#12b76a}
.option.wrong{background:var(--badbg);border-color:#fda29b}
.feedback{margin-top:14px;border-radius:16px;padding:14px;border:1px solid var(--line)}
.feedback.ok{background:var(--okbg);border-color:#bdebd2}.feedback.bad{background:var(--badbg);border-color:#fda29b}
.explainGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.explain{background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px}
.theoryBlock{border-left:4px solid #2563eb;background:#f8fbff;border-radius:0 16px 16px 0;padding:14px;margin:12px 0}
.examplePair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.badEx,.goodEx{padding:10px;border-radius:12px;border:1px solid}
.badEx{background:var(--badbg);border-color:#fda29b}.goodEx{background:var(--okbg);border-color:#bdebd2}
.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.table td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px}.table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.badgeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.badge{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;opacity:.55}.badge.unlocked{opacity:1;background:linear-gradient(180deg,#fff,#f8fbff);border-color:#93c5fd}.badge .emoji{font-size:30px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;padding:2px 5px}
.alert{border-radius:16px;padding:13px 14px;border:1px solid var(--line);background:#fff}.alert.warn{background:var(--warnbg);border-color:#fed7aa}.alert.info{background:var(--brand2);border-color:#bfdbfe}
.mobileMenu{display:none}
@media(max-width:920px){
  .app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:50;width:300px}.sidebar.open{display:block}.mobileMenu{display:inline-flex}
  .content{padding:14px}.topbar{padding:0 12px}.g2,.g3,.g4{grid-template-columns:1fr}.explainGrid,.examplePair{grid-template-columns:1fr}.hero h1{font-size:26px}.sessionBar{margin:-14px -14px 14px;padding:10px 14px;top:var(--top)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <button class="mobileMenu" onclick="toggleSide()">☰</button>
      <div class="breadcrumb" id="breadcrumb">Ruta B2</div>
      <div class="topStats" id="topStats"></div>
    </div>
    <div id="sessionBar"></div>
    <section class="content" id="app"></section>
  </main>
</div>
<script>
const DATA = {"topics": [{"id": "pp-vs-past", "name": "Present Perfect vs Past Simple", "short": "Perfect vs Past", "exam": "Grammar control / Open cloze", "weight": 10, "unit": "Bloque 1", "icon": "⏱️", "why": "El fallo que más te estaba bloqueando: participio + marcador de tiempo."}, {"id": "irregulars", "name": "Irregular verbs & participles", "short": "Irregulares", "exam": "Use of English", "weight": 10, "unit": "Bloque 1", "icon": "🧱", "why": "Sin participios no hay Present Perfect ni Past Perfect."}, {"id": "past-perfect", "name": "Past Perfect", "short": "Past Perfect", "exam": "Narrative grammar / transformations", "weight": 8, "unit": "Bloque 1", "icon": "⏮️", "why": "Sirve para ordenar dos acciones pasadas: antes de otra acción pasada."}, {"id": "open-cloze", "name": "Open cloze", "short": "Open cloze", "exam": "B2 Reading & Use Part 2", "weight": 10, "unit": "Bloque 2", "icon": "🕳️", "why": "Huecos sin opciones: preposiciones, auxiliares, pronombres, conectores."}, {"id": "word-formation", "name": "Word formation", "short": "Word formation", "exam": "B2 Reading & Use Part 3", "weight": 9, "unit": "Bloque 2", "icon": "🔧", "why": "Cambiar success→successful, decide→decision, etc. Da puntos rápidos."}, {"id": "transformations", "name": "Key word transformations", "short": "Transformations", "exam": "B2 Reading & Use Part 4", "weight": 10, "unit": "Bloque 2", "icon": "🔁", "why": "Reescribir sin cambiar significado: muy de examen B2."}, {"id": "prepositions", "name": "Prepositions & collocations", "short": "Prepositions", "exam": "Cloze / multiple-choice cloze", "weight": 8, "unit": "Bloque 2", "icon": "📌", "why": "interested in, depend on, good at: se aprenden por bloque."}, {"id": "gerunds-infinitives", "name": "Verb patterns: -ing / to", "short": "-ing / to", "exam": "Grammar & transformations", "weight": 7, "unit": "Bloque 2", "icon": "🧩", "why": "enjoy doing, want to do, avoid doing: típico y rentable."}, {"id": "linkers", "name": "Linkers & sentence logic", "short": "Linkers", "exam": "Writing / cloze / transformations", "weight": 7, "unit": "Bloque 3", "icon": "🔗", "why": "although, despite, however, because of: sube writing y cloze."}, {"id": "reading", "name": "Reading strategy", "short": "Reading", "exam": "B2 Reading Parts 5-7", "weight": 8, "unit": "Bloque 3", "icon": "📖", "why": "No leer por leer: localizar opinión, detalle y función."}, {"id": "writing", "name": "Writing B2 templates", "short": "Writing", "exam": "B2 Writing", "weight": 10, "unit": "Bloque 3", "icon": "✍️", "why": "140–190 palabras con estructura segura, conectores y pocos errores graves."}, {"id": "listening", "name": "Listening tracker", "short": "Listening", "exam": "Listening", "weight": 5, "unit": "Bloque 3", "icon": "🎧", "why": "Lo trabajas por tu cuenta, pero conviene registrar minutos y dificultad."}], "theory": {"pp-vs-past": {"title": "Present Perfect vs Past Simple: decide con el marcador de tiempo", "objective": "Saber elegir entre I have eaten y I ate sin entrar en pánico.", "formula": ["Present Perfect = have/has + participio: I have seen, she has eaten.", "Past Simple = verbo pasado: I saw, she ate."], "triggers": ["Present Perfect: since, for, already, yet, ever, never, recently, so far, this week cuando la semana sigue viva.", "Past Simple: yesterday, last night, ago, in 2020, when I was..., last year, at 8 pm."], "examples": [["I lived here since 2020.", "I have lived here since 2020.", "since + punto de inicio conecta pasado con presente."], ["I have seen him yesterday.", "I saw him yesterday.", "yesterday cierra el tiempo: Past Simple."], ["She has already finished.", "She has already finished.", "already empuja a Present Perfect si no hay fecha cerrada."]], "examMove": "Subraya primero la palabra de tiempo. Si es tiempo cerrado, Past Simple. Si conecta con ahora, Present Perfect.", "trap": "No traduzcas literalmente desde español. 'He visto ayer' en inglés no funciona: yesterday obliga a Past Simple."}, "irregulars": {"title": "Irregular verbs: aprende los participios que desbloquean B2", "objective": "Diferenciar past simple y past participle: spoke vs spoken, took vs taken.", "formula": ["Past Simple: I spoke, I took, I wrote.", "Past Participle: I have spoken, I have taken, I have written."], "triggers": ["Después de have/has/had necesitas participio.", "Después de did no uses pasado: Did you go? no Did you went?"], "examples": [["I have spoke English.", "I have spoken English.", "have + participio."], ["Did you went?", "Did you go?", "did ya marca pasado; el verbo vuelve a base."], ["She has wrote it.", "She has written it.", "write → wrote → written."]], "examMove": "Si ves have/has/had, busca la tercera columna mental: gone, eaten, seen, written, spoken, taken, known, given, done, broken.", "trap": "No confundas brake con break. El participio de break es broken."}, "past-perfect": {"title": "Past Perfect: el pasado anterior a otro pasado", "objective": "Usar had + participio para la acción que ocurrió primero.", "formula": ["Past Perfect = had + participio: had eaten, had gone, had finished.", "Normalmente aparece junto a otra acción en Past Simple."], "triggers": ["by the time, before, after, when + dos acciones pasadas, already + pasado.", "Pregunta clave: ¿qué pasó primero? Esa acción suele ir en Past Perfect."], "examples": [["When I arrived, she left.", "When I arrived, she had left.", "ella se fue antes de que yo llegara."], ["I didn't watch the film because I saw it before.", "I didn't watch the film because I had seen it before.", "verla fue anterior a no verla."], ["After he had finished, he went home.", "After he had finished, he went home.", "after marca orden de acciones."]], "examMove": "Dibuja mentalmente dos puntos: acción 1 más antigua = Past Perfect; acción 2 = Past Simple.", "trap": "No uses Past Perfect para todo lo pasado. Solo si necesitas dejar claro que algo pasó antes que otra cosa."}, "open-cloze": {"title": "Open cloze: huecos sin opciones", "objective": "Rellenar palabras gramaticales cortas: preposiciones, auxiliares, artículos, pronombres, conectores.", "formula": ["Mira la palabra antes y después del hueco.", "Suele ser una palabra pequeña: of, to, in, at, has, have, been, which, who, the, a."], "triggers": ["interested ___ = in; depend ___ = on; good ___ = at.", "so ___ to = as; such ___ good idea = a; one of ___ best = the."], "examples": [["She is interested ___ technology.", "She is interested in technology.", "adjective + preposition."], ["I have never ___ to Ireland.", "I have never been to Ireland.", "have never been to + lugar."], ["It was such ___ useful app.", "It was such a useful app.", "such + a/an + adjective + singular noun."]], "examMove": "No inventes palabras largas. En open cloze casi siempre falta una pieza gramatical pequeña.", "trap": "Si el hueco parece imposible, mira si hay una expresión fija a ambos lados."}, "word-formation": {"title": "Word formation: cambia la familia de la palabra", "objective": "Pasar de verbo a sustantivo/adjetivo/adverbio según el hueco.", "formula": ["Después de un artículo suele ir un noun: a decision, the solution.", "Después de be/look/seem suele ir adjective: successful, responsible.", "Antes de adjective o verb puede ir adverb: extremely, clearly."], "triggers": ["a/an/the + hueco = noun probable.", "very/quite/extremely + hueco = adjective probable.", "hueco + noun = adjective probable."], "examples": [["His decide was wrong.", "His decision was wrong.", "his + noun."], ["The exam was success.", "The exam was successful.", "be + adjective."], ["She explained it clear.", "She explained it clearly.", "verb + adverb."]], "examMove": "Primero decide la categoría gramatical, luego cambia la palabra. No empieces a probar al azar.", "trap": "success es noun; successful adjective; successfully adverb."}, "transformations": {"title": "Key word transformations: mismo significado, otra estructura", "objective": "Reescribir frases usando una palabra obligatoria sin cambiarla.", "formula": ["No cambies la palabra clave.", "Piensa en bloques: too/enough, used to, so/such, despite/although, passive, reported speech, perfect forms."], "triggers": ["KEY: despite → despite + noun/ing.", "KEY: although → although + sujeto + verbo.", "KEY: since/for → Present Perfect."], "examples": [["The box was too heavy for me to lift. ENOUGH", "I wasn't strong enough to lift the box.", "too heavy ↔ not strong enough."], ["I started living here in 2020. SINCE", "I have lived here since 2020.", "start in past and still true now."], ["Although it rained, we went out. DESPITE", "Despite the rain, we went out.", "despite + noun."]], "examMove": "No traduzcas palabra por palabra: identifica la estructura equivalente.", "trap": "El hueco suele admitir 2–5 palabras. Evita frases larguísimas."}, "prepositions": {"title": "Prepositions & collocations: memoriza bloques, no palabras sueltas", "objective": "Usar combinaciones fijas: interested in, depend on, responsible for.", "formula": ["Adjective + preposition: good at, interested in, afraid of, responsible for.", "Verb + preposition: depend on, apologise for, listen to, look at, wait for."], "triggers": ["interested ___ → in; good ___ → at; responsible ___ → for; depend ___ → on; similar ___ → to."], "examples": [["I'm interested on football.", "I'm interested in football.", "interested in."], ["It depends of the weather.", "It depends on the weather.", "depend on."], ["She is responsible of the project.", "She is responsible for the project.", "responsible for."]], "examMove": "Cuando veas adjetivo/verbo conocido, no pienses en español: recupera el bloque entero.", "trap": "'depende de' no es depend of; es depend on."}, "gerunds-infinitives": {"title": "Verb patterns: -ing o to + infinitive", "objective": "Saber qué forma va después de cada verbo frecuente.", "formula": ["enjoy/avoid/finish/suggest + verb-ing.", "want/need/decide/hope/learn + to + verb."], "triggers": ["after preposition + -ing: interested in learning.", "would like + to; look forward to + -ing."], "examples": [["I enjoy to play football.", "I enjoy playing football.", "enjoy + -ing."], ["She decided studying abroad.", "She decided to study abroad.", "decide + to."], ["I look forward to meet you.", "I look forward to meeting you.", "to es preposición aquí, no infinitivo."]], "examMove": "Aprende familias pequeñas: enjoy/avoid/finish/suggest y want/need/decide/hope.", "trap": "look forward to + -ing es una trampa clásica."}, "linkers": {"title": "Linkers: lógica de frase para cloze y writing", "objective": "Elegir conectores según contraste, causa, consecuencia o adición.", "formula": ["although + subject + verb; despite + noun/ing.", "however suele separar frases; because + clause; because of + noun/ing."], "triggers": ["Contraste: although, however, despite, in spite of.", "Causa: because, because of, due to.", "Consecuencia: therefore, as a result."], "examples": [["Despite it was raining, we went out.", "Although it was raining, we went out.", "despite no va con sujeto + verbo."], ["Because of I was tired, I stopped.", "Because I was tired, I stopped.", "because + clause."], ["The app is simple. However, it is useful.", "The app is simple. However, it is useful.", "however contrasta dos ideas."]], "examMove": "Decide primero la relación lógica: contraste, causa, resultado o suma.", "trap": "despite + the rain / raining; although + it rained."}, "reading": {"title": "Reading B2: leer con misión, no palabra por palabra", "objective": "Contestar detalle/opinión/gist sin perder tiempo.", "formula": ["Lee la pregunta antes del texto.", "Busca sinónimos, no la misma palabra exacta.", "Distingue hecho, opinión y propósito."], "triggers": ["What does the writer suggest? = inferencia/opinión.", "According to the text = detalle localizable.", "main purpose = función global."], "examples": [["La pregunta dice 'advantage' y el texto dice 'benefit'.", "Es la misma idea con sinónimo.", "B2 prueba parafra function markStudy(xp=0){
  const today=todayISO(); const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(progress.lastStudyDate!==today){ progress.streak = progress.lastStudyDate===yesterday ? (progress.streak||0)+1 : 1; progress.lastStudyDate=today; }
  progress.studyLog[today]=(progress.studyLog[today]||0)+xp; progress.xp=(progress.xp||0)+xp; checkBadges(); saveProgress();
}
function topicStats(topic){
  let s = progress.topicStats[topic] || {attempts:0,correct:0};
  return {...s,accuracy:pct(s.correct,s.attempts)};
}

  progress.attempts[ex.id] = {...(progress.attempts[ex.id]||{}), lastCorrect:correct, attempts:(progress.attempts[ex.id]?.attempts||0)+1, topic:ex.topic, lastAt:new Date().toISOString(), question:ex.question, answer:ex.answer };
  const s = progress.topicStats[ex.topic] || {attempts:0,correct:0}; s.attempts++; if(correct)s.correct++; progress.topicStats[ex.topic]=s;
  markStudy(correct?10:3);
}
function checkBadges(){
  const add=id=>{if(!progress.badges.includes(id))progress.badges.push(id)};
  if(Object.keys(progress.attempts||{}).length>0)add('first-session');
  if(progress.diagnostic)add('diagnostic-done');
  if((progress.xp||0)>=250)add('xp-250');
  if((progress.xp||0)>=750)add('xp-750');
  if((progress.reviewedErrors||0)>=10)add('review-10');
  if((progress.visitedTheory||[]).length>=5)add('theory-5');
  if((progress.streak||0)>=3)add('streak-3');
  if((progress.writings||[]).length>=1)add('writing-1');
  if((progress.mocks||[]).some(m=>m.score>=70))add('mock-70');
  if(DATA.topics.some(t=>{const s=topicStats(t.id);return s.attempts>=10&&s.accuracy>=80}))add('master-topic');
}
function b2Readiness(){
  const weights=DATA.topics.filter(t=>!['listening'].includes(t.id)); let total=0, got=0;
  for(const t of weights){const s=topicStats(t.id); total+=t.weight; const capped=s.attempts<5? Math.min(s.accuracy,55):s.accuracy; got+=capped*t.weight/100;}
  return Math.round((got/total)*100);
}
function weakestTopics(n=3){return DATA.topics.filter(t=>!['listening','writing'].includes(t.id)).map(t=>({...t,stats:topicStats(t.id)})).sort((a,b)=>a.stats.accuracy-b.stats.accuracy || a.stats.attempts-b.stats.attempts).slice(0,n)}

function startSmartSession(){
 const topics=weakestTopics(4).map(t=>t.id); startSession({mode:'smart',title:'Sesión inteligente · temas flojos',topics,count:24,examMode:false,lessonId:null})
}
function startTopicSession(topic,count=20){startSession({mode:'topic',title:`Práctica · ${topicById(topic)?.name}`,topics:[topic],count,examMode:false,lessonId:topic})}
function startSession(opts){
 const pool=DATA.exercises.filter(e=>opts.topics.includes(e.topic));
 let qids=sample(pool, Math.min(opts.count,pool.length)).map(e=>e.id);
 activeSession={id:'s'+Date.now(),title:opts.title,mode:opts.mode,topics:opts.topics,qids,index:0,answers:{},startedAt:new Date().toISOString(),examMode:!!opts.examMode,lessonId:opts.lessonId||null,complete:false};
 saveSession(); markStudy(2); view('session');
}
function discardSession(){ if(confirm('¿Cerrar sesión activa? Se perderán las respuestas de esta sesión, pero no tu progreso general.')){activeSession=null; saveSession(); view('dashboard')} }
function renderSession(){ if(!activeSession)return `<div class="card"><h1>No hay sesión activa</h1><p class="muted">Crea una desde Practicar o desde la hoja de ruta.</p><button class="primary" onclick="view('practice')">Ir a practicar</button></div>`; return `<div class="card"><div class="hRow"><div><h1>${esc(activeSession.title)}</h1><p class="muted">Puedes ir a teoría y volver aquí sin perder la sesión.</p></div><div><button onclick="finishSession()" class="primary">Finalizar y corregir</button></div></div><div class="progress"><div class="bar" style="width:${pct(Object.keys(activeSession.answers||{}).length,activeSession.qids.length)}%"></div></div></div><div id="questionMount" style="margin-top:16px"></div>`}
function mountQuestion(){ const mount=byId('questionMount'); if(!mount||!activeSession)return; const ex=exById(activeSession.qids[activeSession.index]); if(!ex){mount.innerHTML='<div class="card">No se encontró la pregunta.</div>';return} const ans=activeSession.answers[ex.id]; mount.innerHTML=renderQuestion(ex,ans); }
function renderQuestion(ex,ans){
 const answered=!!ans; const isCorrect=ans?.correct; const n=activeSession.index+1, total=activeSession.qids.length;
 return `<div class="questionBox"><div class="questionMeta"><span class="tag">Pregunta ${n}/${total}</span><span class="tag">${topicById(ex.topic)?.icon} ${topicById(ex.topic)?.short}</span><span class="tag">${esc(ex.exam)}</span></div>${renderQuestionBody(ex,ans)}${answered?renderFeedback(ex,ans):renderAnswerArea(ex)}<div class="hRow" style="margin-top:16px"><button onclick="prevQ()" ${n===1?'disabled':''}>← Anterior</button><div><button onclick="view('theory','${ex.topic}')">📚 Ver teoría sin perder test</button><button onclick="nextQ()" ${n===total?'disabled':''}>Siguiente →</button></div></div></div>`
}
function renderQuestionBody(ex,ans){
 if(ex.type==='transform')return `<p class="muted">Primera frase:</p><h3>${esc(ex.first)}</h3><p><b>Key word:</b> <span class="kbd">${esc(ex.key)}</span></p><p class="muted">Segunda frase:</p><h3>${esc(ex.second).replace('____','<span class="kbd">____</span>')}</h3>`;
 if(ex.type==='reading')return `<div class="alert info"><b>Texto:</b><p>${esc(ex.passage)}</p></div><h3>${esc(ex.question)}</h3>`;
 return `<h2>${esc(ex.question)}</h2>`;
}
function renderAnswerArea(ex){
 if(['choice','reading'].includes(ex.type))return `<div>${ex.options.map((o,i)=>`<button class="option" onclick="submitAnswer('${ex.id}',${JSON.stringify(o)})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`;
 return `<div><input id="answerInput" style="width:100%;max-width:560px" placeholder="Escribe tu respuesta"><button class="primary" style="margin-left:8px" onclick="submitInput('${ex.id}')">Responder</button></div>`;
}
function submitInput(id){const val=byId('answerInput')?.value||''; submitAnswer(id,val)}
function submitAnswer(id,value){
 const ex=exById(id); const correct=(ex.accepted||[]).some(a=>norm(a)===norm(value));
 activeSession.answers[id]={value,correct,at:new Date().toISOString()}; recordAttempt(ex,correct); saveSession(); mountQuestion();
}
function renderFeedback(ex,ans){ const correct=ans.correct; return `<div class="feedback ${correct?'ok':'bad'}"><h3>${correct?'✅ Correcto':'❌ Fallo útil'}</h3><p><b>Tu respuesta:</b> ${esc(ans.value)} · <b>Respuesta:</b> ${esc(ex.answer)}</p><div class="explainGrid"><div class="explain"><b>Clave del contexto</b><p>${esc(ex.context)}</p></div><div class="explain"><b>Regla</b><p>${esc(ex.rule)}</p></div><div class="explain"><b>Estrategia próxima</b><p>${esc(ex.strategy)}</p></div><div class="explain"><b>Trampa típica</b><p>${esc(ex.trap)}</p></div></div>${correct?'':`<div style="margin-top:12px"><button class="primary" onclick="progress.reviewedErrors=(progress.reviewedErrors||0)+1; saveProgress(); view('theory','${ex.topic}')">Ir a la teoría de este fallo</button></div>`}</div>` }
function prevQ(){ if(activeSession.index>0){activeSession.index--; saveSession(); mountQuestion();} }
function nextQ(){ if(activeSession.index<activeSession.qids.length-1){activeSession.index++; saveSession(); mountQuestion();} }
function finishSession(){
 if(!activeSession)return; const answers=Object.values(activeSession.answers||{}); const score=pct(answers.filter(a=>a.correct).length,activeSession.qids.length);
 if(activeSession.mode==='diagnostic') progress.diagnostic={score,date:new Date().toISOString(),topics:activeSession.topics};
 if(activeSession.mode==='mock') progress.mocks.push({score,date:new Date().toISOString(),count:activeSession.qids.length});
 if(activeSession.lessonId && !progress.completedLessons.includes(activeSession.lessonId)) progress.completedLessons.push(activeSession.lessonId);
 markStudy(score>=70?50:25); const summary={title:activeSession.title,score,count:activeSession.qids.length,correct:answers.filter(a=>a.correct).length}; activeSession=null; saveSession(); saveProgress(); currentView='progress'; saveUI(); render(); setTimeout(()=>alert(`Sesión terminada: ${summary.correct}/${summary.count} (${summary.score}%)`),50);
}

}

function saveListening(){const title=byId('lisTitle').value||'Listening'; const minutes=Number(byId('lisMin').value||0); const diff=byId('lisDiff').value; const notes=byId('lisNotes').value; progress.listening.push({title,minutes,diff,notes,date:new Date().toISOString()}); markStudy(Math.min(40,Math.max(10,minutes))); render();}

function renderProgress(){
 return `<div class="card"><h1>Progreso</h1><p class="muted">Mira esto como panel de mando: qué está verde, qué está rojo y qué debes atacar.</p></div><div class="grid g3" style="margin-top:16px"><div class="card"><div class="muted">XP total</div><div class="statBig">${progress.xp||0}</div></div><div class="card"><div class="muted">Readiness B2</div><div class="statBig">${b2Readiness()}%</div></div><div class="card"><div class="muted">Preguntas vistas</div><div class="statBig">${Object.keys(progress.attempts||{}).length}</div></div></div><div class="card" style="margin-top:16px"><h2>Dominio por tema</h2><table class="table"><thead><tr><th>Tema</th><th>Acierto</th><th>Intentos</th><th>Acción</th></tr></thead><tbody>${DATA.topics.filter(t=>!['listening','writing'].includes(t.id)).map(t=>{const s=topicStats(t.id);return `<tr><td>${t.icon} <b>${t.name}</b><br><span class="small muted">${t.exam}</span></td><td style="min-width:170px"><div class="progress"><div class="bar ${s.accuracy>=75?'ok':s.accuracy>=55?'warn':'bad'}" style="width:${s.accuracy}%"></div></div><span class="small">${s.accuracy}%</span></td><td>${s.correct}/${s.attempts}</td><td><button onclick="view('topic','${t.id}')">Abrir</button></td></tr>`}).join('')}</tbody></table></div><div class="card" style="margin-top:16px"><h2>Datos</h2><button onclick="exportProgress()">Exportar progreso</button><button onclick="importProgressPrompt()">Importar progreso</button><button class="danger" onclick="resetAll()">Reset total</button></div>`;
}
function renderBadges(){return `<div class="card"><h1>Logros</h1><p class="muted">Gamificación con cabeza: los puntos no son el objetivo; son señales de constancia y corrección.</p></div><div class="badgeGrid" style="margin-top:16px">${DATA.achievements.map(a=>`<div class="badge ${progress.badges?.includes(a.id)?'unlocked':''}"><div class="emoji">${a.emoji}</div><h3>${a.name}</h3><p class="small muted">${a.desc}</p>${progress.badges?.includes(a.id)?'<span class="tag">Desbloqueado</span>':'<span class="tag">Pendiente</span>'}</div>`).join('')}</div>`}

function exportProgress(){const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='erasmus-b2-progress.json'; a.click();}
function importProgressPrompt(){const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json'; input.onchange=e=>{const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{progress={...defaultProgress(),...JSON.parse(reader.result)}; saveProgress(); render(); alert('Progreso importado.')}catch(err){alert('Archivo inválido.')}}; reader.readAsText(file);}; input.click();}
function resetAll(){if(confirm('Esto borra progreso, sesión activa, writings y listening. ¿Seguro?')){localStorage.removeItem(STORE_KEY);localStorage.removeItem(SESSION_KEY);progress=defaultProgress();activeSession=null;view('dashboard')}}

// Writing word count and prompt after render
const observer=new MutationObserver(()=>{const wt=byId('writingText'); if(wt&&!wt.dataset.bound){wt.dataset.bound=1; wt.addEventListener('input',()=>{byId('wordCount').textContent=wt.value.trim()?wt.value.trim().split(/\s+/).length:0}); showWritingPrompt();}}); observer.observe(document.body,{childList:true,subtree:true});
render();
</script>
</body>
</html>
