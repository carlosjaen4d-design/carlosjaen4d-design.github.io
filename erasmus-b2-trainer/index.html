<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Erasmus B2 Trainer v6</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eff6ff;--top:58px;--side:282px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:700}button:hover{border-color:#cbd5e1;transform:translateY(-1px)}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}button.primary:hover{background:var(--brand2)}button.ghost{background:transparent}button.danger{color:var(--bad);border-color:#fecaca}.topbar{height:var(--top);position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--top))}.sidebar{border-right:1px solid var(--line);background:#fff;padding:16px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto}.sidebtn{width:100%;display:flex;align-items:center;gap:10px;margin:4px 0;border:0;background:transparent;text-align:left;justify-content:flex-start}.sidebtn.active{background:var(--soft);color:var(--brand)}.sidegroup{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;margin:16px 4px 8px}.content{padding:22px;max-width:1280px;width:100%;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.flat{box-shadow:none}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid #dbeafe}.hero h1{font-size:34px;margin:0 0 8px;letter-spacing:-.04em}.muted{color:var(--muted)}.small{font-size:13px}.hRow{display:flex;align-items:center;justify-content:space-between;gap:14px}.tag{display:inline-flex;align-items:center;gap:6px;background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;color:#374151;margin:2px}.tag.ok{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.tag.warn{background:#fffbeb;color:#92400e;border-color:#fde68a}.tag.bad{background:#fef2f2;color:#991b1b;border-color:#fecaca}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--brand);transition:.25s}.bar.ok{background:var(--ok)}.bar.warn{background:var(--warn)}.bar.bad{background:var(--bad)}.statBig{font-size:34px;font-weight:950;letter-spacing:-.04em}.lesson{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;margin-bottom:10px}.lesson.done{border-color:#bbf7d0;background:#f0fdf4}.lesson.active{border-color:#bfdbfe;background:#eff6ff}.topicCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.topicCard.locked{opacity:.72}.topicTitle{display:flex;gap:10px;align-items:flex-start}.questionBox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.qText{font-size:22px;font-weight:850;line-height:1.35}.options{display:grid;gap:10px;margin-top:16px}.option{display:flex;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.option.selected{border-color:var(--brand);background:#eff6ff}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.inputAnswer{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}.feedback{border-radius:16px;padding:14px;margin-top:16px}.feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0}.feedback.bad{background:#fef2f2;border:1px solid #fecaca}.explainGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.explainBox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.sessionBar{position:sticky;top:var(--top);z-index:5;background:#111827;color:#fff;margin:-22px -22px 18px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}.sessionBar button{background:#fff;color:#111827}.theoryBlock{background:#f9fafb;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.examplePair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.badEx{background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:12px}.goodEx{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px}.tableWrap{max-width:100%;overflow-x:auto}
.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.pillNav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pillNav button.active{background:var(--brand);color:#fff}.examProfile{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.alert{border-radius:16px;padding:14px;border:1px solid var(--line);background:#fff}.alert.info{background:#eff6ff;border-color:#bfdbfe}.alert.warn{background:#fffbeb;border-color:#fde68a}.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#111827;color:#fff;border-radius:6px;padding:2px 6px}.mobileToggle{display:none}.textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:14px;padding:12px}.badge{display:flex;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.badge.locked{filter:grayscale(1);opacity:.45}@media(max-width:900px){:root{--side:0}.layout,.content,.card,.grid{min-width:0}.content{max-width:100vw;overflow-x:hidden}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:-300px;top:var(--top);width:280px;z-index:20;transition:.2s}.sidebar.open{left:0}.mobileToggle{display:inline-flex}.content{padding:14px}.g2,.g3,.g4,.explainGrid,.examplePair{grid-template-columns:1fr}.hero h1{font-size:26px}.sessionBar{margin:-14px -14px 14px;padding:10px 14px}}
</style></head>
<body><div class="topbar"><div class="brand"><button class="mobileToggle" onclick="mobileMenu()">☰</button><span>🎓 Erasmus B2 Trainer</span><span class="tag">v6</span></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">XP <b id="xp">0</b></span><span class="tag">B2 <b id="ready">0%</b></span><span class="tag">🔥 <b id="streak">0 días</b></span></div></div><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidegroup">Estudio</div><button data-view="dashboard" class="sidebtn active" onclick="setView('dashboard')">🏠 Panel</button><button data-view="roadmap" class="sidebtn" onclick="setView('roadmap')">🗺️ Hoja de ruta</button><button data-view="practice" class="sidebtn" onclick="setView('practice')">🧠 Practicar</button><button data-view="simulator" class="sidebtn" onclick="setView('simulator')">🎯 Simulador</button><div class="sidegroup">Biblioteca</div><button data-view="theory" class="sidebtn" onclick="setView('theory')">📚 Teoría</button><button data-view="errors" class="sidebtn" onclick="setView('errors')">🔍 Fallos</button><button data-view="writing" class="sidebtn" onclick="setView('writing')">✍️ Writing</button><button data-view="listening" class="sidebtn" onclick="setView('listening')">🎧 Listening</button><div class="sidegroup">Datos</div><button data-view="progress" class="sidebtn" onclick="setView('progress')">📊 Progreso</button><button data-view="settings" class="sidebtn" onclick="setView('settings')">⚙️ Ajustes</button><div class="alert info" style="margin-top:16px"><b>Regla de oro</b><br><span class="small">Fallo → teoría → reentrenar → simulacro.</span></div></aside><main class="content" id="app"></main></div><script>
const DATA = {"topics": [{"id": "tenses-map", "name": "Mapa de tiempos verbales", "short": "Tenses map", "unit": "Bloque 0 · Orientación", "icon": "🧭", "exam": "Grammar control / mixed cloze", "weight": 8, "why": "Para no estudiar tiempos sueltos: primero sabes qué tiempos existen y cuándo salen."}, {"id": "present-simple-continuous", "name": "Present Simple vs Present Continuous", "short": "Present S/C", "unit": "Bloque 1 · Core tenses", "icon": "🔄", "exam": "Grammar / open cloze", "weight": 7, "why": "Rutina vs ahora. Parece básico, pero cae muchísimo en huecos y writings."}, {"id": "past-simple-continuous", "name": "Past Simple vs Past Continuous", "short": "Past S/C", "unit": "Bloque 1 · Core tenses", "icon": "🎬", "exam": "Narrative grammar / reading", "weight": 7, "why": "Acción puntual vs acción en progreso en el pasado."}, {"id": "pp-vs-past", "name": "Present Perfect vs Past Simple", "short": "Perfect vs Past", "unit": "Bloque 1 · Core tenses", "icon": "⏱️", "exam": "Grammar control / open cloze", "weight": 10, "why": "Tu mayor punto de mejora: since/for/already/yesterday deciden la respuesta."}, {"id": "present-perfect-continuous", "name": "Present Perfect Simple vs Continuous", "short": "PPS/PPC", "unit": "Bloque 1 · Core tenses", "icon": "⏳", "exam": "Grammar / transformations", "weight": 7, "why": "I have worked vs I have been working: resultado vs duración/proceso."}, {"id": "irregulars", "name": "Irregular verbs & participles", "short": "Irregulares", "unit": "Bloque 1 · Core tenses", "icon": "🧱", "exam": "Use of English", "weight": 10, "why": "Sin participios no hay perfect tenses, pasiva ni transformations."}, {"id": "past-perfect", "name": "Past Perfect & Past Perfect Continuous", "short": "Past Perfect", "unit": "Bloque 1 · Core tenses", "icon": "⏮️", "exam": "Narrative grammar / transformations", "weight": 8, "why": "Ordena dos acciones pasadas: lo anterior va con had + participio."}, {"id": "future-forms", "name": "Future forms: will, going to, present continuous", "short": "Futures", "unit": "Bloque 2 · B2 grammar", "icon": "🔮", "exam": "Grammar / writing", "weight": 7, "why": "Plan, predicción, decisión espontánea y horario. Muy útil para writing y speaking."}, {"id": "conditionals", "name": "Conditionals 0, 1, 2, 3 & mixed", "short": "Conditionals", "unit": "Bloque 2 · B2 grammar", "icon": "🌿", "exam": "Transformations / writing", "weight": 10, "why": "If I were..., If I had known... es B2 puro y cae mucho en reescrituras."}, {"id": "passive", "name": "Passive voice", "short": "Passive", "unit": "Bloque 2 · B2 grammar", "icon": "🏗️", "exam": "Transformations / formal writing", "weight": 8, "why": "Se usa para sonar más formal y para cambiar foco: The app was created..."}, {"id": "reported-speech", "name": "Reported speech", "short": "Reported", "unit": "Bloque 2 · B2 grammar", "icon": "💬", "exam": "Transformations", "weight": 8, "why": "He said that..., she asked if... típico en transformations."}, {"id": "modals", "name": "Modal verbs: obligation, deduction, advice", "short": "Modals", "unit": "Bloque 2 · B2 grammar", "icon": "⚖️", "exam": "Open cloze / transformations", "weight": 8, "why": "must, have to, should, might, can't have... dan muchos puntos B2."}, {"id": "relative-clauses", "name": "Relative clauses", "short": "Relatives", "unit": "Bloque 2 · B2 grammar", "icon": "🧷", "exam": "Writing / transformations / cloze", "weight": 7, "why": "who/which/where/whose y comas: mejora writing y reading."}, {"id": "articles-quantifiers", "name": "Articles & quantifiers", "short": "Articles", "unit": "Bloque 2 · B2 grammar", "icon": "🔢", "exam": "Open cloze", "weight": 7, "why": "a/the/—, much/many/few/little suelen aparecer en huecos sin opciones."}, {"id": "prepositions", "name": "Prepositions & collocations", "short": "Prepositions", "unit": "Bloque 3 · Use of English", "icon": "📌", "exam": "Cloze / multiple-choice cloze", "weight": 9, "why": "interested in, depend on, responsible for: se aprenden como bloques."}, {"id": "gerunds-infinitives", "name": "Verb patterns: -ing / to", "short": "-ing / to", "unit": "Bloque 3 · Use of English", "icon": "🧩", "exam": "Grammar / transformations", "weight": 8, "why": "enjoy doing, decide to do, make someone do: muy rentable."}, {"id": "linkers", "name": "Linkers & sentence logic", "short": "Linkers", "unit": "Bloque 3 · Use of English", "icon": "🔗", "exam": "Writing / cloze / transformations", "weight": 8, "why": "although/despite/however/because of suben writing y cloze."}, {"id": "word-formation", "name": "Word formation", "short": "Word formation", "unit": "Bloque 3 · Use of English", "icon": "🔧", "exam": "B2 Reading & Use Part 3", "weight": 9, "why": "success → successful → successfully. Puntos rápidos si identificas categoría."}, {"id": "open-cloze", "name": "Open cloze", "short": "Open cloze", "unit": "Bloque 3 · Use of English", "icon": "🕳️", "exam": "B2 Reading & Use Part 2", "weight": 10, "why": "Huecos sin opciones: auxiliares, preposiciones, artículos, pronombres, conectores."}, {"id": "transformations", "name": "Key word transformations", "short": "Transformations", "unit": "Bloque 3 · Use of English", "icon": "🔁", "exam": "B2 Reading & Use Part 4", "weight": 10, "why": "Reescribir sin cambiar significado: puede mezclar todos los temas."}, {"id": "reading", "name": "Reading strategy", "short": "Reading", "unit": "Bloque 4 · Skills", "icon": "📖", "exam": "B2 Reading Parts 5-7", "weight": 8, "why": "Opinión, detalle, inferencia y estructura textual."}, {"id": "writing", "name": "Writing B2", "short": "Writing", "unit": "Bloque 4 · Skills", "icon": "✍️", "exam": "Essay / email / article / review / report", "weight": 10, "why": "Estructura + conectores + control de errores. Puede salvar nota."}, {"id": "listening", "name": "Listening tracker", "short": "Listening", "unit": "Bloque 4 · Skills", "icon": "🎧", "exam": "Listening", "weight": 5, "why": "Lo puedes trabajar aparte, pero registrarlo evita engañarte."}], "theory": {"tenses-map": {"title": "Mapa de tiempos verbales: no son 12 monstruos, son decisiones", "objective": "Entender qué tiempos puede preguntar un examen escrito y para qué sirve cada grupo.", "formula": ["Present: rutinas/verdades vs acciones ahora.", "Past: hechos cerrados vs acciones en progreso.", "Perfect: conexión con ahora o anterioridad.", "Future: predicción, plan, intención, horario."], "triggers": ["Palabras de tiempo: always, now, yesterday, since, by the time, tomorrow.", "La pregunta real casi nunca es 'qué tiempo sé', sino 'qué pista manda'."], "examples": [["I am playing football every Sunday.", "I play football every Sunday.", "every Sunday = rutina."], ["I have seen him yesterday.", "I saw him yesterday.", "yesterday = tiempo cerrado."], ["When I arrived, she left.", "When I arrived, she had left.", "ella se fue antes de que yo llegara."]], "examMove": "Antes de contestar: 1) subraya marcador temporal, 2) decide si está cerrado o conectado, 3) mira si hay dos acciones.", "trap": "No intentes memorizar 12 tiempos a la vez. Aprende qué problema resuelve cada uno.", "common": ""}, "present-simple-continuous": {"title": "Present Simple vs Present Continuous", "objective": "Distinguir rutina/verdad general de acción temporal o en progreso.", "formula": ["Present Simple: subject + verb; he/she/it + -s.", "Present Continuous: am/is/are + verb-ing."], "triggers": ["always, usually, every day = Present Simple.", "now, at the moment, currently, this week = Present Continuous.", "Stative verbs: know, believe, like, need suelen ir en simple."], "examples": [["I am usually go to class by bus.", "I usually go to class by bus.", "usually = rutina."], ["She studies now.", "She is studying now.", "now = acción en progreso."], ["I am knowing the answer.", "I know the answer.", "know no suele ir en continuous."]], "examMove": "Busca si habla de hábito o de ahora. Si ves adverbio de frecuencia, casi siempre Present Simple.", "trap": "No uses continuous con todos los verbos. 'I know', no 'I am knowing'.", "common": ""}, "past-simple-continuous": {"title": "Past Simple vs Past Continuous", "objective": "Narrar pasado: acción puntual vs acción que estaba ocurriendo.", "formula": ["Past Simple: finished action: I arrived, she called.", "Past Continuous: was/were + verb-ing: I was studying."], "triggers": ["when + acción puntual suele ir con Past Simple.", "while/as + acción en progreso suele ir con Past Continuous."], "examples": [["I watched TV when she called.", "I was watching TV when she called.", "ver la tele estaba en progreso."], ["While I walked home, it started to rain.", "While I was walking home, it started to rain.", "while marca acción larga."], ["He was dropped his phone.", "He dropped his phone.", "drop es acción puntual."]], "examMove": "Pregunta: ¿es una escena de fondo o un golpe puntual? Fondo = continuous; golpe = simple.", "trap": "No pongas Past Continuous solo porque sea pasado. Debe haber duración/progreso.", "common": ""}, "pp-vs-past": {"title": "Present Perfect vs Past Simple", "objective": "Elegir entre have/has + participio y pasado simple sin traducir desde español.", "formula": ["Present Perfect = have/has + past participle.", "Past Simple = verb in past form."], "triggers": ["Present Perfect: since, for, already, yet, ever, never, recently, so far, this week si sigue viva.", "Past Simple: yesterday, last night, ago, in 2020, when I was..., last year."], "examples": [["I have seen him yesterday.", "I saw him yesterday.", "yesterday cierra el tiempo."], ["I lived here since 2020.", "I have lived here since 2020.", "since conecta pasado y presente."], ["She has already finish.", "She has already finished.", "have/has + participio."]], "examMove": "Subraya la palabra de tiempo: cerrada = Past Simple; conectada con ahora = Present Perfect.", "trap": "El español engaña: 'he visto ayer' en inglés es incorrecto.", "common": ""}, "present-perfect-continuous": {"title": "Present Perfect Simple vs Continuous", "objective": "Diferenciar resultado conseguido de proceso/duración.", "formula": ["PPS: have/has + participle: I have written three emails.", "PPC: have/has been + verb-ing: I have been writing all morning."], "triggers": ["how long, all day, lately = continuous probable.", "how many, how much, already, just = simple probable."], "examples": [["I have been finished the report.", "I have finished the report.", "resultado completado."], ["I have studied for three hours and I'm tired.", "I have been studying for three hours and I'm tired.", "énfasis en duración/proceso."], ["She has been reading three books this month.", "She has read three books this month.", "cantidad completada = simple."]], "examMove": "Mira si importa el resultado o el proceso. Resultado = simple; duración/proceso = continuous.", "trap": "No uses continuous con cantidades completadas: 'have read three books'.", "common": ""}, "irregulars": {"title": "Irregular verbs & participles", "objective": "Diferenciar segunda y tercera columna: spoke/spoken, wrote/written.", "formula": ["Past simple: I spoke, I wrote, I took.", "Past participle: I have spoken, I have written, I have taken."], "triggers": ["Después de have/has/had/be/been necesitas participio.", "Después de did el verbo vuelve a base: Did you go?"], "examples": [["I have spoke English.", "I have spoken English.", "have + participio."], ["Did you went?", "Did you go?", "did ya marca pasado."], ["The window was broke.", "The window was broken.", "pasiva = be + participio."]], "examMove": "Si ves have/has/had/was/were/been, busca tercera columna.", "trap": "No confundas past simple con participio: spoke ≠ spoken.", "common": ""}, "past-perfect": {"title": "Past Perfect & Past Perfect Continuous", "objective": "Ordenar acciones pasadas y expresar duración antes de otro pasado.", "formula": ["Past Perfect: had + participle.", "Past Perfect Continuous: had been + verb-ing."], "triggers": ["by the time, before, after, already + pasado.", "for two hours before... = had been + ing probable."], "examples": [["When I arrived, she left.", "When I arrived, she had left.", "ella se fue antes."], ["He was tired because he had worked all night.", "He was tired because he had been working all night.", "duración/proceso antes de otro pasado."], ["I didn't watch it because I saw it before.", "I didn't watch it because I had seen it before.", "verla fue anterior."]], "examMove": "Dibuja dos puntos en una línea de tiempo. El punto más antiguo suele ir en Past Perfect.", "trap": "No lo uses para cualquier pasado. Solo cuando hay anterioridad clara.", "common": ""}, "future-forms": {"title": "Future forms: will, going to, present continuous", "objective": "Elegir futuro según intención, plan, decisión espontánea u horario.", "formula": ["will + verb: prediction/spontaneous decision.", "be going to + verb: intention/evidence.", "present continuous: fixed personal arrangement."], "triggers": ["Look at those clouds = going to.", "I think/probably = will.", "tomorrow at 6 with a person/plan = present continuous."], "examples": [["Look at the sky! It will rain.", "Look at the sky! It is going to rain.", "evidencia presente."], ["I meet Ana tomorrow at six.", "I am meeting Ana tomorrow at six.", "plan organizado."], ["The train is leaving at 8.", "The train leaves at 8.", "horario oficial = present simple."]], "examMove": "Decide el tipo de futuro: predicción, intención, plan fijo u horario.", "trap": "No todo futuro es will.", "common": ""}, "conditionals": {"title": "Conditionals 0, 1, 2, 3 & mixed", "objective": "Usar if para hechos, posibilidades reales, hipótesis y pasado imposible.", "formula": ["0: If + present, present.", "1: If + present, will + verb.", "2: If + past, would + verb.", "3: If + past perfect, would have + participle."], "triggers": ["scientific/general truth = zero.", "real future possibility = first.", "imaginary present/future = second.", "regret/impossible past = third."], "examples": [["If I will pass, I will go.", "If I pass, I will go.", "en if de primer condicional no va will."], ["If I was you, I would study.", "If I were you, I would study.", "forma estándar B2."], ["If I knew, I would have told you.", "If I had known, I would have told you.", "pasado imposible = third conditional."]], "examMove": "Identifica si es real, imaginario o pasado imposible. Eso decide todo.", "trap": "El error clásico: meter will después de if en primer condicional.", "common": ""}, "passive": {"title": "Passive voice", "objective": "Cambiar el foco de quién hace la acción a qué recibe la acción.", "formula": ["Passive = be + past participle.", "Present: is made. Past: was made. Perfect: has been made. Future: will be made."], "triggers": ["formal writing, reports, processes.", "by + agent solo si importa quién lo hizo."], "examples": [["They built the app in 2024 → The app built in 2024.", "The app was built in 2024.", "be + participio."], ["The documents have sent.", "The documents have been sent.", "perfect passive = have/has been + participio."], ["People speak English here.", "English is spoken here.", "foco en English."]], "examMove": "Busca objeto de la activa; ese objeto pasa a sujeto de la pasiva.", "trap": "No olvides el verbo be. 'was created', no 'created' solo.", "common": ""}, "reported-speech": {"title": "Reported speech", "objective": "Contar lo que alguien dijo o preguntó cambiando tiempos y orden.", "formula": ["say/tell + that + clause.", "Questions: asked if/whether... or asked wh-word + subject + verb."], "triggers": ["said/told en pasado suele empujar un tiempo hacia atrás.", "am/is → was; present simple → past simple; past simple → past perfect; will → would."], "examples": [["He said me he was tired.", "He told me he was tired.", "tell + persona."], ["She asked where did I live.", "She asked where I lived.", "pregunta indirecta: orden afirmativo."], ["He said: I finished. → He said he finished.", "He said he had finished.", "backshift típico."]], "examMove": "En function loadProgress(){try{let raw=localStorage.getItem(STORE_KEY); if(raw) return {...defaultProgress(),...JSON.parse(raw)}; for(const k of OLD_STORE_KEYS){let old=localStorage.getItem(k); if(old){let p={...defaultProgress(),...JSON.parse(old),version:6}; localStorage.setItem(STORE_KEY,JSON.stringify(p)); return p}}}catch(e){} return defaultProgress()}
function saveProgress(){localStorage.setItem(STORE_KEY,JSON.stringify(progress));}
function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function saveSession(){activeSession?localStorage.setItem(SESSION_KEY,JSON.stringify(activeSession)):localStorage.removeItem(SESSION_KEY)}
function topic(id){return DATA.topics.find(t=>t.id===id)||DATA.topics[0]}
function theory(id){return DATA.theory[id]}
function ex(id){return DATA.exercises.find(e=>e.id===id)}
function byTopic(id){return DATA.exercises.filter(e=>e.topic===id)}
function setView(v,arg){currentView=v;if(arg)currentTopic=arg;document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render(); if(innerWidth<900)$('sidebar').classList.remove('open')}
function touchStudy(){const t=today(); if(progress.lastStudyDate!==t){let y=new Date();y.setDate(y.getDate()-1);const yy=y.toISOString().slice(0,10);progress.streak=(progress.lastStudyDate===yy)?(progress.streak||0)+1:1;progress.lastStudyDate=t;saveProgress()}}
function addXP(n){progress.xp=(progress.xp||0)+n; touchStudy(); checkBadges(); saveProgress()}
function topicStats(id){const s=progress.topicStats?.[id]||{attempts:0,correct:0};return {...s,accuracy:s.attempts?Math.round(s.correct/s.attempts*100):0}}
function readiness(){const relevant=DATA.topics.filter(t=>!['writing','listening'].includes(t.id)); let total=0, w=0; for(const t of relevant){const s=topicStats(t.id); const confidence=Math.min(1,s.attempts/8); const score=s.accuracy*confidence + 35*(1-confidence); total+=score*t.weight; w+=t.weight} return Math.round(total/w)}
function weakestTopics(n=5){return DATA.topics.filter(t=>!['writing','listening'].includes(t.id)).map(t=>({t,s:topicStats(t.id)})).sort((a,b)=>(a.s.accuracy||0)-(b.s.accuracy||0) || a.s.attempts-b.s.attempts).slice(0,n).map(x=>x.t)}
function checkBadges(){const b=new Set(progress.badges||[]); if(Object.keys(progress.attempts||{}).length) b.add('first-session'); if((progress.completedSessions||[]).some(s=>s.mode==='diagnostic')) b.add('diagnostic-done'); if((progress.completedSessions||[]).some(s=>s.mode==='exam')) b.add('exam-sim-done'); if((progress.examReports||[]).some(r=>r.score>=70)) b.add('mock-70'); if((progress.xp||0)>=500) b.add('xp-500'); if((progress.xp||0)>=1200) b.add('xp-1200'); if((progress.reviewedErrors||0)>=15) b.add('review-15'); if((progress.visitedTheory||[]).length>=10) b.add('theory-10'); if((progress.streak||0)>=3) b.add('streak-3'); if((progress.writings||[]).length>=1) b.add('writing-1'); progress.badges=[...b]}
function sample(arr,n){const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a.slice(0,n)}
function questionsForCounts(counts){let ids=[]; for(const [tid,c] of Object.entries(counts)){ids.push(...sample(byTopic(tid),c).map(e=>e.id))} return sample(ids,ids.length)}
function startSession(opts){let qids=[]; if(opts.qids) qids=opts.qids; else if(opts.counts) qids=questionsForCounts(opts.counts); else {const pool=opts.topics.flatMap(t=>byTopic(t)); qids=sample(pool,opts.count||20).map(e=>e.id)} activeSession={id:'s'+Date.now(),title:opts.title,mode:opts.mode||'practice',qids,index:0,answers:{},startedAt:new Date().toISOString(),duration:opts.duration||null,examMode:!!opts.examMode,reviewAtEnd:!!opts.reviewAtEnd,profile:opts.profile||null,writing:!!opts.writing,complete:false}; saveSession(); selectedAnswer=null; setView('session')}
function startDiagnostic(){startSession({title:'Diagnóstico general B2 · todas las áreas',mode:'diagnostic',topics:DATA.topics.filter(t=>!['writing','listening'].includes(t.id)).map(t=>t.id),count:60,duration:45,examMode:true,reviewAtEnd:true})}
function startSmart(){const topics=weakestTopics(5).map(t=>t.id); startSession({title:'Sesión inteligente · tus puntos flojos',mode:'smart',topics,count:30,examMode:false})}
function startTopic(tid,count=20){startSession({title:'Práctica · '+topic(tid).name,mode:'topic',topics:[tid],count,examMode:false})}
function startCheckpoint(kind){const map={core:['present-simple-continuous','past-simple-continuous','pp-vs-past','present-perfect-continuous','irregulars','past-perfect'],b2grammar:['future-forms','conditionals','passive','reported-speech','modals','relative-clauses','articles-quantifiers'],use:['prepositions','gerunds-infinitives','linkers','word-formation','open-cloze','transformations'],exam:['reading','pp-vs-past','conditionals','passive','word-formation','open-cloze','transformations']}; startSession({title:'Checkpoint · '+kind,mode:'checkpoint',topics:map[kind]||map.core,count:35,duration:30,examMode:true,reviewAtEnd:true})}
function startExam(pid){const p=DATA.examProfiles.find(x=>x.id===pid); startSession({title:p.name,mode:'exam',counts:p.counts,duration:p.duration,examMode:true,reviewAtEnd:true,profile:p.id,writing:p.writing})}
function currentExercise(){return activeSession?ex(activeSession.qids[activeSession.index]):null}
function answerGiven(){const e=currentExercise(); return e && activeSession.answers[e.id]}
function norm(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/[.!?]$/,'')}
function isCorrect(e,ans){return (e.accepted||[e.answer]).some(a=>norm(a)===norm(ans))}
function submitAnswer(ans){const e=currentExercise(); if(!e)return; const correct=isCorrect(e,ans); activeSession.answers[e.id]={answer:ans,correct,ts:new Date().toISOString()}; saveSession(); if(!activeSession.examMode) registerAttempt(e,ans,correct); selectedAnswer=null; render()}
function registerAttempt(e,ans,correct){progress.attempts[e.id]={answer:ans,correct,topic:e.topic,type:e.type,ts:new Date().toISOString()}; progress.topicStats[e.topic]=progress.topicStats[e.topic]||{attempts:0,correct:0}; progress.topicStats[e.topic].attempts++; if(correct) progress.topicStats[e.topic].correct++; if(correct) addXP(e.type==='transform'?12:8); else {addXP(2); progress.errors.unshift({id:'err'+Date.now()+Math.random(),qid:e.id,topic:e.topic,answer:ans,correct:e.answer,ts:new Date().toISOString(),reviewed:false}); progress.errors=progress.errors.slice(0,80)} saveProgress()}
function finishSession(){if(!activeSession)return; if(activeSession.reviewAtEnd || activeSession.examMode){for(const qid of activeSession.qids){const e=ex(qid), a=activeSession.answers[qid]; if(a && !progress.attempts[qid+activeSession.id]){const correct=!!a.correct; progress.attempts[qid+activeSession.id]={answer:a.answer,correct,topic:e.topic,type:e.type,ts:new Date().toISOString()}; progress.topicStats[e.topic]=progress.topicStats[e.topic]||{attempts:0,correct:0}; progress.topicStats[e.topic].attempts++; if(correct) progress.topicStats[e.topic].correct++; if(!correct){progress.errors.unshift({id:'err'+Date.now()+Math.random(),qid:e.id,topic:e.topic,answer:a.answer,correct:e.answer,ts:new Date().toISOString(),reviewed:false})}}}
 }
 const answered=activeSession.qids.filter(id=>activeSession.answers[id]).length; const correct=activeSession.qids.filter(id=>activeSession.answers[id]?.correct).length; const score=answered?Math.round(correct/activeSession.qids.length*100):0; const report={id:activeSession.id,title:activeSession.title,mode:activeSession.mode,score,correct,total:activeSession.qids.length,ts:new Date().toISOString(),weak:sessionWeakTopics()}; progress.completedSessions.unshift(report); if(activeSession.mode==='exam')progress.examReports.unshift(report); addXP(Math.max(10,correct*4)); activeSession.complete=true; saveProgress(); saveSession(); render()}
function sessionWeakTopics(){if(!activeSession)return[]; const map={}; for(const qid of activeSession.qids){const e=ex(qid), a=activeSession.answers[qid]; if(!e||!a)continue; map[e.topic]=map[e.topic]||{topic:e.topic,total:0,correct:0}; map[e.topic].total++; if(a.correct)map[e.topic].correct++} return Object.values(map).map(x=>({...x,accuracy:Math.round(x.correct/x.total*100)})).sort((a,b)=>a.accuracy-b.accuracy).slice(0,5)}
function nextQ(){if(!activeSession)return; if(activeSession.index<activeSession.qids.length-1){activeSession.index++;saveSession();render()} }
function prevQ(){if(!activeSession)return; if(activeSession.index>0){activeSession.index--;saveSession();render()} }
function goQ(i){activeSession.index=i;saveSession();render()}
function abandonSession(){if(confirm('¿Cerrar esta sesión activa? Se perderá el punto donde ibas.')){activeSession=null;saveSession();setView('dashboard')}}
function visitTheory(tid){currentTopic=tid; if(!progress.visitedTheory.includes(tid)){progress.visitedTheory.push(tid); addXP(5)} setView('theory',tid)}
function markReviewed(errid){const er=progress.errors.find(e=>e.id===errid); if(er&&!er.reviewed){er.reviewed=true; progress.reviewedErrors=(progress.reviewedErrors||0)+1; addXP(6); saveProgress(); render()}}
function render(){clearInterval(timer); const app=$('app'); if(!app)return; const bar=activeSession&&!activeSession.complete&&currentView!=='session'?`<div class="sessionBar"><div><b>Test activo:</b> ${esc(activeSession.title)} · pregunta ${activeSession.index+1}/${activeSession.qids.length}</div><button onclick="setView('session')">Volver al test</button></div>`:''; app.innerHTML=bar + (views[currentView]||views.dashboard)(); updateTop(); if(currentView==='session')startTimer()}
function updateTop(){$('xp').textContent=progress.xp||0; $('ready').textContent=readiness()+'%'; $('streak').textContent=(progress.streak||0)+' días'}
const views={

(t.id).accuracy>=55?'warn':'bad'}" style="width:${topicStats(t.id).accuracy}%"></div></div><div class="small muted">${topicStats(t.id).accuracy}% · ${topicStats(t.id).attempts} intentos</div></div>`).join('')}</div></div>`},

 practice(){return `<div class="card"><div class="hRow"><div><h1>Practicar por módulos</h1><p class="muted">Cada módulo tiene teoría breve, ejercicios y progreso.</p></div><button class="primary" onclick="startSmart()">⚡ Sesión inteligente</button></div></div><div class="grid g3" style="margin-top:16px">${DATA.topics.filter(t=>!['writing','listening'].includes(t.id)).map(t=>topicModuleCard(t.id)).join('')}</div>`},

 theory(){const t=topic(currentTopic), th=theory(currentTopic); const list=DATA.topics.filter(t=>t.id!=='listening').map(x=>`<button class="sidebtn ${x.id===currentTopic?'active':''}" onclick="visitTheory('${x.id}')">${x.icon} ${x.short}</button>`).join(''); return `<div class="grid" style="grid-template-columns:300px 1fr"><div class="card flat"><h3>Biblioteca</h3>${list}</div><div class="card"><span class="tag">${esc(t.exam)}</span><h1>${t.icon} ${esc(th.title)}</h1><p class="muted">${esc(th.objective)}</p><div class="theoryBlock"><h3>Fórmula limpia</h3><ul>${th.formula.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="theoryBlock"><h3>Pistas de contexto</h3><ul>${th.triggers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><h3>Errores típicos corregidos</h3>${th.examples.map(ex=>`<div class="examplePair"><div class="badEx"><b>Mal / riesgo</b><br>${esc(ex[0])}</div><div class="goodEx"><b>Bien</b><br>${esc(ex[1])}<p class="small">${esc(ex[2])}</p></div></div>`).join('')}<div class="alert info"><b>Movimiento de examen:</b> ${esc(th.examMove)}</div><div class="alert warn" style="margin-top:10px"><b>Trampa típica:</b> ${esc(th.trap)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="primary" onclick="startTopic('${t.id}',20)">Practicar este tema</button>${activeSession&&!activeSession.complete?`<button onclick="setView('session')">Volver al test activo</button>`:''}</div></div></div>`},
 simulator(){return `<div class="card"><h1>Simulador de exámenes</h1><p class="muted">Aquí no hay pistas durante el test. Corriges al final y la plataforma te devuelve una hoja de ruta de fallos.</p></div><div class="grid g2" style="margin-top:16px">${DATA.examProfiles.map(p=>`<div class="examProfile"><span class="tag warn">${p.duration} min</span><h2>${esc(p.name)}</h2><p class="muted">${esc(p.desc)}</p><p class="small"><b>Incluye:</b> ${Object.keys(p.counts).map(k=>topic(k).short).join(', ')}${p.writing?', + writing prompt':''}</p><button class="primary" onclick="startExam('${p.id}')">Empezar simulacro</button></div>`).join('')}</div><div class="card" style="margin-top:16px"><h2>Últimos informes</h2>${(progress.examReports||[]).slice(0,5).map(r=>examReportCard(r)).join('')||'<p class="muted">Todavía no hay simulacros terminados.</p>'}</div>`},
 session(){if(!activeSession)return `<div class="card"><h1>No hay test activo</h1><button onclick="setView('practice')">Ir a practicar</button></div>`; if(activeSession.complete)return renderSessionReport(); const e=currentExercise(), n=activeSession.index+1, total=activeSession.qids.length, ans=activeSession.answers[e.id]; return `<div class="sessionBar"><div><b>${esc(activeSession.title)}</b> · ${n}/${total} ${activeSession.duration?`· <span id="clock"></span>`:''}</div><div><button onclick="finishSession()">Finalizar</button><button onclick="abandonSession()">Cerrar</button></div></div><div class="card"><div class="hRow"><div><span class="tag">${topic(e.topic).icon} ${topic(e.topic).name}</span><span class="tag">${esc(e.exam)}</span><span class="tag">${esc(e.level)}</span></div><div>${activeSession.qids.map((id,i)=>`<button style="padding:6px 9px;border-radius:9px;margin:1px" class="${i===activeSession.index?'primary':''}" onclick="goQ(${i})">${i+1}</button>`).join('')}</div></div></div><div style="margin-top:16px">${renderExercise(e,ans)}</div>`},

 settings(){return `<div class="card"><h1>Ajustes</h1><button onclick="exportProgress()">Exportar progreso</button><button onclick="importProgress()">Importar progreso</button><button class="danger" onclick="resetAll()">Borrar progreso</button><p class="muted small">El progreso se guarda en este navegador. Exporta si cambias de móvil/PC.</p></div>`}
};
function topicModuleCard(tid){const t=topic(tid), s=topicStats(tid); return `<div class="topicCard"><div class="topicTitle"><div style="font-size:24px">${t.icon}</div><div><b>${esc(t.name)}</b><div class="small muted">${esc(t.exam)}</div></div></div><p class="small">${esc(t.why)}</p><div class="progress"><div class="bar ${s.accuracy>=75?'ok':s.accuracy>=55?'warn':'bad'}" style="width:${s.accuracy}%"></div></div><div class="small muted">${s.accuracy}% · ${s.attempts||0} intentos</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button onclick="setView('topic','${tid}')">Abrir</button><button class="primary" onclick="startTopic('${tid}',20)">Practicar</button></div></div>`}
function shortTheory(tid){const th=theory(tid); return `<p><b>Objetivo:</b> ${esc(th.objective)}</p><ul>${th.formula.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="alert info"><b>Movimiento de examen:</b> ${esc(th.examMove)}</div>`}
function renderExercise(e,ans){return `<div class="questionBox">${e.passage?`<div class="theoryBlock"><b>Text</b><p>${esc(e.passage)}</p></div>`:''}${e.type==='transform'?`<div class="theoryBlock"><b>First sentence:</b><p>${esc(e.first)}</p><b>Key word:</b> <span class="kbd">${esc(e.key)}</span><p><b>Second sentence:</b> ${esc(e.second).replace('____','<input id="textAns" class="inputAnswer" style="max-width:360px" placeholder="respuesta">')}</p></div>`:`<div class="qText">${esc(e.question)}</div>`}${renderAnswer(e,ans)}${ans&&!activeSession.reviewAtEnd?feedback(e,ans):''}<div class="hRow" style="margin-top:16px"><button onclick="prevQ()" ${activeSession.index===0?'disabled':''}>← Anterior</button><div><button onclick="visitTheory('${e.topic}')">📚 Ver teoría sin perder test</button><button onclick="nextQ()" ${activeSession.index===activeSession.qids.length-1?'disabled':''}>Siguiente →</button></div></div></div>`}
function renderAnswer(e,ans){if(ans&&activeSession.reviewAtEnd)return `<div class="alert info" style="margin-top:16px"><b>Respuesta guardada.</b> Se corregirá al final.</div>`; if(ans&&!activeSession.reviewAtEnd)return ''; if(e.type==='choice'||e.type==='reading'){return `<div class="options">${(e.options||[]).map((o,i)=>`<button class="option ${selectedAnswer===o?'selected':''}" onclick="selectOption(${i})"><span class="kbd">${String.fromCharCode(65+i)}</span> ${esc(o)}</button>`).join('')}</div><button class="primary" style="margin-top:12px" ${selectedAnswer?'':'disabled'} onclick="submitAnswer(selectedAnswer)">Responder</button>`} return `${e.type!=='transform'?`<input id="textAns" class="inputAnswer" placeholder="Escribe la respuesta exacta">`:''}<button class="primary" style="margin-top:12px" onclick="submitAnswer(document.getElementById('textAns').value)">Responder</button>`}
function selectOption(index){const e=currentExercise(); selectedAnswer=(e.options||[])[index]||null; render()}
function feedback(e,ans){const ok=ans.correct; return `<div class="feedback ${ok?'ok':'bad'}"><h3>${ok?'✅ Correcto':'❌ No exactamente'}</h3><p><b>Correcta:</b> ${esc(e.answer)}</p><div class="explainGrid"><div class="explainBox"><b>Contexto</b><p>${esc(e.context)}</p></div><div class="explainBox"><b>Regla</b><p>${esc(e.rule)}</p></div><div class="explainBox"><b>Estrategia</b><p>${esc(e.strategy)}</p></div><div class="explainBox"><b>Trampa</b><p>${esc(e.trap)}</p></div></div>${!ok?`<button style="margin-top:12px" onclick="visitTheory('${e.topic}')">Ir a la teoría de este fallo</button>`:''}</div>`}
function renderSessionReport(){const total=activeSession.qids.length, correct=activeSession.qids.filter(id=>activeSession.answers[id]?.correct).length, score=Math.round(correct/total*100), weak=sessionWeakTopics(); return `<div class="card"><h1>Informe de sesión</h1><div class="statBig">${score}%</div><p class="muted">${correct}/${total} correctas</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="activeSession=null; saveSession(); setView('errors')">Guardar informe y revisar fallos</button><button onclick="activeSession=null; saveSession(); setView('dashboard')">Cerrar</button></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>Temas más flojos de esta sesión</h2>${weak.map(w=>`<div class="lesson"><b>${topic(w.topic).icon} ${topic(w.topic).name}</b><div class="progress"><div class="bar ${w.accuracy>=70?'ok':w.accuracy>=50?'warn':'bad'}" style="width:${w.accuracy}%"></div></div><span class="small">${w.correct}/${w.total} · ${w.accuracy}%</span><br><button onclick="setView('topic','${w.topic}')">Abrir módulo</button></div>`).join('')}</div><div class="card"><h2>Corrección completa</h2>${activeSession.qids.map(id=>{const e=ex(id),a=activeSession.answers[id];return `<div class="lesson"><span class="tag ${a?.correct?'ok':'bad'}">${a?.correct?'OK':'Fallo'}</span> <b>${topic(e.topic).short}</b><p>${esc(e.question)}</p><p class="small"><b>Tuya:</b> ${esc(a?.answer||'—')} · <b>Correcta:</b> ${esc(e.answer)}</p></div>`}).join('')}</div></div>`}
function examReportCard(r){return `<div class="lesson"><div class="hRow"><b>${esc(r.title)}</b><span class="tag ${r.score>=70?'ok':r.score>=55?'warn':'bad'}">${r.score}%</span></div><p class="small muted">${new Date(r.ts).toLocaleString()}</p>${(r.weak||[]).map(w=>`<span class="tag">${topic(w.topic).short}: ${w.accuracy}%</span>`).join('')}</div>`}
function startTimer(){if(!activeSession?.duration)return; const end=new Date(activeSession.startedAt).getTime()+activeSession.duration*60000; const tick=()=>{const left=end-Date.now(); if(left<=0){$('clock')&&($('clock').textContent='00:00'); finishSession(); return} const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000); if($('clock'))$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}; tick(); timer=setInterval(tick,1000)}
function saveWriting(id){const txt=$('txt_'+id).value.trim(); if(!txt)return alert('Escribe o pega tu writing primero.'); progress.writings.unshift({id,txt,date:new Date().toISOString(),words:txt.split(/\s+/).length}); addXP(25); saveProgress(); alert('Writing guardado. Pásamelo por chat si quieres corrección real.')}
function saveListening(){const minutes=$('minListen').value, source=$('srcListen').value, diff=$('diffListen').value; if(!minutes)return alert('Pon minutos.'); progress.listening.unshift({minutes,source,diff,date:new Date().toISOString()}); addXP(Math.min(30,Number(minutes)||5)); saveProgress(); render()}
function exportProgress(){const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='erasmus-b2-progress.json'; a.click()}
function importProgress(){const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json'; inp.onchange=()=>{const f=inp.files[0]; const r=new FileReader(); r.onload=()=>{try{progress={...defaultProgress(),...JSON.parse(r.result)}; saveProgress(); render()}catch(e){alert('Archivo no válido')}}; r.readAsText(f)}; inp.click()}
function resetAll(){if(confirm('¿Seguro? Se borrará el progreso de este navegador.')){progress=defaultProgress();activeSession=null;saveProgress();saveSession();render()}}
function mobileMenu(){ $('sidebar').classList.toggle('open') }
window.addEventListener('load',render);
</script></body></html>
