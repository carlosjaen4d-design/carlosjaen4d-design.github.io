function settingsHTML(){ return `<div class="card"><h3>Ajustes y datos</h3><label><input type="checkbox" ${state.settings.autoTheory?'checked':''} onchange="state.settings.autoTheory=this.checked;save()"> Autoabrir teoría al fallar en práctica</label><br><br><label><input type="checkbox" ${state.settings.coachMode?'checked':''} onchange="state.settings.coachMode=this.checked;save();render()"> Mostrar coach y recomendaciones</label><br><br><label>Objetivo diario de ejercicios <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.dailyGoal}" onchange="state.settings.dailyGoal=Number(this.value)||30;save()"></label><br><br><label>Tamaño sesión recomendada <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.preferredSession||20}" onchange="state.settings.preferredSession=Number(this.value)||20;save()"></label><hr><h3>Criterio de corrección v10</h3><div class="grid cols-3"><div class="card flat"><span class="score-chip ok">✅ Bien = 1</span><p class="small muted">Coincide con una respuesta aceptada. Mayúsculas y puntuación final no te castigan.</p></div><div class="card flat"><span class="score-chip partial">❔ Dudosa = 0,5</span><p class="small muted">Intención correcta con fallo pequeño: spelling leve, keyword incompleta, demasiadas palabras en open cloze o transformation parcialmente construida.</p></div><div class="card flat"><span class="score-chip no">❌ Mal = 0</span><p class="small muted">No encaja con la estructura que pedía el ejercicio.</p></div></div><div class="qa-banner"><b>Importante:</b> v10 no usa ❔ para regalarte puntos. Lo usa para separar “no tenía ni idea” de “lo entendí, pero no respeté formato”. En simulacro, las ❔ cuentan 0,5 para entrenar; en una prueba real pueden depender del tipo de ejercicio y del corrector.</div><h3>Contratos de respuesta</h3><table class="exam-table"><tr><th>Tipo</th><th>Qué debes escribir</th><th>Error típico</th></tr><tr><td>Open cloze</td><td>UNA palabra</td><td>meter una frase</td></tr><tr><td>Word formation</td><td>UNA palabra derivada</td><td>dejar la base sin cambiar</td></tr><tr><td>Transformation</td><td>2-5 palabras con keyword</td><td>escribir solo el verbo que cambia</td></tr><tr><td>Multiple choice</td><td>una opción</td><td>elegir por traducción literal</td></tr></table><hr><div class="btn-row"><button class="btn secondary" onclick="exportProgress()">Exportar progreso</button><button class="btn secondary" onclick="importProgress()">Importar progreso</button><button class="btn bad" onclick="resetProgress()">Reiniciar</button></div><p class="source-note">El progreso se guarda en este navegador con localStorage. Si cambias de dispositivo, exporta/importa.</p></div>`; }

function sessionHTML(){ const s=state.session; if(!s || s.completed) return `<div class="empty"><h3>No hay sesión activa</h3><button class="btn" onclick="startSmartSession()">Empezar sesión inteligente</button></div>`; const q=exerciseById(s.ids[s.index]); if(!q) return `<div class="empty">Pregunta no encontrada.</div>`; const answered=s.responses[q.id]; const exam=s.mode==='exam'; const part=examPartForQuestion(q); return `<div class="focus-strip"><div><b>${exam?'Modo examen':'Modo práctica'}</b> · ${s.title} · ${s.index+1}/${s.ids.length}<br><span class="small muted">${part}</span></div><div class="btn-row"><button class="btn secondary" onclick="pauseSession()">Salir sin perder</button>${exam?'<span class="pill warn">sin pistas</span>':''}</div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><span class="pill ${exam?'warn':''}">${exam?'Modo examen':'Modo práctica'}</span> <span class="pill">${moduleById(q.module)?.title}</span></div><div class="small muted">${s.minutes?`${s.minutes} min · `:''}${s.index+1}/${s.ids.length}</div></div>${pctBar(Math.round((s.index)/s.ids.length*100))}</div><div class="question-box" style="margin-top:16px">${q.passage?`<div class="passage">${wikiText(q.passage,{max:8})}</div>`:''}${typeGuideHTML(q, exam)}<div class="prompt-block"><div class="small muted">${q.difficulty} · ${questionKind(q).replace('_',' ')}</div><div class="question-prompt">${wikiText(q.prompt,{max:12})}</div>${!exam?`<div class="wiki-help small">💡 Mini Wiki: pasa el ratón o toca las palabras subrayadas para ver explicación sin salir del test. <button class="btn ghost" style="padding:6px 9px;margin-left:8px" onclick="openMiniWiki()">Abrir mini wiki</button></div>`:''}</div>${questionInputHTML(q, answered)}<div id="formatWarning" class="input-warning"></div><div id="feedbackArea">${answered && !exam?feedbackHTML(q,answered):''}</div><div class="btn-row" style="margin-top:16px">${!answered?`<button class="btn" onclick="submitAnswer('${q.id}')">${exam?'Guardar respuesta':'Comprobar / Guardar'}</button>`:`<button class="btn" onclick="nextQuestion()">${s.index===s.ids.length-1?'Finalizar':'Siguiente'}</button>`}${!exam?`<button class="btn ghost" onclick="showHint('${q.id}')">Pista sin spoiler</button><button class="btn secondary" onclick="showView('theory',{id:'${q.module}'})">Ver teoría</button>`:''}<button class="btn secondary" onclick="pauseSession()">Salir sin perder sesión</button></div>${exam?`<div class="feedback info"><b>Modo examen:</b> instrucciones visibles, pero sin pista ni teoría hasta finalizar. Responde y sigue. Al final recibirás informe por módulos.</div>`:''}</div>`; }

function questionInputHTML(q, answered){ const c=answerContract(q); if(q.type==='mcq'){ return `<div class="options">${q.options.map(opt=>{const selected=answered&&normalize(answered.given)===normalize(opt); const st=answerStatus(answered); return `<button class="option ${selected?(st==='correct'?'correct':st==='partial'?'partial':'wrong'):''} ${answered&&isCorrect(q,opt)?'correct':''}" onclick="selectOption(this,'${escapeAttr(opt)}')" ${answered?'disabled':''}>${wikiText(opt,{max:4})}</button>`}).join('')}</div><input type="hidden" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}">`; } if(q.type==='writing'){ return `<textarea class="textarea" id="currentAnswer" placeholder="Escribe aquí 140-190 palabras..."></textarea><div class="small muted" id="wordCount">0 palabras</div>`; } return `<input class="answer-input" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}" placeholder="${escapeAttr(c.placeholder||'Escribe tu respuesta')}" ${answered?'disabled':''} oninput="liveFormatWarning('${q.id}')"><div class="answer-help">${c.title}. ${c.rule.replace(/<[^>]+>/g,'')}</div>`; }

function liveFormatWarning(id){ const q=exerciseById(id); const el=$('currentAnswer'); const box=$('formatWarning'); if(!q||!el||!box)return; const val=el.value||''; const kind=questionKind(q); const words=looseNormalize(val).split(' ').filter(Boolean); let msg=''; if(kind==='open_cloze' && words.length>1) msg='Open cloze pide UNA palabra. Borra artículos/frases extra.'; if(kind==='word_formation' && words.length>1) msg='Word formation pide UNA palabra derivada, no una frase.'; if(kind==='transformation'){ const kw=looseNormalize(q.keyWord||''); if(words.length && words.length<2) msg='Transformation: probablemente falta la keyword o más parte del hueco.'; else if(kw && words.length && !words.includes(kw)) msg='Falta la keyword obligatoria: '+q.keyWord+'.'; else if(words.length>5) msg='Transformation B2 suele pedir 2-5 palabras.'; } box.style.display=msg?'block':'none'; box.textContent=msg; }

function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function selectOption(btn,opt){ document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); $('currentAnswer').value=opt; }
function feedbackHTML(q,a){ const st=answerStatus(a); const good=st==='correct', partial=st==='partial'; const c=answerContract(q); const res=exerciseResourceHTML(q); const resourceBtn=(q.resourceTarget&&q.resourceTarget.startsWith('irregular:'))?`<button class="btn ghost" onclick="openIrregularVerb('${escapeAttr(q.resourceTarget.split(':')[1])}')">Ver ficha exacta del verbo</button>`:''; return `<div class="feedback ${good?'good':partial?'partial':'bad'}"><h3>${good?'✅ Bien':partial?'❔ Casi / respuesta dudosa':'❌ Fallo útil'}</h3><p><b>Tu respuesta:</b> ${a.given||'—'} ${partial?'<span class="pill partial">0,5 puntos</span>':''}</p><p><b>Respuesta modelo:</b> ${q.answer[0]}</p>${a.reason?`<p><b>Criterio:</b> ${a.reason}</p>`:''}<div class="format-note"><b>Formato que se pedía:</b> ${c.rule}<br><b>Clave después de corregir:</b> ${wikiText(q.clue||'Mira la estructura alrededor del hueco.',{max:6})}</div>${exerciseMicroHTML(q)}${res}<p><b>Explicación de la regla:</b> ${wikiText(q.explanation,{max:10})}</p><p><b>Trampa típica:</b> ${wikiText(q.trap||'Responder por traducción literal.',{max:8})}</p>${!good?`<div class="manual-actions"><button class="btn warn" onclick="showView('theory',{id:'${q.module}'})">Ir a la teoría de este fallo</button> ${resourceBtn} <button class="btn ghost" onclick="markAnswerAsPartial('${q.id}')">Marcar como ❔ duda personal</button><p class="small muted">Úsalo solo si de verdad entendiste la idea pero el formato te pilló. En examen queremos convertirlo en ✅.</p></div>`:''}</div>`; }
function showHint(id){ const q=exerciseById(id); toast(`<b>Pista sin spoiler:</b> ${safeHint(q)}`); }

function markAnswerAsPartial(id){ const q=exerciseById(id); if(!q)return; const s=state.session; const target=(s&&s.responses&&s.responses[id])?s.responses[id]:state.answers[id]; if(!target)return; target.status='partial'; target.correct=false; target.score=.5; target.reason='Marcado como ❔ duda personal: intención parcialmente correcta, pero requiere revisar formato exacto de examen.'; target.manualPartial=true; state.answers[id]=target; if(s&&s.responses)s.responses[id]=target; save(); render(); toast('Marcado como ❔ duda personal. Ahora toca reentrenarlo para convertirlo en ✅.'); }

function submitAnswer(id){ const s=state.session; const q=exerciseById(id); let val=$('currentAnswer')?.value||''; if(q.type==='mcq' && !val){toast('Elige una opción.');return} if(q.type==='input' && !val.trim()){toast('Escribe una respuesta.');return} validateFormatBeforeSubmit(q,val); const ev=evaluateAnswer(q,val); const record={given:val, correct:ev.status==='correct', status:ev.status, score:ev.score, reason:ev.reason, date:new Date().toISOString(), module:q.module, kind:questionKind(q)}; s.responses[q.id]=record; state.answers[q.id]=record; state.events.push({type:'answer',status:ev.status,module:q.module,kind:questionKind(q),date:new Date().toISOString()}); markStudy(); addXP(ev.status==='correct'?10:ev.status==='partial'?7:4); if(ev.status==='incorrect' && state.settings.autoTheory && s.mode!=='exam'){ save(); showView('theory',{id:q.module}); return; } save(); render(); }
function nextQuestion(){ const s=state.session; if(s.index < s.ids.length-1){ s.index++; save(); render(); } else completeSession(); }
function pauseSession(){ save(); showView('dashboard'); toast('Sesión guardada. Puedes volver cuando quieras.'); }
function completeSession(){ const s=state.session; const total=s.ids.length; const corr=s.ids.filter(id=>answerStatus(s.responses[id])==='correct').length; const part=s.ids.filter(id=>answerStatus(s.responses[id])==='partial').length; const weighted=s.ids.reduce((sum,id)=>sum+answerScore(s.responses[id]),0); const score=Math.round(weighted/total*100); const by={}; s.ids.forEach(id=>{const q=exerciseById(id); if(!q)return; const a=s.responses[id]; by[q.module]=by[q.module]||{t:0,c:0,p:0,w:0}; by[q.module].t++; if(answerStatus(a)==='correct') by[q.module].c++; if(answerStatus(a)==='partial') by[q.module].p++; by[q.module].w+=answerScore(a);}); s.completed=true; const hist={title:s.title, profile:s.profile||s.mode, score, correct:corr, partial:part, weighted,total,date:new Date().toLocaleString(), by}; state.examHistory=state.examHistory||[]; if(s.mode==='exam') state.examHistory.push(hist); addXP(score>=75?40:score>=60?25:12); save(); showReport(hist, s.mode!=='exam'); state.session=null; save(); }
function showReport(hist, practice=false){ const weak=Object.entries(hist.by).map(([id,v])=>({id,score:Math.round((v.w ?? v.c)/v.t*100),...v})).sort((a,b)=>a.score-b.score).slice(0,5); const html=`<h2>Informe: ${hist.title}</h2><div class="grid cols-3"><div class="card"><div class="muted small">Resultado ponderado</div><div class="big-number">${hist.score}%</div>${pctBar(hist.score)}<p class="small muted">✅ 1 punto · ❔ 0,5 · ❌ 0</p></div><div class="card"><div class="muted small">Detalle</div><div class="big-number">${hist.correct}/${hist.total}</div><p>✅ correctas · ❔ ${hist.partial||0} dudosas · ❌ ${hist.total-hist.correct-(hist.partial||0)} fallos</p></div><div class="card"><div class="muted small">Lectura real</div><p>${hist.score>=75?'Vas en zona de candidato serio. Mantén simulacros y writing.':hist.score>=60?'B1 alto/B2 raspado. Hay que convertir las ❔ en ✅ y machacar fallos concretos.':'Aún no es zona B2. No estudies más temas: trabaja tus rojos y dudas.'}</p></div></div><h3>Módulos débiles</h3>${weak.map(w=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${moduleById(w.id)?.title}</b><span>${w.score}% ${w.p?`· ❔ ${w.p}`:''}</span></div>${pctBar(w.score)}<button class="btn ghost" style="margin-top:8px" onclick="closeModal();showView('theory',{id:'${w.id}'})">Ver teoría</button> <button class="btn" style="margin-top:8px" onclick="closeModal();startModuleSession('${w.id}',12)">Practicar</button></div>`).join('')}<div class="btn-row"><button class="btn" onclick="closeModal();startSmartSession()">Siguiente sesión inteligente</button><button class="btn secondary" onclick="closeModal();showView('progress')">Ver progreso</button></div>`; openModal(html); }
function openModal(html){$('modal').innerHTML=html;$('modalBack').style.display='flex'} function closeModal(){$('modalBack').style.display='none'}
$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function pickQuestions(mods,count,preferWeak=false){ let pool=EXERCISES.filter(q=>mods.includes(q.module)&&!['writing','tracker'].includes(q.type)); if(!pool.length) pool=EXERCISES.filter(q=>!['writing','tracker'].includes(q.type)); const scored=pool.map(q=>{const a=state.answers[q.id]; const m=moduleById(q.module); let score=Math.random(); if(!a) score+=5; if(a && answerStatus(a)==='incorrect') score+=8; if(a && answerStatus(a)==='partial') score+=5; if(preferWeak) score+=(100-mastery(q.module))/12; score+=(m?.priority||5)/10; return {q,score};}).sort((a,b)=>b.score-a.score); return scored.slice(0,Math.min(count,scored.length)).map(x=>x.q.id); }
function startSession(title, ids, mode='practice', profile='custom'){ state.session={title,ids,index:0,responses:{},mode,profile,startedAt:new Date().toISOString(),completed:false}; save(); showView('session'); }
function startCustomSession(ids,title='Sesión personalizada'){ startSession(title,ids,'practice','custom'); }
function startModuleSession(id,count=10){ const m=moduleById(id); const ids=pickQuestions([id],count,true); startSession(m.title, ids, 'practice', id); }
function startSmartSession(){ const mods=weakModules(6).map(m=>m.id); const ids=pickQuestions(mods,20,true); startSession('Sesión inteligente: zona roja', ids, 'practice','smart'); }
function startMistakeSession(){ const ids=Object.entries(state.answers).filter(([id,a])=>answerStatus(a)!=='correct').map(([id])=>id); if(!ids.length){toast('Aún no tienes fallos ni dudas. Haz diagnóstico primero.'); return;} startSession('Reentreno de fallos y dudas', ids.slice(-30).reverse(), 'practice','mistakes'); }
function startExam(id){ const p=EXAM_PROFILES.find(x=>x.id===id); if(!p)return; const ids=pickQuestions(p.modules,p.count,true); startSession(p.title, ids, 'exam', p.id); state.session.minutes=p.minutes; save(); }
function quickContinue(){ if(state.session && !state.session.completed) showView('session'); else startSmartSession(); }
function openWriting(id){ const q=exerciseById(id); const html=`<h2>${q.clue}: Writing practice</h2><p>${q.prompt}</p><textarea class="textarea" id="writingBox" oninput="updateWritingCount()"></textarea><p id="writingCount" class="muted">0 palabras</p><div class="feedback info"><b>Checklist B2:</b><ul><li>140-190 palabras</li><li>4 párrafos claros</li><li>2-4 conectores</li><li>Responde todos los puntos</li><li>Revisa present perfect, articles y prepositions</li></ul></div><button class="btn" onclick="saveWriting('${id}')">Guardar writing</button>`; openModal(html); }
function updateWritingCount(){ const words=($('writingBox').value.trim().match(/\b\S+\b/g)||[]).length; $('writingCount').textContent=words+' palabras'; }
function saveWriting(id){ const text=$('writingBox').value; const words=(text.trim().match(/\b\S+\b/g)||[]).length; state.writing.push({id,text,words,date:new Date().toISOString()}); markStudy(); addXP(words>=140&&words<=190?30:12); save(); closeModal(); toast('Writing guardado. Palabras: '+words); render(); }
function saveListening(){ state.listening.push({min:$('listenMin').value,diff:$('listenDiff').value,task:$('listenTask').value,notes:$('listenNotes').value,date:new Date().toISOString()}); addXP(8); markStudy(); save(); render(); toast('Listening guardado.'); }
function exportProgress(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='erasmus-b2-progress.json'; a.click(); URL.revokeObjectURL(url); }
function importProgress(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=()=>{const f=inp.files[0]; const r=new FileReader(); r.onload=()=>{try{state={...state,...JSON.parse(r.result)}; save(); render(); toast('Progreso importado');}catch(e){toast('Archivo inválido')}}; r.readAsText(f)}; inp.click(); }
function resetProgress(){ if(confirm('¿Seguro? Esto borra progreso local de este navegador.')){localStorage.removeItem(STORAGE_KEY); state=loadState(); showView('dashboard');}}
window.addEventListener('keydown',e=>{ if(currentView==='session' && e.key==='Enter' && !e.shiftKey){ const s=state.session; if(!s)return; const q=exerciseById(s.ids[s.index]); if(q && q.type==='input' && !s.responses[q.id]) submitAnswer(q.id); }});

/* v13: clear progress states + visitor/owner views. Static, no backend. */
function stateLabelFromScore(score, done=0){
  if(!done) return {label:'No empezado', cls:'none', explain:'Todavía no hay datos suficientes.'};
  if(score < 35) return {label:'Rojo', cls:'red', explain:'Riesgo alto: aquí se pierden puntos.'};
  if(score < 55) return {label:'Naranja', cls:'orange', explain:'Entendido a medias: toca teoría + práctica.'};
  if(score < 70) return {label:'Amarillo', cls:'yellow', explain:'Aprobable, pero inestable en examen.'};
  if(score < 85) return {label:'Azul', cls:'blue', explain:'Camino B2: consolidar con simulacros.'};
  return {label:'Verde', cls:'green', explain:'Fuerte: repaso ligero y mantener.'};
}
function stageInfoFromSnapshot(snap){
  const r = Number(snap.readiness||0), done=Number(snap.completed||0), exams=(snap.exams||[]).length;
  if(done < 15 && !exams) return {label:'Fase 0 · Falta diagnóstico', cls:'none', next:'Hacer diagnóstico B2 para no estudiar a ciegas.', summary:'Aún no sabemos bien dónde está Carlos.'};
  if(r < 45) return {label:'Fase 1 · Construir base', cls:'red', next:'Atacar zona roja: irregulares, perfect tenses y Use of English.', summary:'Está empezando o tiene huecos fuertes. Hay que convertir fallos repetidos en reglas simples.'};
  if(r < 60) return {label:'Fase 2 · B1 alto hacia B2', cls:'orange', next:'Sesiones cortas de fallos + módulos débiles + mini simulacro.', summary:'Ya hay trabajo hecho, pero todavía no es estable para B2.'};
  if(r < 75) return {label:'Fase 3 · B2 raspado', cls:'yellow', next:'Convertir dudas ❔ en aciertos ✅ y practicar simulador blueprint.', summary:'Puede acercarse al B2, pero necesita regularidad y evitar errores de formato.'};
  if(r < 85) return {label:'Fase 4 · Candidato B2 serio', cls:'blue', next:'Simulacros completos, writing y revisión fina.', summary:'Va en zona seria. El objetivo es mantener y no regalar puntos.'};
  return {label:'Fase 5 · B2 bastante sólido', cls:'green', next:'Mantener con simulacros y writing. No sobreestudiar teoría nueva.', summary:'Progreso fuerte: toca consolidar y llegar fresco al examen.'};
}
function latestExamSnapshot(){ const h=(state.examHistory||[]); return h.length?h[h.length-1]:null; }
function publicModuleStats(){ return MODULES.map(m=>{ const st=getModuleStats(m.id); const mas=mastery(m.id); const lab=stateLabelFromScore(mas, st.done); return {id:m.id,title:m.title,group:m.group,priority:m.priority,mastery:mas,done:st.done,total:st.total,accuracy:st.acc,correct:st.correct,partial:st.partial,status:lab.label,statusClass:lab.cls,goal:m.goal}; }); }
function makeProgressSnapshot(){
  const modules=publicModuleStats(); const weak=modules.filter(m=>m.priority>=7 && !['writing','listening'].includes(m.id)).sort((a,b)=>a.mastery-b.mastery || b.priority-a.priority).slice(0,5);
  const next=weak[0] || null; const plan=planProgressToday(); const exams=(state.examHistory||[]).slice(-5).map(e=>({title:e.title,profile:e.profile,score:e.score,correct:e.correct,partial:e.partial,total:e.total,date:e.date}));
  return {type:'erasmus-b2-visitor-snapshot', build:'v14', profile:{name:state.settings?.profileName||'Carlos', examDate:state.settings?.examDate||'', goal:state.settings?.goalText||'Conseguir una prueba escrita B2 seria para Erasmus'}, generatedAt:new Date().toLocaleString(), readiness:readiness(), accuracy:accuracy(), completed:completedCount(), correct:correctCount(), partial:partialCount(), incorrect:Math.max(0,completedCount()-correctCount()-partialCount()), xp:state.xp||0, level:level(), streak:state.streak||0, daily:plan, nextModule:next, weakModules:weak, modules, exams, achievements:ACHIEVEMENTS.map(a=>({title:a.title,done:!!state.achievements[a.id]})), activeSession:state.session && !state.session.completed ? {title:state.session.title,index:state.session.index+1,total:state.session.ids.length} : null, writingCount:(state.writing||[]).length, listeningCount:(state.listening||[]).length};
}
function compactPublicSnapshot(){ const s=makeProgressSnapshot(); return {...s, modules:s.modules.map(m=>({id:m.id,title:m.title,group:m.group,mastery:m.mastery,done:m.done,total:m.total,status:m.status,statusClass:m.statusClass,priority:m.priority})), weakModules:s.weakModules.map(m=>({id:m.id,title:m.title,mastery:m.mastery,status:m.status,statusClass:m.statusClass})), achievements:s.achievements.filter(a=>a.done)}; }
function utf8ToB64Url(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlToUtf8(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str); const bytes=new Uint8Array([...bin].map(ch=>ch.charCodeAt(0))); return new TextDecoder().decode(bytes); }
function encodeSnapshot(obj){ return utf8ToB64Url(JSON.stringify(obj)); }
function decodeSnapshot(raw){ try{return JSON.parse(b64UrlToUtf8(raw));}catch(e){return null;} }
function visitorSnapshotFromURL(){ const h=location.hash||''; if(!h.startsWith('#visitor=')) return null; return decodeSnapshot(h.slice('#visitor='.length)); }
function visitorLink(){ return location.origin + location.pathname + '#visitor=' + encodeSnapshot(compactPublicSnapshot()); }
function copyVisitorLink(){ const link=visitorLink(); if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>toast('Enlace de visitante copiado.')).catch(()=>showCopyLink(link));} else showCopyLink(link); }
function showCopyLink(link){ openModal(`<h2>Enlace de visitante</h2><p class="muted">Copia este enlace y mándaselo a quien quieras. Abre una vista solo lectura con tu estado.</p><textarea class="copy-link-area" readonly>${safeText(link)}</textarea><div class="btn-row" style="margin-top:12px"><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>`); }
function enterOwnerMode(){ if(location.hash.startsWith('#visitor=')){ history.replaceState(null,'',location.pathname+location.search); } showView('dashboard',{forceOwner:true}); }
function badgeHTML(label, cls){ return `<span class="state-badge ${cls}">${safeText(label)}</span>`; }
function scoreRing(v){ v=Math.max(0,Math.min(100,Number(v)||0)); return `<div class="progress-ring" style="--v:${v}"><span>${v}%</span></div>`; }
function journeyHTML(snap){ const r=snap.readiness||0; const steps=[['0','Diagnóstico',snap.completed>=15||snap.exams?.length],['1','Base crítica',r>=45],['2','Use of English',r>=60],['3','Simulacro B2',r>=75],['4','Consolidar',r>=85]]; let currentSet=false; return `<div class="journey">${steps.map(([n,t,done])=>{let cls=done?'done':''; if(!done&&!currentSet){cls='now'; currentSet=true;} else if(!done&&currentSet) cls='next'; return `<div class="journey-step ${cls}"><b>${n}. ${t}</b><span class="small muted">${done?'Hecho / encaminado':cls==='now'?'Toca ahora':'Después'}</span></div>`}).join('')}</div>`; }
function moduleStatusRows(mods){ return `<div class="module-status-list">${mods.map(m=>`<div class="module-status-row"><div><b>${safeText(m.title)}</b><br><span class="small muted">${safeText(m.group||'Módulo')} · ${m.done||0}/${m.total||0} ejercicios vistos</span></div><div>${badgeHTML(m.status||stateLabelFromScore(m.mastery,m.done).label, m.statusClass||stateLabelFromScore(m.mastery,m.done).cls)}</div><div><b>${m.mastery||0}%</b>${pctBar(m.mastery||0)}</div><div class="small muted">${m.mastery<55?'Prioridad: teoría + ejercicios guiados.':m.mastery<75?'Objetivo: convertir dudas en aciertos.':'Mantener con repaso.'}</div></div>`).join('')}</div>`; }
function clearProgressSummaryHTML(snap){ const stage=stageInfoFromSnapshot(snap); const next=snap.nextModule; const last=(snap.exams||[]).slice(-1)[0]; return `<div class="status-banner"><div class="headline">${safeText(snap.profile?.name||'Carlos')}: ${safeText(stage.label)}</div><p class="muted" style="margin-top:0">${safeText(stage.summary)}</p><div class="grid cols-4"><div class="card flat">${scoreRing(snap.readiness||0)}<p class="small muted" style="text-align:center">B2 readiness</p></div><div class="card flat"><div class="muted small">Estado actual</div><p>${badgeHTML(stage.label,stage.cls)}</p><p class="small muted">No es una nota oficial: es una lectura ponderada de ejercicios, cobertura y simulacros.</p></div><div class="card flat"><div class="muted small">Ahora mismo toca</div><h3>${next?safeText(next.title):'Simulacro / Writing'}</h3><p class="small muted">${safeText(stage.next)}</p></div><div class="card flat"><div class="muted small">Último simulacro</div><h3>${last?`${last.score}%`:'Sin simulacro'}</h3><p class="small muted">${last?safeText(last.title):'Haz diagnóstico o blueprint B2.'}</p></div></div>${journeyHTML(snap)}</div>`; }
function audienceSwitchHTML(){ return `<div class="mode-switch"><span class="mode-chip active">👤 Modo Carlos</span><button class="mode-chip" onclick="showView('visitor',{snapshot:makeProgressSnapshot(),localPreview:true})">👀 Ver como visitante</button><button class="mode-chip" onclick="copyVisitorLink()">🔗 Copiar enlace visitante</button></div>`; }
function dashboardHTML(){ const snap=makeProgressSnapshot(); const rec=recommendedAction(); const weak=snap.weakModules||[]; return `${audienceSwitchHTML()}<div class="hero"><h2>Panel de control B2</h2><p>Esta es tu vista de trabajo: qué punto estás, qué toca ahora y hacia dónde vas. La vista visitante enseña lo mismo, pero en modo solo lectura y explicado para alguien externo.</p></div>${clearProgressSummaryHTML(snap)}<div class="north-star"><div class="card owner-only"><h3>Tu siguiente acción</h3><p class="muted">No elijas al azar. Sigue este botón salvo que estés haciendo un simulacro.</p><h2>${safeText(rec.title)}</h2><p>${safeText(rec.desc)}</p><button class="btn" onclick="${rec.action}">${safeText(rec.btn)}</button><button class="btn secondary" style="margin-left:8px" onclick="showView('today')">Ver plan de hoy</button></div><div class="card"><h3>Lectura rápida</h3><table class="clarity-table"><tr><td>Hecho</td><td>${snap.completed} ejercicios · ${snap.exams.length} simulacros · ${snap.writingCount} writings</td></tr><tr><td>Duda</td><td>${snap.partial} respuestas ❔. Objetivo: convertirlas en ✅.</td></tr><tr><td>Riesgo</td><td>${weak.slice(0,2).map(w=>safeText(w.title)).join(' + ') || 'Sin datos suficientes'}</td></tr><tr><td>Próximo hito</td><td>${stageInfoFromSnapshot(snap).next}</td></tr></table></div></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Zona roja / prioridad</h3>${moduleStatusRows(weak.slice(0,5))}</div><div class="card"><h3>Estados explicados</h3><div class="status-explain"><div>${badgeHTML('Rojo','red')}<br><span class="small muted">Necesita teoría + práctica.</span></div><div>${badgeHTML('Amarillo','yellow')}<br><span class="small muted">Se entiende, pero inestable.</span></div><div>${badgeHTML('Azul','blue')}<br><span class="small muted">B2 en camino.</span></div><div>${badgeHTML('Verde','green')}<br><span class="small muted">Fuerte, solo mantener.</span></div></div><div class="share-box"><b>Para tu chica:</b> usa “Vista visitante” o copia un enlace. No podrá modificar tu progreso; solo verá dónde estás y qué toca.</div></div></div>`; }
function visitorHTML(snapshot, fromUrl=false){ const snap=snapshot||visitorSnapshotFromURL()||makeProgressSnapshot(); const stage=stageInfoFromSnapshot(snap); const weak=snap.weakModules||[]; const modules=(snap.modules||[]).slice().sort((a,b)=>a.mastery-b.mastery||b.priority-a.priority); const progress=Math.round(snap.weightedScore||0); const supportTips=[`Pregúntale por ${weak[0]?weak[0].title:'el módulo que más le cueste'} y deja que te lo explique en voz alta.`, 'Recuérdale que no necesita hacerlo perfecto: lo importante es convertir dudas en respuestas seguras.', `Si ves que se agobia, anímale a seguir el siguiente paso: ${stage.next}`]; return `<div class="love-tour"><div class="love-hero"><span class="love-pill">💗 Tour de amor · vista visitante</span><h2>Así va ${safeText(snap.profile?.name||'Carlos')}</h2><p>Esta vista está pensada para que su chica entienda la web sin perderse. Aquí ves <b>dónde está</b>, <b>cómo va</b> y <b>hacia dónde va</b> en su camino al B2 para Erasmus. Es solo lectura y está hecha con cariño.</p><div class="btn-row" style="margin-top:14px"><button class="btn visitor-soft-btn" onclick="enterOwnerMode()">Entrar como Carlos</button>${fromUrl||location.hash.startsWith('#visitor=')?'<button class="btn visitor-soft-ghost" onclick="history.replaceState(null,\'\',location.pathname+location.search);showView(\'visitor\',{snapshot:makeProgressSnapshot(),localPreview:true})">Ver datos de este navegador</button>':'<button class="btn visitor-soft-ghost" onclick="copyVisitorLink()">Copiar enlace visitante</button>'}</div></div><div class="love-row"><div class="love-card"><h3>💌 Resumen humano</h3><p><b>En qué punto está:</b> ${safeText(stage.summary)}</p><p><b>Cómo va:</b> Lleva <b>${snap.completed||0}</b> ejercicios, <b>${snap.exams.length}</b> simulacros y un dominio ponderado de <b>${progress}%</b>.</p><p><b>Hacia dónde va:</b> ${safeText(stage.next)}</p><div class="love-note"><b>Lectura rápida:</b> Verde = fuerte, azul = en camino, amarillo = entendiendo, naranja = necesita práctica, rojo = prioridad máxima.</div></div><div class="love-card"><h3>🩷 Marcador general</h3><div class="love-meter"><div class="love-ring" style="--v:${progress}"><span>${progress}%</span></div><div><div class="love-list"><div class="love-list-item"><span>✅ Correctas</span><b>${snap.correct||0}</b></div><div class="love-list-item"><span>❔ Dudosas</span><b>${snap.partial||0}</b></div><div class="love-list-item"><span>❌ Incorrectas</span><b>${snap.incorrect||0}</b></div><div class="love-list-item"><span>⭐ XP y racha</span><b>${snap.xp||0} XP · ${snap.streak||0} días</b></div></div></div></div></div></div><div class="love-card"><h3>🌸 Tour de la web para tu chica</h3><div class="love-tour-steps"><div class="love-step"><div class="num">1</div><b>Mira el resumen</b><p>Lee el bloque “Resumen humano”. Te cuenta dónde está Carlos sin tecnicismos.</p></div><div class="love-step"><div class="num">2</div><b>Fíjate en el marcador</b><p>El círculo rosa resume cómo va en conjunto y cuántas respuestas seguras o dudosas tiene.</p></div><div class="love-step"><div class="num">3</div><b>Revisa prioridades</b><p>Los módulos en rojo y naranja son donde más apoyo y estudio necesita ahora mismo.</p></div><div class="love-step"><div class="num">4</div><b>Mira el siguiente paso</b><p>La web te dice exactamente cuál es el próximo movimiento recomendado para avanzar.</p></div></div></div><div class="love-row"><div class="love-card"><h3>📍 Prioridades actuales</h3>${weak.length?moduleStatusRows(weak):'<p class="muted">Aún no hay suficientes datos para detectar prioridades.</p>'}<div class="love-note" style="margin-top:12px"><b>Qué significa esto:</b> si aquí aparece un módulo arriba del todo, es porque la web cree que le dará más puntos mejorar justo eso.</div></div><div class="love-card"><h3>🗺️ Hacia dónde va</h3><div class="journey">${['Base gramatical','Use of English','Reading','Writing','B2 listo'].map((label,i)=>{const cls=i<stage.step?'done':i===stage.step?'now':i===stage.step+1?'next':''; return `<div class="journey-step ${cls}"><b>${label}</b><span class="small muted">${i<stage.step?'Superado':i===stage.step?'Punto actual':i===stage.step+1?'Siguiente hito':'Más adelante'}</span></div>`;}).join('')}</div><div class="love-note" style="margin-top:12px"><b>Objetivo visible:</b> ${safeText(snap.profile?.goal||'B2 Erasmus')} ${snap.profile?.examDate?`· <b>Fecha:</b> ${safeText(snap.profile.examDate)}`:''}</div></div></div><div class="love-row"><div class="love-card"><h3>🎀 Cómo puede ayudarle su chica</h3><ul class="love-support"><li>${safeText(supportTips[0])}</li><li>${safeText(supportTips[1])}</li><li>${safeText(supportTips[2])}</li><li>Dile que una duda ❔ no es un desastre: es una respuesta a medio camino de ser segura.</li></ul></div><div class="love-card"><h3>✨ Últimos simulacros y logros</h3>${(snap.exams||[]).length?(snap.exams||[]).slice().reverse().slice(0,4).map(e=>`<div class="love-list-item"><span><b>${safeText(e.title)}</b><br><span class="small muted">${safeText(e.date||'')}</span></span><span class="love-tag">${e.score}%</span></div>`).join(''):'<p class="muted">Aún no hay simulacros registrados.</p>'}<div style="margin-top:12px"></div>${(snap.achievements||[]).length?(snap.achievements||[]).slice(0,5).map(a=>`<span class="badge green">✓</span> ${safeText(a.title)}<br>`).join(''):'<p class="muted">Sin logros visibles todavía.</p>'}</div></div><div class="love-card"><h3>📚 Mapa completo de módulos</h3><p class="muted">Si quiere entender la foto completa, aquí puede ver todos los módulos con su estado. Solo lectura.</p>${moduleStatusRows(modules)}</div></div>`; }
function settingsHTML(){ return `<div class="card"><h3>Ajustes y datos</h3><label><input type="checkbox" ${state.settings.autoTheory?'checked':''} onchange="state.settings.autoTheory=this.checked;save()"> Autoabrir teoría al fallar en práctica</label><br><br><label><input type="checkbox" ${state.settings.coachMode?'checked':''} onchange="state.settings.coachMode=this.checked;save();render()"> Mostrar coach y recomendaciones</label><br><br><label>Objetivo diario de ejercicios <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.dailyGoal}" onchange="state.settings.dailyGoal=Number(this.value)||30;save()"></label><br><br><label>Tamaño sesión recomendada <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.preferredSession||20}" onchange="state.settings.preferredSession=Number(this.value)||20;save()"></label><hr><h3>Criterio de corrección v10</h3><div class="grid cols-3"><div class="card flat"><span class="score-chip ok">✅ Bien = 1</span><p class="small muted">Coincide con una respuesta aceptada. Mayúsculas y puntuación final no te castigan.</p></div><div class="card flat"><span class="score-chip partial">❔ Dudosa = 0,5</span><p class="small muted">Intención correcta con fallo pequeño: spelling leve, keyword incompleta, demasiadas palabras en open cloze o transformation parcialmente construida.</p></div><div class="card flat"><span class="score-chip no">❌ Mal = 0</span><p class="small muted">No encaja con la estructura que pedía el ejercicio.</p></div></div><div class="qa-banner"><b>Importante:</b> v10 no usa ❔ para regalarte puntos. Lo usa para separar “no tenía ni idea” de “lo entendí, pero no respeté formato”. En simulacro, las ❔ cuentan 0,5 para entrenar; en una prueba real pueden depender del tipo de ejercicio y del corrector.</div><h3>Contratos de respuesta</h3><table class="exam-table"><tr><th>Tipo</th><th>Qué debes escribir</th><th>Error típico</th></tr><tr><td>Open cloze</td><td>UNA palabra</td><td>meter una frase</td></tr><tr><td>Word formation</td><td>UNA palabra derivada</td><td>dejar la base sin cambiar</td></tr><tr><td>Transformation</td><td>2-5 palabras con keyword</td><td>escribir solo el verbo que cambia</td></tr><tr><td>Multiple choice</td><td>una opción</td><td>elegir por traducción literal</td></tr></table><hr><div class="btn-row"><button class="btn secondary" onclick="exportProgress()">Exportar progreso</button><button class="btn secondary" onclick="importProgress()">Importar progreso</button><button class="btn bad" onclick="resetProgress()">Reiniciar</button></div><p class="source-note">El progreso se guarda en este navegador con localStorage. Si cambias de dispositivo, exporta/importa.</p></div>`; }

function sessionHTML(){ const s=state.session; if(!s || s.completed) return `<div class="empty"><h3>No hay sesión activa</h3><button class="btn" onclick="startSmartSession()">Empezar sesión inteligente</button></div>`; const q=exerciseById(s.ids[s.index]); if(!q) return `<div class="empty">Pregunta no encontrada.</div>`; const answered=s.responses[q.id]; const exam=s.mode==='exam'; const part=examPartForQuestion(q); return `<div class="focus-strip"><div><b>${exam?'Modo examen':'Modo práctica'}</b> · ${s.title} · ${s.index+1}/${s.ids.length}<br><span class="small muted">${part}</span></div><div class="btn-row"><button class="btn secondary" onclick="pauseSession()">Salir sin perder</button>${exam?'<span class="pill warn">sin pistas</span>':''}</div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><span class="pill ${exam?'warn':''}">${exam?'Modo examen':'Modo práctica'}</span> <span class="pill">${moduleById(q.module)?.title}</span></div><div class="small muted">${s.minutes?`${s.minutes} min · `:''}${s.index+1}/${s.ids.length}</div></div>${pctBar(Math.round((s.index)/s.ids.length*100))}</div><div class="question-box" style="margin-top:16px">${q.passage?`<div class="passage">${wikiText(q.passage,{max:8})}</div>`:''}${typeGuideHTML(q, exam)}<div class="prompt-block"><div class="small muted">${q.difficulty} · ${questionKind(q).replace('_',' ')}</div><div class="question-prompt">${wikiText(q.prompt,{max:12})}</div>${!exam?`<div class="wiki-help small">💡 Mini Wiki: pasa el ratón o toca las palabras subrayadas para ver explicación sin salir del test. <button class="btn ghost" style="padding:6px 9px;margin-left:8px" onclick="openMiniWiki()">Abrir mini wiki</button></div>`:''}</div>${questionInputHTML(q, answered)}<div id="formatWarning" class="input-warning"></div><div id="feedbackArea">${answered && !exam?feedbackHTML(q,answered):''}</div><div class="btn-row" style="margin-top:16px">${!answered?`<button class="btn" onclick="submitAnswer('${q.id}')">${exam?'Guardar respuesta':'Comprobar / Guardar'}</button>`:`<button class="btn" onclick="nextQuestion()">${s.index===s.ids.length-1?'Finalizar':'Siguiente'}</button>`}${!exam?`<button class="btn ghost" onclick="showHint('${q.id}')">Pista sin spoiler</button><button class="btn secondary" onclick="showView('theory',{id:'${q.module}'})">Ver teoría</button>`:''}<button class="btn secondary" onclick="pauseSession()">Salir sin perder sesión</button></div>${exam?`<div class="feedback info"><b>Modo examen:</b> instrucciones visibles, pero sin pista ni teoría hasta finalizar. Responde y sigue. Al final recibirás informe por módulos.</div>`:''}</div>`; }

function questionInputHTML(q, answered){ const c=answerContract(q); if(q.type==='mcq'){ return `<div class="options">${q.options.map(opt=>{const selected=answered&&normalize(answered.given)===normalize(opt); const st=answerStatus(answered); return `<button class="option ${selected?(st==='correct'?'correct':st==='partial'?'partial':'wrong'):''} ${answered&&isCorrect(q,opt)?'correct':''}" onclick="selectOption(this,'${escapeAttr(opt)}')" ${answered?'disabled':''}>${wikiText(opt,{max:4})}</button>`}).join('')}</div><input type="hidden" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}">`; } if(q.type==='writing'){ return `<textarea class="textarea" id="currentAnswer" placeholder="Escribe aquí 140-190 palabras..."></textarea><div class="small muted" id="wordCount">0 palabras</div>`; } return `<input class="answer-input" id="currentAnswer" value="${answered?escapeAttr(answered.given):''}" placeholder="${escapeAttr(c.placeholder||'Escribe tu respuesta')}" ${answered?'disabled':''} oninput="liveFormatWarning('${q.id}')"><div class="answer-help">${c.title}. ${c.rule.replace(/<[^>]+>/g,'')}</div>`; }

function liveFormatWarning(id){ const q=exerciseById(id); const el=$('currentAnswer'); const box=$('formatWarning'); if(!q||!el||!box)return; const val=el.value||''; const kind=questionKind(q); const words=looseNormalize(val).split(' ').filter(Boolean); let msg=''; if(kind==='open_cloze' && words.length>1) msg='Open cloze pide UNA palabra. Borra artículos/frases extra.'; if(kind==='word_formation' && words.length>1) msg='Word formation pide UNA palabra derivada, no una frase.'; if(kind==='transformation'){ const kw=looseNormalize(q.keyWord||''); if(words.length && words.length<2) msg='Transformation: probablemente falta la keyword o más parte del hueco.'; else if(kw && words.length && !words.includes(kw)) msg='Falta la keyword obligatoria: '+q.keyWord+'.'; else if(words.length>5) msg='Transformation B2 suele pedir 2-5 palabras.'; } box.style.display=msg?'block':'none'; box.textContent=msg; }

function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function selectOption(btn,opt){ document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); $('currentAnswer').value=opt; }
function feedbackHTML(q,a){ const st=answerStatus(a); const good=st==='correct', partial=st==='partial'; const c=answerContract(q); const res=exerciseResourceHTML(q); const resourceBtn=(q.resourceTarget&&q.resourceTarget.startsWith('irregular:'))?`<button class="btn ghost" onclick="openIrregularVerb('${escapeAttr(q.resourceTarget.split(':')[1])}')">Ver ficha exacta del verbo</button>`:''; return `<div class="feedback ${good?'good':partial?'partial':'bad'}"><h3>${good?'✅ Bien':partial?'❔ Casi / respuesta dudosa':'❌ Fallo útil'}</h3><p><b>Tu respuesta:</b> ${a.given||'—'} ${partial?'<span class="pill partial">0,5 puntos</span>':''}</p><p><b>Respuesta modelo:</b> ${q.answer[0]}</p>${a.reason?`<p><b>Criterio:</b> ${a.reason}</p>`:''}<div class="format-note"><b>Formato que se pedía:</b> ${c.rule}<br><b>Clave después de corregir:</b> ${wikiText(q.clue||'Mira la estructura alrededor del hueco.',{max:6})}</div>${exerciseMicroHTML(q)}${res}<p><b>Explicación de la regla:</b> ${wikiText(q.explanation,{max:10})}</p><p><b>Trampa típica:</b> ${wikiText(q.trap||'Responder por traducción literal.',{max:8})}</p>${!good?`<div class="manual-actions"><button class="btn warn" onclick="showView('theory',{id:'${q.module}'})">Ir a la teoría de este fallo</button> ${resourceBtn} <button class="btn ghost" onclick="markAnswerAsPartial('${q.id}')">Marcar como ❔ duda personal</button><p class="small muted">Úsalo solo si de verdad entendiste la idea pero el formato te pilló. En examen queremos convertirlo en ✅.</p></div>`:''}</div>`; }
function showHint(id){ const q=exerciseById(id); toast(`<b>Pista sin spoiler:</b> ${safeHint(q)}`); }

function markAnswerAsPartial(id){ const q=exerciseById(id); if(!q)return; const s=state.session; const target=(s&&s.responses&&s.responses[id])?s.responses[id]:state.answers[id]; if(!target)return; target.status='partial'; target.correct=false; target.score=.5; target.reason='Marcado como ❔ duda personal: intención parcialmente correcta, pero requiere revisar formato exacto de examen.'; target.manualPartial=true; state.answers[id]=target; if(s&&s.responses)s.responses[id]=target; save(); render(); toast('Marcado como ❔ duda personal. Ahora toca reentrenarlo para convertirlo en ✅.'); }

function submitAnswer(id){ const s=state.session; const q=exerciseById(id); let val=$('currentAnswer')?.value||''; if(q.type==='mcq' && !val){toast('Elige una opción.');return} if(q.type==='input' && !val.trim()){toast('Escribe una respuesta.');return} validateFormatBeforeSubmit(q,val); const ev=evaluateAnswer(q,val); const record={given:val, correct:ev.status==='correct', status:ev.status, score:ev.score, reason:ev.reason, date:new Date().toISOString(), module:q.module, kind:questionKind(q)}; s.responses[q.id]=record; state.answers[q.id]=record; state.events.push({type:'answer',status:ev.status,module:q.module,kind:questionKind(q),date:new Date().toISOString()}); markStudy(); addXP(ev.status==='correct'?10:ev.status==='partial'?7:4); if(ev.status==='incorrect' && state.settings.autoTheory && s.mode!=='exam'){ save(); showView('theory',{id:q.module}); return; } save(); render(); }
function nextQuestion(){ const s=state.session; if(s.index < s.ids.length-1){ s.index++; save(); render(); } else completeSession(); }
function pauseSession(){ save(); showView('dashboard'); toast('Sesión guardada. Puedes volver cuando quieras.'); }
function completeSession(){ const s=state.session; const total=s.ids.length; const corr=s.ids.filter(id=>answerStatus(s.responses[id])==='correct').length; const part=s.ids.filter(id=>answerStatus(s.responses[id])==='partial').length; const weighted=s.ids.reduce((sum,id)=>sum+answerScore(s.responses[id]),0); const score=Math.round(weighted/total*100); const by={}; s.ids.forEach(id=>{const q=exerciseById(id); if(!q)return; const a=s.responses[id]; by[q.module]=by[q.module]||{t:0,c:0,p:0,w:0}; by[q.module].t++; if(answerStatus(a)==='correct') by[q.module].c++; if(answerStatus(a)==='partial') by[q.module].p++; by[q.module].w+=answerScore(a);}); s.completed=true; const hist={title:s.title, profile:s.profile||s.mode, score, correct:corr, partial:part, weighted,total,date:new Date().toLocaleString(), by}; state.examHistory=state.examHistory||[]; if(s.mode==='exam') state.examHistory.push(hist); addXP(score>=75?40:score>=60?25:12); save(); showReport(hist, s.mode!=='exam'); state.session=null; save(); }
function showReport(hist, practice=false){ const weak=Object.entries(hist.by).map(([id,v])=>({id,score:Math.round((v.w ?? v.c)/v.t*100),...v})).sort((a,b)=>a.score-b.score).slice(0,5); const html=`<h2>Informe: ${hist.title}</h2><div class="grid cols-3"><div class="card"><div class="muted small">Resultado ponderado</div><div class="big-number">${hist.score}%</div>${pctBar(hist.score)}<p class="small muted">✅ 1 punto · ❔ 0,5 · ❌ 0</p></div><div class="card"><div class="muted small">Detalle</div><div class="big-number">${hist.correct}/${hist.total}</div><p>✅ correctas · ❔ ${hist.partial||0} dudosas · ❌ ${hist.total-hist.correct-(hist.partial||0)} fallos</p></div><div class="card"><div class="muted small">Lectura real</div><p>${hist.score>=75?'Vas en zona de candidato serio. Mantén simulacros y writing.':hist.score>=60?'B1 alto/B2 raspado. Hay que convertir las ❔ en ✅ y machacar fallos concretos.':'Aún no es zona B2. No estudies más temas: trabaja tus rojos y dudas.'}</p></div></div><h3>Módulos débiles</h3>${weak.map(w=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${moduleById(w.id)?.title}</b><span>${w.score}% ${w.p?`· ❔ ${w.p}`:''}</span></div>${pctBar(w.score)}<button class="btn ghost" style="margin-top:8px" onclick="closeModal();showView('theory',{id:'${w.id}'})">Ver teoría</button> <button class="btn" style="margin-top:8px" onclick="closeModal();startModuleSession('${w.id}',12)">Practicar</button></div>`).join('')}<div class="btn-row"><button class="btn" onclick="closeModal();startSmartSession()">Siguiente sesión inteligente</button><button class="btn secondary" onclick="closeModal();showView('progress')">Ver progreso</button></div>`; openModal(html); }
function openModal(html){$('modal').innerHTML=html;$('modalBack').style.display='flex'} function closeModal(){$('modalBack').style.display='none'}
$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function pickQuestions(mods,count,preferWeak=false){ let pool=EXERCISES.filter(q=>mods.includes(q.module)&&!['writing','tracker'].includes(q.type)); if(!pool.length) pool=EXERCISES.filter(q=>!['writing','tracker'].includes(q.type)); const scored=pool.map(q=>{const a=state.answers[q.id]; const m=moduleById(q.module); let score=Math.random(); if(!a) score+=5; if(a && answerStatus(a)==='incorrect') score+=8; if(a && answerStatus(a)==='partial') score+=5; if(preferWeak) score+=(100-mastery(q.module))/12; score+=(m?.priority||5)/10; return {q,score};}).sort((a,b)=>b.score-a.score); return scored.slice(0,Math.min(count,scored.length)).map(x=>x.q.id); }
function startSession(title, ids, mode='practice', profile='custom'){ state.session={title,ids,index:0,responses:{},mode,profile,startedAt:new Date().toISOString(),completed:false}; save(); showView('session'); }
function startCustomSession(ids,title='Sesión personalizada'){ startSession(title,ids,'practice','custom'); }
function startModuleSession(id,count=10){ const m=moduleById(id); const ids=pickQuestions([id],count,true); startSession(m.title, ids, 'practice', id); }
function startSmartSession(){ const mods=weakModules(6).map(m=>m.id); const ids=pickQuestions(mods,20,true); startSession('Sesión inteligente: zona roja', ids, 'practice','smart'); }
function startMistakeSession(){ const ids=Object.entries(state.answers).filter(([id,a])=>answerStatus(a)!=='correct').map(([id])=>id); if(!ids.length){toast('Aún no tienes fallos ni dudas. Haz diagnóstico primero.'); return;} startSession('Reentreno de fallos y dudas', ids.slice(-30).reverse(), 'practice','mistakes'); }
function startExam(id){ const p=EXAM_PROFILES.find(x=>x.id===id); if(!p)return; const ids=pickQuestions(p.modules,p.count,true); startSession(p.title, ids, 'exam', p.id); state.session.minutes=p.minutes; save(); }
function quickContinue(){ if(state.session && !state.session.completed) showView('session'); else startSmartSession(); }
function openWriting(id){ const q=exerciseById(id); const html=`<h2>${q.clue}: Writing practice</h2><p>${q.prompt}</p><textarea class="textarea" id="writingBox" oninput="updateWritingCount()"></textarea><p id="writingCount" class="muted">0 palabras</p><div class="feedback info"><b>Checklist B2:</b><ul><li>140-190 palabras</li><li>4 párrafos claros</li><li>2-4 conectores</li><li>Responde todos los puntos</li><li>Revisa present perfect, articles y prepositions</li></ul></div><button class="btn" onclick="saveWriting('${id}')">Guardar writing</button>`; openModal(html); }
function updateWritingCount(){ const words=($('writingBox').value.trim().match(/\b\S+\b/g)||[]).length; $('writingCount').textContent=words+' palabras'; }
function saveWriting(id){ const text=$('writingBox').value; const words=(text.trim().match(/\b\S+\b/g)||[]).length; state.writing.push({id,text,words,date:new Date().toISOString()}); markStudy(); addXP(words>=140&&words<=190?30:12); save(); closeModal(); toast('Writing guardado. Palabras: '+words); render(); }
function saveListening(){ state.listening.push({min:$('listenMin').value,diff:$('listenDiff').value,task:$('listenTask').value,notes:$('listenNotes').value,date:new Date().toISOString()}); addXP(8); markStudy(); save(); render(); toast('Listening guardado.'); }
function exportProgress(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='erasmus-b2-progress.json'; a.click(); URL.revokeObjectURL(url); }
function importProgress(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=()=>{const f=inp.files[0]; const r=new FileReader(); r.onload=()=>{try{state={...state,...JSON.parse(r.result)}; save(); render(); toast('Progreso importado');}catch(e){toast('Archivo inválido')}}; r.readAsText(f)}; inp.click(); }

/* v13: clear progress states + visitor/owner views. Static, no backend. */
function stateLabelFromScore(score, done=0){
  if(!done) return {label:'No empezado', cls:'none', explain:'Todavía no hay datos suficientes.'};
  if(score < 35) return {label:'Rojo', cls:'red', explain:'Riesgo alto: aquí se pierden puntos.'};
  if(score < 55) return {label:'Naranja', cls:'orange', explain:'Entendido a medias: toca teoría + práctica.'};
  if(score < 70) return {label:'Amarillo', cls:'yellow', explain:'Aprobable, pero inestable en examen.'};
  if(score < 85) return {label:'Azul', cls:'blue', explain:'Camino B2: consolidar con simulacros.'};
  return {label:'Verde', cls:'green', explain:'Fuerte: repaso ligero y mantener.'};
}
function stageInfoFromSnapshot(snap){
  const r = Number(snap.readiness||0), done=Number(snap.completed||0), exams=(snap.exams||[]).length;
  if(done < 15 && !exams) return {label:'Fase 0 · Falta diagnóstico', cls:'none', next:'Hacer diagnóstico B2 para no estudiar a ciegas.', summary:'Aún no sabemos bien dónde está Carlos.'};
  if(r < 45) return {label:'Fase 1 · Construir base', cls:'red', next:'Atacar zona roja: irregulares, perfect tenses y Use of English.', summary:'Está empezando o tiene huecos fuertes. Hay que convertir fallos repetidos en reglas simples.'};
  if(r < 60) return {label:'Fase 2 · B1 alto hacia B2', cls:'orange', next:'Sesiones cortas de fallos + módulos débiles + mini simulacro.', summary:'Ya hay trabajo hecho, pero todavía no es estable para B2.'};
  if(r < 75) return {label:'Fase 3 · B2 raspado', cls:'yellow', next:'Convertir dudas ❔ en aciertos ✅ y practicar simulador blueprint.', summary:'Puede acercarse al B2, pero necesita regularidad y evitar errores de formato.'};
  if(r < 85) return {label:'Fase 4 · Candidato B2 serio', cls:'blue', next:'Simulacros completos, writing y revisión fina.', summary:'Va en zona seria. El objetivo es mantener y no regalar puntos.'};
  return {label:'Fase 5 · B2 bastante sólido', cls:'green', next:'Mantener con simulacros y writing. No sobreestudiar teoría nueva.', summary:'Progreso fuerte: toca consolidar y llegar fresco al examen.'};
}
function latestExamSnapshot(){ const h=(state.examHistory||[]); return h.length?h[h.length-1]:null; }
function publicModuleStats(){ return MODULES.map(m=>{ const st=getModuleStats(m.id); const mas=mastery(m.id); const lab=stateLabelFromScore(mas, st.done); return {id:m.id,title:m.title,group:m.group,priority:m.priority,mastery:mas,done:st.done,total:st.total,accuracy:st.acc,correct:st.correct,partial:st.partial,status:lab.label,statusClass:lab.cls,goal:m.goal}; }); }
function makeProgressSnapshot(){
  const modules=publicModuleStats(); const weak=modules.filter(m=>m.priority>=7 && !['writing','listening'].includes(m.id)).sort((a,b)=>a.mastery-b.mastery || b.priority-a.priority).slice(0,5);
  const next=weak[0] || null; const plan=planProgressToday(); const exams=(state.examHistory||[]).slice(-5).map(e=>({title:e.title,profile:e.profile,score:e.score,correct:e.correct,partial:e.partial,total:e.total,date:e.date}));
  return {type:'erasmus-b2-visitor-snapshot', build:'v14', profile:{name:state.settings?.profileName||'Carlos', examDate:state.settings?.examDate||'', goal:state.settings?.goalText||'Conseguir una prueba escrita B2 seria para Erasmus'}, generatedAt:new Date().toLocaleString(), readiness:readiness(), accuracy:accuracy(), completed:completedCount(), correct:correctCount(), partial:partialCount(), incorrect:Math.max(0,completedCount()-correctCount()-partialCount()), xp:state.xp||0, level:level(), streak:state.streak||0, daily:plan, nextModule:next, weakModules:weak, modules, exams, achievements:ACHIEVEMENTS.map(a=>({title:a.title,done:!!state.achievements[a.id]})), activeSession:state.session && !state.session.completed ? {title:state.session.title,index:state.session.index+1,total:state.session.ids.length} : null, writingCount:(state.writing||[]).length, listeningCount:(state.listening||[]).length};
}
function compactPublicSnapshot(){ const s=makeProgressSnapshot(); return {...s, modules:s.modules.map(m=>({id:m.id,title:m.title,group:m.group,mastery:m.mastery,done:m.done,total:m.total,status:m.status,statusClass:m.statusClass,priority:m.priority})), weakModules:s.weakModules.map(m=>({id:m.id,title:m.title,mastery:m.mastery,status:m.status,statusClass:m.statusClass})), achievements:s.achievements.filter(a=>a.done)}; }
function utf8ToB64Url(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlToUtf8(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str); const bytes=new Uint8Array([...bin].map(ch=>ch.charCodeAt(0))); return new TextDecoder().decode(bytes); }
function encodeSnapshot(obj){ return utf8ToB64Url(JSON.stringify(obj)); }
function decodeSnapshot(raw){ try{return JSON.parse(b64UrlToUtf8(raw));}catch(e){return null;} }
function visitorSnapshotFromURL(){ const h=location.hash||''; if(!h.startsWith('#visitor=')) return null; return decodeSnapshot(h.slice('#visitor='.length)); }
function visitorLink(){ return location.origin + location.pathname + '#visitor=' + encodeSnapshot(compactPublicSnapshot()); }
function copyVisitorLink(){ const link=visitorLink(); if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>toast('Enlace de visitante copiado.')).catch(()=>showCopyLink(link));} else showCopyLink(link); }

function dashboardHTML(){ const snap=makeProgressSnapshot(); const rec=recommendedAction(); const weak=snap.weakModules||[]; return `${audienceSwitchHTML()}<div class="hero"><h2>Panel de control B2</h2><p>Esta es tu vista de trabajo: qué punto estás, qué toca ahora y hacia dónde vas. La vista visitante enseña lo mismo, pero en modo solo lectura y explicado para alguien externo.</p></div>${clearProgressSummaryHTML(snap)}<div class="north-star"><div class="card owner-only"><h3>Tu siguiente acción</h3><p class="muted">No elijas al azar. Sigue este botón salvo que estés haciendo un simulacro.</p><h2>${safeText(rec.title)}</h2><p>${safeText(rec.desc)}</p><button class="btn" onclick="${rec.action}">${safeText(rec.btn)}</button><button class="btn secondary" style="margin-left:8px" onclick="showView('today')">Ver plan de hoy</button></div><div class="card"><h3>Lectura rápida</h3><table class="clarity-table"><tr><td>Hecho</td><td>${snap.completed} ejercicios · ${snap.exams.length} simulacros · ${snap.writingCount} writings</td></tr><tr><td>Duda</td><td>${snap.partial} respuestas ❔. Objetivo: convertirlas en ✅.</td></tr><tr><td>Riesgo</td><td>${weak.slice(0,2).map(w=>safeText(w.title)).join(' + ') || 'Sin datos suficientes'}</td></tr><tr><td>Próximo hito</td><td>${stageInfoFromSnapshot(snap).next}</td></tr></table></div></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Zona roja / prioridad</h3>${moduleStatusRows(weak.slice(0,5))}</div><div class="card"><h3>Estados explicados</h3><div class="status-explain"><div>${badgeHTML('Rojo','red')}<br><span class="small muted">Necesita teoría + práctica.</span></div><div>${badgeHTML('Amarillo','yellow')}<br><span class="small muted">Se entiende, pero inestable.</span></div><div>${badgeHTML('Azul','blue')}<br><span class="small muted">B2 en camino.</span></div><div>${badgeHTML('Verde','green')}<br><span class="small muted">Fuerte, solo mantener.</span></div></div><div class="share-box"><b>Para tu chica:</b> us s</h3>${weak.length?moduleStatusRows(weak):'<p class="muted">Aún no hay datos suficientes.</p>'}</div><div class="card"><h3>Últimos simulacros</h3>${(snap.exams||[]).length?(snap.exams||[]).slice().reverse().map(e=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><b>${safeText(e.title)}</b><br><span class="pill ${e.score>=75?'good':e.score>=60?'warn':'bad'}">${e.score}%</span> <span class="small muted">${safeText(e.date||'')}</span></div>`).join(''):'<p class="muted">Aún no hay simulacros registrados.</p>'}<h3 style="margin-top:16px">Logros</h3>${(snap.achievements||[]).length?(snap.achievements||[]).map(a=>`<span class="badge green">✓</span> ${safeText(a.title)}<br>`).join(''):'<p class="muted">Sin logros visibles todavía.</p>'}</div></div><div class="card" style="margin-top:16px"><h3>Mapa completo de módulos</h3>${moduleStatusRows(modules)}</div>`; }
function progressHTML(){ const snap=makeProgressSnapshot(); const hist=(state.examHistory||[]).slice().reverse(); return `${audienceSwitchHTML()}${clearProgressSummaryHTML(snap)}<div class="grid cols-3" style="margin-top:16px"><div class="card"><div class="muted small">Dominio ponderado</div><div class="big-number">${snap.readiness}%</div>${pctBar(snap.readiness)}<p class="small muted">Promedia módulos prioritarios. ❔ vale 0,5.</p></div><div class="card"><div class="muted small">Cobertura real</div><div class="big-number">${snap.completed}</div><p class="muted">✅ ${snap.correct} · ❔ ${snap.partial} · ❌ ${snap.incorrect}</p></div><div class="card"><div class="muted small">Dirección</div><h3>${safeText(stageInfoFromSnapshot(snap).label)}</h3><p class="muted">${safeText(stageInfoFromSnapshot(snap).next)}</p></div></div><div class="card" style="margin-top:16px"><h3>Dominio por módulo con estados</h3>${moduleStatusRows(snap.modules)}</div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Historial de simulacros</h3>${hist.length?hist.map(h=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><b>${safeText(h.title)}</b><br><span class="pill ${h.score>=75?'good':h.score>=60?'warn':'bad'}">${h.score}%</span> ${h.partial?`<span class="pill partial">❔ ${h.partial} dudosas</span>`:''} <span class="small muted">${safeText(h.date)}</span></div>`).join(''):'<p class="muted">Aún no hay simulacros.</p>'}</div><div class="card"><h3>Logros</h3>${ACHIEVEMENTS.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${state.achievements[a.id]?'✅':'⬜'} ${safeText(a.title)}</b><br><span class="small muted">${safeText(a.condition)}</span></div>`).join('')}</div></div>`; }
function settingsHTML(){ return `<div class="card"><h3>Ajustes, perfil y datos</h3><div class="grid cols-2"><div><label><b>Nombre visible</b><input class="answer-input" value="${safeText(state.settings.profileName||'Carlos')}" onchange="state.settings.profileName=this.value||'Carlos';save()"></label><br><br><label><b>Fecha objetivo/examen</b><input class="answer-input" placeholder="Ej: jueves 11 de junio" value="${safeText(state.settings.examDate||'')}" onchange="state.settings.examDate=this.value;save()"></label><br><br><label><b>Objetivo visible</b><input class="answer-input" value="${safeText(state.settings.goalText||'Conseguir una prueba escrita B2 seria para Erasmus')}" onchange="state.settings.goalText=this.value;save()"></label></div><div class="share-box"><h3>Vista visitante / tour de amor</h3><p class="muted">Crea una vista solo lectura para que otra persona —por ejemplo tu chica— entienda tu progreso sin tocar ejercicios, con una presentación más clara y cariñosa.</p><div class="btn-row"><button class="btn" onclick="showView('visitor',{snapshot:makeProgressSnapshot(),localPreview:true})">Previsualizar</button><button class="btn secondary" onclick="copyVisitorLink()">Copiar enlace visitante</button></div></div></div><hr><label><input type="checkbox" ${state.settings.autoTheory?'checked':''} onchange="state.settings.autoTheory=this.checked;save()"> Autoabrir teoría al fallar en práctica</label><br><br><label><input type="checkbox" ${state.settings.coachMode?'checked':''} onchange="state.settings.coachMode=this.checked;save();render()"> Mostrar coach y recomendaciones</label><br><br><label>Objetivo diario de ejercicios <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.dailyGoal}" onchange="state.settings.dailyGoal=Number(this.value)||30;save()"></label><br><br><label>Tamaño sesión recomendada <input class="answer-input" style="max-width:150px" type="number" value="${state.settings.preferredSession||20}" onchange="state.settings.preferredSession=Number(this.value)||20;save()"></label><hr><h3>Criterio de corrección</h3><div class="grid cols-3"><div class="card flat"><span class="score-chip ok">✅ Bien = 1</span><p class="small muted">Respuesta aceptada.</p></div><div class="card flat"><span class="score-chip partial">❔ Dudosa = 0,5</span><p class="small muted">Intención correcta con fallo pequeño o formato incompleto.</p></div><div class="card flat"><span class="score-chip no">❌ Mal = 0</span><p class="small muted">No encaja con la estructura pedida.</p></div></div><hr><div class="btn-row"><button class="btn secondary" onclick="exportProgress()">Exportar progreso</button><button class="btn secondary" onclick="importProgress()">Importar progreso</button><button class="btn bad" onclick="resetProgress()">Reiniciar</button></div><p class="source-note">El progreso se guarda en este navegador con localStorage. Para otro dispositivo, usa exportar/importar o el enlace de visitante.</p></div>`; }
function render(){ const root=$('app'); if(currentView==='dashboard') root.innerHTML=dashboardHTML(); if(currentView==='today') root.innerHTML=todayHTML(); if(currentView==='roadmap') root.innerHTML=roadmapHTML(); if(currentView==='review') root.innerHTML=reviewHTML(); if(currentView==='diagnostic') root.innerHTML=diagnosticHTML(); if(currentView==='practice') root.innerHTML=practiceHTML(); if(currentView==='examMap') root.innerHTML=examMapHTML(); if(currentView==='exam') root.innerHTML=examHTML(); if(currentView==='theory') root.innerHTML=theoryHTML(currentParams.id); if(currentView==='mistakes') root.innerHTML=mistakesHTML(); if(currentView==='writing') root.innerHTML=writingHTML(); if(currentView==='listening') root.innerHTML=listeningHTML(); if(currentView==='progress') root.innerHTML=progressHTML(); if(currentView==='visitor') root.innerHTML=visitorHTML(currentParams.snapshot || visitorSnapshotFromURL() || makeProgressSnapshot(), !!visitorSnapshotFromURL()); if(currentView==='settings') root.innerHTML=settingsHTML(); if(currentView==='session') root.innerHTML=sessionHTML(); }
function showView(view, params={}){ if(view==='dashboard' && visitorSnapshotFromURL() && !params.forceOwner){ view='visitor'; params={snapshot:visitorSnapshotFromURL(),fromUrl:true}; } currentView=view; currentParams=params; setActiveNav(view); closeSidebar(); const titles={dashboard:'Inicio',today:'Plan de hoy',roadmap:'Hoja de ruta',review:'Repaso SRS',diagnostic:'Diagnóstico',practice:'Practicar',examMap:'Mapa de examen',exam:'Simulador de exámenes',theory:'Teoría',mistakes:'Fallos y dudas',writing:'Writing B2',listening:'Listening',progress:'Progreso',visitor:'Vista visitante',settings:'Ajustes',session:'Sesión activa'}; if($('crumbs')) $('crumbs').textContent=titles[view]||view; if($('pageTitle')) $('pageTitle').textContent=titles[view]||'Erasmus B2 Trainer'; render(); updateSidebar(); }
function updateSidebar(){ const sideNext=$('sideNext'), sideSession=$('sideSession'); if(!sideNext || !sideSession) return; if(currentView==='visitor' && visitorSnapshotFromURL()){ sideNext.innerHTML='<b>Vista visitante</b><br><span>Solo lectura. Pulsa “Entrar como Carlos” para salir.</span>'; sideSession.textContent='No modifica progreso.'; return; } const nm=nextModule(); sideNext.innerHTML = nm ? `<b>${safeText(nm.title)}</b><br><span>${mastery(nm.id)}% dominio · ${safeText(nm.goal)}</span>` : 'Ruta completada'; if(state.session && !state.session.completed){ const q=state.session.ids.length; sideSession.innerHTML=`<b>${safeText(state.session.title)}</b><br>${state.session.index+1}/${q} preguntas<br><button class="btn secondary" style="margin-top:8px;padding:8px 10px" onclick="showView('session')">Volver</button>`; } else sideSession.textContent='Sin sesión activa.'; }

showView('dashboard');
</script>
</body>
</html>
